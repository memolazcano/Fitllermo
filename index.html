/* ============================================================================
   9. NAVEGACIÓN ENTRE DÍAS Y RENDERIZADO PRINCIPAL
   ============================================================================ */
function syncRunInputsForDay(d) {
  if (state.completedDays && state.completedDays[d]) {
    var savedRun = (state.history || []).slice().reverse().find(function(h) {
      return h && h.type === 'run' && h.day === d;
    });
    if (savedRun) {
      state.runDistStr = String(savedRun.distKm || '');
      state.runTimeStr = String(savedRun.timeFormatted || '');
      state.runKcal = savedRun.kcal ? String(savedRun.kcal) : '';
      return;
    }
  }
  var draft = getRunDraft(d);
  state.runDistStr = draft.distStr;
  state.runTimeStr = draft.timeStr;
  state.runKcal = draft.kcal;
}

function selectDay(d) {
  blurAnyActiveInput();
  saveCurrentDaySnapshot();
  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;

  state.day = d;
  state.activeModal = null;
  restoreDaySnapshot(d);

  saveState();
  syncMetronomeLoop();
  render();
}

function toggleViewModal(modalName) {
  blurAnyActiveInput();
  state.activeModal = state.activeModal === modalName ? null : modalName;
  syncMetronomeLoop();
  render();
}

function toggleExpandEx(exId) {
  state.expandedExId = state.expandedExId === exId ? null : exId;
  saveState();
  render();
}

function toggleCompletedBlockExpand(blockId) {
  state.manualExpandedBlocks[blockId] = !state.manualExpandedBlocks[blockId];
  saveState();
  render();
}

function renderDaysStrip() {
  var days = getCycleDays();
  var nav = document.getElementById('daysStrip');
  if (!nav) return;
  var html = [];
  for (var i = 0; i < days.length; i++) {
    var d = days[i];
    var isAct = d.day === state.day && state.activeModal === null;
    var isDone = !!(state.completedDays && state.completedDays[d.day]);
    var cls = 'day-btn' + (isAct ? ' active' : '') + (isDone ? ' done' : '');
    html.push(
      '<button type="button" class="' + cls + '" onclick="selectDay(' + d.day + ')">' +
      '<span class="d-num">' + d.short + '</span>' +
      '<span class="d-tag">' + d.tag + '</span>' +
      '</button>'
    );
  }
  nav.innerHTML = html.join('');

  var pText = document.getElementById('weekPatternText');
  if (pText) pText.textContent = state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B';

  var pBtn = document.getElementById('panelToggleBtn');
  var hBtn = document.getElementById('historyToggleBtn');
  if (pBtn) pBtn.classList.toggle('active', state.activeModal === 'panel');
  if (hBtn) hBtn.classList.toggle('active', state.activeModal === 'history');
}

function render() {
  renderDaysStrip();
  var main = document.getElementById('mainContent');
  var mainBtn = document.getElementById('mainActionBtn');
  if (!main || !mainBtn) return;

  if (state.activeModal === 'panel') {
    mainBtn.className = 'btn-primary-action';
    mainBtn.innerHTML = '← Volver al Entrenamiento';
    renderControlPanelView(main);
    return;
  }

  if (state.activeModal === 'history') {
    mainBtn.className = 'btn-primary-action';
    mainBtn.innerHTML = '← Volver al Entrenamiento';
    renderHistoryView(main);
    return;
  }

  var days = getCycleDays();
  var dayObj = days.find(function(d) { return d.day === state.day; }) || days[0];
  var effectiveType = dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;

  if (effectiveType === 'run') {
    mainBtn.className = 'btn-primary-action';
    mainBtn.innerHTML = '✓ Guardar Trote';
    renderRunView(main, dayObj.type === 'run_opt');
    return;
  }

  if (effectiveType === 'rest') {
    mainBtn.className = 'btn-primary-action';
    mainBtn.innerHTML = '✓ Marcar Descanso';
    renderRestView(main, dayObj.type === 'run_opt');
    return;
  }

  /* VISTA DE FUERZA: CONSOLA UNIFICADA + BLOQUES REORDENADOS */
  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);
  if (state.stepIndex >= steps.length) {
    state.stepIndex = Math.max(0, steps.length - 1);
  }
  var curStep = steps[state.stepIndex] || steps[0];
  var curEx = curStep.ex;
  var effWeight = curEx.weightKey ? getEffectiveWeight(curEx.weightKey, curEx.defaultWeight) : 0;
  var overload = getOverloadSuggestion(curEx);

  if (state.isResting) {
    mainBtn.className = 'btn-primary-action resting-mode';
    mainBtn.innerHTML = '⏭ Saltar Descanso y Seguir';
  } else {
    mainBtn.className = 'btn-primary-action';
    var restTag = curStep.restAfter > 0 ? curStep.restAfter + 's' : 'Fin';
    mainBtn.innerHTML = '✓ Serie Completada (' + restTag + ')';
  }

  var curCustomW = curEx.weightKey && state.customWeights[curEx.weightKey] !== undefined
    ? state.customWeights[curEx.weightKey]
    : '';

  var undoBtnHTML = canUndoLastStep()
    ? '<button type="button" class="undo-step-btn" title="Deshacer la serie anterior" onclick="undoLastStep()">↶ Deshacer</button>'
    : '';

  var unifiedConsoleHTML = '';
  if (state.isResting) {
    var nextCode = steps[state.stepIndex + 1] ? steps[state.stepIndex + 1].ex.code : 'FIN';
    unifiedConsoleHTML = [
      '<section class="unified-console resting">',
      '<div class="uc-top">',
      '<div class="status-pill"><span class="pulse"></span> DESCANSANDO · ' + curStep.restLabel + '</div>',
      '<div style="display:flex;align-items:center;gap:6px">',
      undoBtnHTML,
      '<span class="capsule-pill">Paso ' + (state.stepIndex + 1) + '/' + steps.length + '</span>',
      '</div>',
      '</div>',
      '<div class="uc-rest-body">',
      '<div class="timer-display" id="liveTimerVal">' + state.restRemaining.toFixed(1) + 's</div>',
      '<div class="timer-controls">',
      '<button type="button" class="mini-t-btn" onclick="adjustRestTime(-15)">-15s</button>',
      '<button type="button" class="mini-t-btn" onclick="adjustRestTime(15)">+15s</button>',
      '<button type="button" class="mini-t-btn" onclick="skipRest()">Saltar ⏭</button>',
      '</div>',
      '<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">',
      'SIGUIENTE: <strong style="color:var(--text)">' + nextCode + '</strong>',
      '</div>',
      '</div>',
      '</section>'
    ].join('');
  } else {
    var metroClass = 'metro-quick-btn' + (state.metroEnabled ? ' on' : '');
    var metroText = '⏱ ' + Number(state.metroIntervalSec).toFixed(1) + 's ' + (state.metroEnabled ? 'ON' : 'OFF');
    var limbHtml = curStep.limbLabel ? '<span class="limb-badge">' + curStep.limbLabel + '</span>' : '';
    var weightSectionHtml = '';

    if (curEx.weightKey) {
      weightSectionHtml = [
        '<div class="uc-weight-row">',
        '<input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" ',
        'class="live-weight-input" data-weight-input="' + curEx.weightKey + '" ',
        'placeholder="' + curEx.defaultWeight + '" value="' + curCustomW + '" ',
        'oninput="onWeightInputLive(\'' + curEx.weightKey + '\', this.value, ' + curEx.defaultWeight + ')" ',
        'onblur="clearIOSUndoStack(this)" />',
        '<span class="unit-lbl">kg (Sug: ' + curEx.defaultWeight + ')</span>',
        '</div>'
      ].join('');
    } else {
      weightSectionHtml = '<div style="font-family:var(--font-mono);font-size:12px;font-weight:800;color:var(--text);padding:6px 0">Peso Corporal / Barra</div>';
    }

    var rirBtnsHtml = [];
    for (var rIdx = 0; rIdx < RIR_OPTIONS.length; rIdx++) {
      var rOpt = RIR_OPTIONS[rIdx];
      var rCls = 'rir-btn' + (state.currentRIR === rOpt ? ' active' : '');
      rirBtnsHtml.push(
        '<button type="button" class="' + rCls + '" data-rir="' + rOpt + '" onclick="setRIR(\'' + rOpt + '\')">' + rOpt + '</button>'
      );
    }

    unifiedConsoleHTML = [
      '<section class="unified-console">',
      '<div class="uc-top">',
      '<div class="status-pill"><span class="pulse"></span> EN SERIE · ' + curEx.code + ' · VUELTA ' + curStep.round + '/' + curStep.totalRounds + '</div>',
      '<div style="display:flex;align-items:center;gap:6px">',
      undoBtnHTML,
      '<button type="button" class="' + metroClass + '" onclick="toggleMetronome()">' + metroText + '</button>',
      '</div>',
      '</div>',
      '<div class="uc-ex-header">',
      '<div class="uc-ex-title">' + curEx.name + '</div>',
      limbHtml,
      '</div>',
      '<div class="uc-mid-grid">',
      '<div class="uc-reps-box">',
      '<button type="button" class="step-btn" onclick="adjustReps(-1)">−</button>',
      '<div>',
      '<div class="big-number" id="liveRepDisplay">' + state.currentReps + '</div>',
      '<span class="big-unit">REPS (' + curEx.minReps + '–' + curEx.maxReps + ')</span>',
      '</div>',
      '<button type="button" class="step-btn" onclick="adjustReps(1)">+</button>',
      '</div>',
      '<div class="uc-weight-box">',
      '<div>',
      '<div class="uc-weight-head">',
      '<span>CARGA ACTIVA</span>',
      '<strong style="color:var(--accent)" data-weight-badge="' + (curEx.weightKey || 'bw') + '">' + (curEx.weightKey ? effWeight + ' kg' : 'Peso Corp.') + '</strong>',
      '</div>',
      weightSectionHtml,
      '</div>',
      '<div class="overload-badge ' + overload.type + '">' + overload.label + '</div>',
      '</div>',
      '</div>',
      '<div class="uc-rir-bar">',
      '<div class="uc-rir-label">ESFUERZO RIR<span id="rirLiveHint">Meta: RIR 1–2</span></div>',
      '<div class="rir-grid">' + rirBtnsHtml.join('') + '</div>',
      '</div>',
      '</section>'
    ].join('');
  }

  /* REORDENAMIENTO DINÁMICO DE BLOQUES */
  var activeOrPendingBlocks = [];
  var finishedBlocks = [];
  rData.blocks.forEach(function(block) {
    if (isBlockCompleted(block, state.sessionLogs)) {
      finishedBlocks.push({ block: block, completed: true });
    } else {
      activeOrPendingBlocks.push({ block: block, completed: false });
    }
  });
  var orderedBlockItems = activeOrPendingBlocks.concat(finishedBlocks);

  var capsulesHTML = orderedBlockItems.map(function(item) {
    var block = item.block;
    var completed = item.completed;
    var isBlockActive = curStep.blockId === block.id && !completed;
    var showBody = !completed || !!state.manualExpandedBlocks[block.id];

    var cardsHTML = block.exercises.map(function(ex, idx) {
      var isCurEx = curEx.id === ex.id && !completed;
      var isExpanded = state.expandedExId === ex.id;
      var exW = ex.weightKey ? getEffectiveWeight(ex.weightKey, ex.defaultWeight) + ' kg' : 'Peso Corp.';
      var loggedSets = state.sessionLogs[ex.id] || [];
      var prevRec = getLastExerciseRecord(ex.id);

      var setsChips = [];
      for (var s = 1; s <= block.rounds; s++) {
        var found = loggedSets.find(function(x) { return x.set === s; });
        if (found) {
          setsChips.push('<span class="set-chip done">S' + s + ': ' + found.reps + ' <b>@RIR' + found.rir + '</b></span>');
        } else if (isCurEx && curStep.round === s) {
          setsChips.push('<span class="set-chip active-set">S' + s + ': En curso</span>');
        } else {
          setsChips.push('<span class="set-chip">S' + s + ': ' + ex.minReps + '–' + ex.maxReps + '</span>');
        }
      }

      var prevText = prevRec && prevRec.sets && prevRec.sets.length
        ? prevRec.sets.map(function(st) { return st.reps + '@RIR' + st.rir; }).join(', ') + ' (' + prevRec.weight + ')'
        : 'Sin registro previo';

      var cardCls = 'ex-card' + (isCurEx ? ' current' : '') + (isExpanded ? ' expanded' : '');
      var cardMarkup = [
        '<div class="' + cardCls + '">',
        '<div class="ex-card-head" onclick="toggleExpandEx(\'' + ex.id + '\')">',
        '<div>',
        '<div><span class="ex-code">' + ex.code + '</span><span class="ex-name">' + ex.name + '</span></div>',
        '<div class="ex-subline">' + ex.cue + '</div>',
        '</div>',
        '<div class="ex-right-meta">',
        '<span class="ex-weight-pill" data-weight-badge="' + (ex.weightKey || '') + '">' + exW + '</span>',
        '<span class="ex-reps-pill">' + ex.minReps + '–' + ex.maxReps + ' reps' + (ex.unilateral ? '/lado' : '') + '</span>',
        '</div>',
        '</div>',
        '<div class="sets-strip">' + setsChips.join('') + '</div>',
        '<div class="ex-body">',
        '<div class="last-session-bar"><span>📌 Última vez:</span><strong>' + prevText + '</strong></div>',
        '<div class="bio-canvas">',
        getBiomechSVG(ex.diagram),
        '<div class="bio-legend">',
        '<span><i class="dot" style="background:#EA580C"></i><strong>Primario:</strong> ' + ex.primaryMuscles + '</span>',
        '<span><i class="dot" style="background:#F4F4F0"></i><strong>Estabilizador:</strong> ' + ex.secMuscles + '</span>',
        '</div>',
        '</div>',
        '</div>',
        '</div>'
      ].join('');

      if (block.type === 'biserie' && idx === 0 && block.exercises.length > 1) {
        return cardMarkup + '<div class="biserie-connector"><span>⇄ ALTERNAR BISERIE (' + ex.restAfter + 's descanso)</span></div>';
      }
      return cardMarkup;
    }).join('');

    var capCls = 'biserie-capsule' + (isBlockActive ? ' active-block' : '') + (completed ? ' completed-block' : '');
    var headerClick = completed ? 'onclick="toggleCompletedBlockExpand(\'' + block.id + '\')"' : '';
    var titlePrefix = completed ? '✓ ' : '';
    var titleSuffix = completed ? ' Completado · Toca para ver' : '';
    var pillText = completed
      ? (showBody ? '▲ Ocultar' : '▼ Ver series (' + block.rounds + ' vueltas)')
      : (block.rounds + ' vueltas' + (block.transitionRest ? ' · Pausa ' + block.transitionRest + 's' : ''));

    return [
      '<section class="' + capCls + '">',
      '<div class="capsule-header" ' + headerClick + '>',
      '<div class="capsule-title"><span>' + titlePrefix + block.name + titleSuffix + '</span></div>',
      '<span class="capsule-pill">' + pillText + '</span>',
      '</div>',
      showBody ? '<div class="capsule-body">' + cardsHTML + '</div>' : '',
      '</section>'
    ].join('');
  }).join('');

  var latestToday = state.history.slice().reverse().find(function(h) {
    return h.day === state.day && h.type === 'strength';
  });
  var summaryHTML = '';
  if (latestToday && state.completedDays[state.day]) {
    summaryHTML = [
      '<div class="summary-card">',
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
      '<strong style="font-size:12.5px;color:var(--accent)">✓ SESIÓN GUARDADA HOY</strong>',
      '<div style="display:flex;gap:6px">',
      '<button type="button" class="chip-btn active" onclick="copyText(buildSummaryText(state.history.find(function(x){return x.id===' + latestToday.id + ';})))">📋 Copiar</button>',
      '<button type="button" class="chip-btn danger" onclick="deleteHistoryRecord(' + latestToday.id + ')">🗑 Limpiar</button>',
      '</div>',
      '</div>',
      '<div class="summary-pre">' + buildSummaryText(latestToday) + '</div>',
      '</div>'
    ].join('');
  }

  main.innerHTML = unifiedConsoleHTML + summaryHTML + capsulesHTML;
}

    '<div class="panel-sec-title"><span>⏳ Tiempos de Descanso (Segundos)</span></div>',
    '<div class="panel-row"><span class="panel-lbl">Cambio de lado (Unilaterales)</span><input type="text" inputmode="numeric" class="weight-field" value="' + state.restConfig.unilateral + '" oninput="state.restConfig.unilateral=parseInt(this.value,10)||45;saveState();" onblur="clearIOSUndoStack(this)" /></div>',
    '<div class="panel-row"><span class="panel-lbl">Descanso Biserie Bloque A</span><input type="text" inputmode="numeric" class="weight-field" value="' + state.restConfig.blockA + '" oninput="state.restConfig.blockA=parseInt(this.value,10)||80;saveState();" onblur="clearIOSUndoStack(this)" /></div>',
    '<div class="panel-row"><span class="panel-lbl">Descanso Biserie Bloque B</span><input type="text" inputmode="numeric" class="weight-field" value="' + state.restConfig.blockB + '" oninput="state.restConfig.blockB=parseInt(this.value,10)||60;saveState();" onblur="clearIOSUndoStack(this)" /></div>',
    '<div class="panel-row"><span class="panel-lbl">Pausa Transición entre Bloques</span><input type="text" inputmode="numeric" class="weight-field" value="' + state.restConfig.transition + '" oninput="state.restConfig.transition=parseInt(this.value,10)||90;saveState();" onblur="clearIOSUndoStack(this)" /></div>',
    '</section>'
  ].join('');
}

/* ============================================================================
   11. VISTA DE TROTE URBANO (AUTO-FORMATO "0.00" Y "00:00", LIMPIA)
   ============================================================================ */
function renderRunView(container, isOptionalDay6) {
  var pace = formatPaceFromRun(state.runDistStr, state.runTimeStr);
  var optSwitch = '';
  if (isOptionalDay6) {
    optSwitch = [
      '<div class="panel-section" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">',
      '<span class="panel-lbl">Día 6 Flexible:</span>',
      '<div class="seg-group nowrap">',
      '<button type="button" class="seg-btn ' + (state.day6Mode === 'run' ? 'active' : '') + '" onclick="state.day6Mode=\'run\';syncRunInputsForDay(state.day);saveState();render();">Trote Urbano</button>',
      '<button type="button" class="seg-btn ' + (state.day6Mode === 'rest' ? 'active' : '') + '" onclick="state.day6Mode=\'rest\';saveState();render();">Descanso</button>',
      '</div>',
      '</div>'
    ].join('');
  }

  var statusClass = pace.empty ? '' : (pace.optimal ? 'ok' : 'warn');
  var statusText = pace.empty ? 'PENDIENTE DE DATOS' : (pace.optimal ? '✓ RITMO META (5\'40"–6\'00")' : '⚡ RITMO REGISTRADO');

  var todaySavedRun = (state.history || []).slice().reverse().find(function(h) {
    return h && h.type === 'run' && h.day === state.day;
  });
  var savedRunSummaryHTML = '';
  if (todaySavedRun && state.completedDays && state.completedDays[state.day]) {
    savedRunSummaryHTML = [
      '<div class="summary-card">',
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
      '<strong style="font-size:12.5px;color:var(--accent)">✓ TROTE GUARDADO EN DÍA ' + state.day + '</strong>',
      '<div style="display:flex;gap:6px">',
      '<button type="button" class="chip-btn active" onclick="copyText(buildSummaryText(state.history.find(function(x){return x.id===' + todaySavedRun.id + ';})))">📋 Copiar</button>',
      '<button type="button" class="chip-btn danger" onclick="deleteHistoryRecord(' + todaySavedRun.id + ')">🗑 Limpiar</button>',
      '</div>',
      '</div>',
      '<div class="summary-pre">' + buildSummaryText(todaySavedRun) + '</div>',
      '</div>'
    ].join('');
  }

  container.innerHTML = [
    optSwitch,
    savedRunSummaryHTML,
    '<section class="run-card">',
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">',
    '<div style="font-size:16px;font-weight:800">Trote Urbano</div>',
    '<span class="capsule-pill">Día ' + state.day + '</span>',
    '</div>',
    '<div class="run-inputs-grid">',
    '<div class="run-field-box">',
    '<label for="runDistInput">Distancia Total (km)</label>',
    '<input id="runDistInput" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" ',
    'class="run-clean-input" placeholder="0.00" value="' + String(state.runDistStr || '') + '" ',
    'oninput="onRunDistFormattedInput(this)" onblur="clearIOSUndoStack(this)" />',
    '</div>',
    '<div class="run-field-box">',
    '<label for="runTimeInput">Tiempo Total (mm:ss)</label>',
    '<input id="runTimeInput" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" ',
    'class="run-clean-input" placeholder="00:00" value="' + String(state.runTimeStr || '') + '" ',
    'oninput="onRunTimeFormattedInput(this)" onblur="clearIOSUndoStack(this)" />',
    '</div>',
    '</div>',
    '<div class="run-field-box" style="margin-bottom:12px">',
    '<label for="runKcalInput">Energía Activa Opcional (kcal)</label>',
    '<input id="runKcalInput" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" ',
    'class="run-clean-input" placeholder="0" value="' + String(state.runKcal || '') + '" ',
    'oninput="onCleanRunInput(\'kcal\', this)" onblur="clearIOSUndoStack(this)" />',
    '</div>',
    '<div class="run-pace-result">',
    '<div>',
    '<span style="font-size:10px;color:var(--muted);display:block;font-family:var(--font-mono)">RITMO PROMEDIO</span>',
    '<span class="pace-big" id="runLivePace">' + pace.text + '</span>',
    '</div>',
    '<span class="pace-status ' + statusClass + '" id="runLiveStatus">' + statusText + '</span>',
    '</div>',
    '</section>'
  ].join('');
}

function renderRestView(container, isOptionalDay6) {
  var optSwitch = '';
  if (isOptionalDay6) {
    optSwitch = [
      '<div class="panel-section" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">',
      '<span class="panel-lbl">Día 6 Flexible:</span>',
      '<div class="seg-group nowrap">',
      '<button type="button" class="seg-btn ' + (state.day6Mode === 'run' ? 'active' : '') + '" onclick="state.day6Mode=\'run\';syncRunInputsForDay(state.day);saveState();render();">Trote Urbano</button>',
      '<button type="button" class="seg-btn ' + (state.day6Mode === 'rest' ? 'active' : '') + '" onclick="state.day6Mode=\'rest\';saveState();render();">Descanso</button>',
      '</div>',
      '</div>'
    ].join('');
  }

  container.innerHTML = [
    optSwitch,
    '<div class="run-card" style="text-align:center;padding:28px 18px">',
    '<div style="font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:800;margin-bottom:6px">RECUPERACIÓN SISTÉMICA Y MUSCULAR</div>',
    '<div style="font-size:20px;font-weight:800;margin-bottom:8px">Día de Descanso</div>',
    '<p style="font-size:12.5px;color:var(--muted);line-height:1.5;max-width:360px;margin:0 auto">Prioriza pasos suaves, hidratación y meta proteica para supercompensar las sesiones de RIR 1–2.</p>',
    '</div>'
  ].join('');
}

/* ============================================================================
   12. VISTA DE HISTORIAL + REPORTE SEMANAL PARA CHAT + SEMANAS ANTERIORES
   ============================================================================ */
function toggleArchivedWeeksView() {
  state.showArchivedWeeks = !state.showArchivedWeeks;
  render();
}

function renderHistoryView(container) {
  var items = (state.history || []).slice().reverse();
  var weeklyReportText = buildWeeklyReportForChat();

  var listHTML = '';
  if (items.length === 0) {
    listHTML = '<div class="run-card" style="text-align:center;padding:24px 16px"><div style="font-size:15px;font-weight:800;margin-bottom:4px">Sin sesiones en la semana actual</div><p style="font-size:12px;color:var(--muted)">Cada vez que completes una rutina o guardes un trote esta semana, aparecerá aquí y en el reporte superior.</p></div>';
  } else {
    var clearBtnHtml = '';
    if (state.confirmingClearAll) {
      clearBtnHtml = '<div style="display:flex;gap:4px"><button type="button" class="chip-btn active" onclick="clearAllHistory()">Confirmar Borrar Semana</button><button type="button" class="chip-btn" onclick="state.confirmingClearAll=false;render();">Cancelar</button></div>';
    } else {
      clearBtnHtml = '<button type="button" class="chip-btn danger" onclick="state.confirmingClearAll=true;render();">🗑 Limpiar Semana</button>';
    }

    var cards = items.map(function(rec) {
      return [
        '<div class="summary-card" style="border-color:var(--border)">',
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
        '<div>',
        '<strong style="font-size:13px">' + rec.title + '</strong>',
        '<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">' + rec.date + ' · Día ' + rec.day + '</div>',
        '</div>',
        '<div style="display:flex;gap:6px">',
        '<button type="button" class="chip-btn active" onclick="copyText(buildSummaryText(state.history.find(function(x){return x.id===' + rec.id + ';})))">📋 Copiar</button>',
        '<button type="button" class="chip-btn danger" onclick="deleteHistoryRecord(' + rec.id + ')">🗑 Limpiar</button>',
        '</div>',
        '</div>',
        '<div class="summary-pre">' + buildSummaryText(rec) + '</div>',
        '</div>'
      ].join('');
    }).join('');

    listHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--muted)">SESIONES DE ESTA SEMANA (' + items.length + ')</span>' + clearBtnHtml + '</div>' + cards;
  }

  var archivedCount = Array.isArray(state.archivedHistory) ? state.archivedHistory.length : 0;
  var archivedHTML = '';
  if (archivedCount > 0) {
    var archBody = '';
    if (state.showArchivedWeeks) {
      archBody = state.archivedHistory.slice().reverse().map(function(weekBox, idx) {
        var sessText = (weekBox.sessions || []).map(function(s) {
          return buildSummaryText(s);
        }).join('\n\n');
        return [
          '<div class="summary-card" style="border-color:var(--border);margin-top:10px;margin-bottom:0">',
          '<div style="display:flex;justify-content:space-between;align-items:center">',
          '<strong style="font-size:12px;color:var(--text)">Semana cerrada el ' + (weekBox.closedAt || ('#' + (archivedCount - idx))) + ' (' + (weekBox.weekPattern === 'BAB' ? 'B-A-B' : 'A-B-A') + ')</strong>',
          '<span class="capsule-pill">' + (weekBox.sessions ? weekBox.sessions.length : 0) + ' sesiones</span>',
          '</div>',
          '<div class="summary-pre">' + sessText + '</div>',
          '</div>'
        ].join('');
      }).join('');
    }

    archivedHTML = [
      '<section class="biserie-capsule" style="margin-top:16px">',
      '<div class="capsule-header" onclick="toggleArchivedWeeksView()">',
      '<div class="capsule-title"><span>📁 Semanas Anteriores (' + archivedCount + ')</span></div>',
      '<span class="capsule-pill">' + (state.showArchivedWeeks ? '▲ Ocultar' : '▼ Ver archivo') + '</span>',
      '</div>',
      archBody,
      '</section>'
    ].join('');
  }

  container.innerHTML = [
    '<section class="summary-card">',
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">',
    '<div>',
    '<strong style="font-size:13px;color:var(--accent)">📈 Reporte Semanal para Chat</strong>',
    '<div style="font-size:11px;color:var(--muted)">Datos objetivos de la semana en curso. Envíalo o cópialo para analizar tu semana.</div>',
    '</div>',
    '<div style="display:flex;gap:6px">',
    '<button type="button" class="chip-btn active" onclick="copyText(buildWeeklyReportForChat())">📋 Copiar</button>',
    '<button type="button" class="chip-btn" onclick="shareReportNative()">📤 Compartir</button>',
    '</div>',
    '</div>',
    '<div class="summary-pre">' + weeklyReportText + '</div>',
    '</section>',
    listHTML,
    archivedHTML
  ].join('');
}

/* ============================================================================
   13. BLOQUEO DE UNDO NATIVO iOS E INICIALIZACIÓN
   ============================================================================ */
document.addEventListener('beforeinput', function(e) {
  if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
    e.preventDefault();
  }
});

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    saveState();
  } else if (document.visibilityState === 'visible') {
    syncSessionAfterWake();
  }
});

window.addEventListener('pagehide', function() {
  saveState();
});

window.addEventListener('pageshow', function() {
  syncSessionAfterWake();
});

setupIOSPWA();
loadState();
restoreDaySnapshot(state.day);
render();
syncSessionAfterWake();
syncMetronomeLoop();
</script>
</body>
</html>
