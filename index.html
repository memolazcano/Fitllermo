<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fitllermo</title>

<!-- Configuración PWA nativa para iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitllermo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18181B">
<link id="appleTouchIcon" rel="apple-touch-icon" href="">
<link id="pwaManifest" rel="manifest" href="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #18181B;
    --card: #242429;
    --card-alt: #1E1E23;
    --border: #32323A;
    --border-strong: #454550;
    --text: #F4F4F0;
    --muted: #9E9EA8;
    --primary: #F4F4F0;
    --primary-text: #18181B;
    --accent: #EA580C;
    --accent-soft: rgba(234, 88, 12, 0.16);
    --accent-text: #FFFFFF;
    --teal: #14B8A6;
    --teal-soft: rgba(20, 184, 166, 0.14);
    --diag-bg: #151518;
    --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  input, textarea {
    user-select: text;
    -webkit-user-select: text;
  }

  .app-shell {
    max-width: 500px;
    margin: 0 auto;
    padding: 14px 14px 32px;
  }

  /* Header Suizo */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .braun-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(234, 88, 12, 0.55);
  }
  .brand-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
    cursor: pointer;
  }
  .brand-sub strong {
    color: var(--accent);
  }
  .top-actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: stretch;
  }
  .top-actions-row {
    display: flex;
    gap: 6px;
  }
  .top-reset-week-btn {
    width: 100%;
    text-align: center;
    justify-content: center;
    display: flex;
    align-items: center;
    padding: 5px 10px;
    font-size: 10.5px;
    background: var(--card-alt);
    color: var(--muted);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    font-family: var(--font-mono);
    font-weight: 700;
    cursor: pointer;
  }
  .top-reset-week-btn:active {
    background: var(--primary);
    color: var(--primary-text);
  }
  .chip-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .chip-btn.danger:hover {
    border-color: #EF4444;
    color: #F87171;
  }

  /* Tira de 7 días */
  .days-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 12px;
  }
  .day-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 12px;
    padding: 8px 2px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    position: relative;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .day-btn .d-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    display: block;
  }
  .day-btn .d-tag {
    font-size: 9.5px;
    font-weight: 700;
    display: block;
    margin-top: 2px;
    opacity: 0.88;
  }
  .day-btn.active {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .day-btn.done::after {
    content: "";
    position: absolute;
    top: 4px;
    right: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* CONSOLA UNIFICADA EN SERIE */
  .unified-console {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  .unified-console.resting {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .uc-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status-pill .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
  }
  .unified-console.resting .status-pill {
    color: var(--accent);
  }
  .unified-console.resting .status-pill .pulse {
    background: var(--accent);
  }

  .metro-quick-btn {
    background: var(--card-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .metro-quick-btn.on {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(234, 88, 12, 0.45);
  }
  .undo-step-btn {
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .undo-step-btn:active {
    background: var(--primary);
    color: var(--primary-text);
  }

  .uc-ex-header {
    margin-top: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .uc-ex-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.25;
  }
  .limb-badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(234, 88, 12, 0.4);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* Franja Central de la Consola Unificada: Reps + Carga */
  .uc-mid-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 10px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 10px;
    align-items: center;
  }
  @media (max-width: 380px) {
    .uc-mid-grid {
      grid-template-columns: 1fr;
    }
  }
  .uc-reps-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-right: 6px;
    border-right: 1px solid var(--border);
  }
  @media (max-width: 380px) {
    .uc-reps-box {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding-right: 0;
      padding-bottom: 8px;
    }
  }
  .step-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-btn:active {
    background: var(--primary);
    color: var(--primary-text);
  }
  .big-number {
    font-family: var(--font-mono);
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1.5px;
    color: var(--text);
    text-align: center;
  }
  .big-unit {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    display: block;
    margin-top: 2px;
    text-align: center;
  }

  .uc-weight-box {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 5px;
  }
  .uc-weight-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
  }
  .uc-weight-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-weight-input {
    width: 76px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 6px 7px;
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 800;
    text-align: center;
  }
  .live-weight-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unit-lbl {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .overload-badge {
    padding: 4px 7px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.25;
  }
  .overload-badge.up {
    background: var(--accent-soft);
    color: #FB923C;
    border: 1px solid rgba(234, 88, 12, 0.35);
  }
  .overload-badge.steady {
    background: var(--teal-soft);
    color: #2DD4BF;
    border: 1px solid rgba(20, 184, 166, 0.3);
  }
  .overload-badge.hold {
    background: rgba(245, 158, 11, 0.14);
    color: #FBBF24;
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  /* Franja Inferior de la Consola Unificada: RIR */
  .uc-rir-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 4px;
  }
  .uc-rir-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .uc-rir-label span {
    display: block;
    font-size: 9px;
    color: var(--accent);
    font-weight: 600;
  }
  .rir-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    flex: 1;
    max-width: 240px;
  }
  .rir-btn {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 0;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .rir-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(234, 88, 12, 0.35);
  }

  /* Estado Descanso dentro de la Consola Unificada */
  .uc-rest-body {
    text-align: center;
    padding: 10px 0 4px;
  }
  .timer-display {
    font-family: var(--font-mono);
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -2px;
    line-height: 1;
    margin: 6px 0 10px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    max-width: 300px;
    margin: 0 auto 10px;
  }
  .mini-t-btn {
    flex: 1;
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* BLOQUES DE BISERIE CON REORDENAMIENTO DINÁMICO */
  .biserie-capsule {
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 12px;
    transition: all 0.2s ease;
  }
  .biserie-capsule.active-block {
    border-color: var(--border-strong);
  }
  .biserie-capsule.completed-block {
    opacity: 0.72;
    background: #1A1A1E;
    border-style: dashed;
  }
  .capsule-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    cursor: pointer;
  }
  .capsule-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .capsule-pill {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
  }
  .capsule-body {
    margin-top: 10px;
  }

  .biserie-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 6px 0;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
  }
  .biserie-connector::before,
  .biserie-connector::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .biserie-connector span {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 99px;
    color: var(--accent);
  }

  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
  }
  .ex-card.current {
    border-color: var(--primary);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .ex-card-head {
    padding: 12px 13px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .ex-code {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    color: var(--text);
    margin-right: 6px;
  }
  .ex-card.current .ex-code {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
  }
  .ex-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
  }
  .ex-subline {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.35;
  }
  .ex-right-meta {
    text-align: right;
    flex-shrink: 0;
  }
  .ex-weight-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    display: block;
  }
  .ex-reps-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .sets-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 13px 10px;
  }
  .set-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 7px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .set-chip.done {
    background: rgba(244, 244, 240, 0.08);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .set-chip.done b {
    color: var(--accent);
  }
  .set-chip.active-set {
    border-color: var(--primary);
    color: var(--primary);
  }

  .ex-body {
    display: none;
    padding: 0 13px 13px;
    border-top: 1px solid var(--border);
  }
  .ex-card.expanded .ex-body {
    display: block;
  }
  .last-session-bar {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    background: var(--card-alt);
    border: 1px solid var(--border);
    padding: 6px 9px;
    border-radius: 8px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .bio-canvas {
    background: var(--diag-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    margin-top: 9px;
  }
  .bio-legend {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    padding: 0 4px;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* VISTA TROTE URBANO MINIMALISTA CON AUTO-FORMATO 0.00 y 00:00 */
  .run-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .run-inputs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .run-field-box {
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .run-field-box label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .run-clean-input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 800;
    text-align: center;
  }
  .run-clean-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  /* FRANJA 3/4 FECHA + 1/4 REINICIAR SESIÓN (FUERZA Y TROTE) */
  .session-top-row {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
    align-items: stretch;
  }
  .run-date-bar {
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .run-date-input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 5px 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    max-width: 122px;
  }
  .session-reset-btn {
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 8px 6px;
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

</style>
</head>

<script>
/* ============================================================================
   0. CONFIGURACIÓN PWA NATIVA iOS (ÍCONO AUTOMÁTICO EN CANVAS)
   ============================================================================ */
function setupIOSPWA() {
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#18181B';
    ctx.fillRect(0, 0, 512, 512);

    ctx.fillStyle = '#242429';
    ctx.strokeStyle = '#32323A';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.roundRect(44, 44, 424, 424, 88);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#F4F4F0';
    ctx.font = '800 250px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('F', 125, 272);

    ctx.fillStyle = '#EA580C';
    ctx.beginPath();
    ctx.arc(356, 172, 42, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#EA580C';
    ctx.beginPath();
    ctx.roundRect(130, 368, 252, 22, 11);
    ctx.fill();

    var iconDataUrl = canvas.toDataURL('image/png');
    var appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = iconDataUrl;

    var manifest = {
      name: 'Fitllermo',
      short_name: 'Fitllermo',
      start_url: '.',
      display: 'standalone',
      background_color: '#18181B',
      theme_color: '#18181B',
      icons: [{ src: iconDataUrl, sizes: '512x512', type: 'image/png' }]
    };
    var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var manifestUrl = URL.createObjectURL(manifestBlob);
    var manifestLink = document.getElementById('pwaManifest');
    if (manifestLink) manifestLink.href = manifestUrl;
  } catch (e) {}
}

/* ============================================================================
   1. ESTADO GLOBAL, MEMORIA POR DÍA Y ALTERNANCIA SEMANAL (A-B-A <-> B-A-B)
   ============================================================================ */
var STORAGE_KEY = 'fitllermo_swiss_bento_v3';
var KNOWN_STORAGE_KEYS = [
  'fitllermo_swiss_bento_v1',
  'fitllermo_swiss_bento_v2',
  'fitllermo_swiss_bento_v3',
  'fitllermo_swiss_bento_v4',
  'fitllermo_state',
  'fitllermo'
];
var RIR_OPTIONS = ['0', '1', '2', '3+'];

var DEFAULT_REST_CONFIG = {
  unilateral: 45,
  blockA: 80,
  blockB: 60,
  transition: 90,
  coreA: 45,
  coreB: 60
};

var state = {
  day: 1,
  weekPattern: 'ABA',      // 'ABA' | 'BAB'
  weekOrder: 'ABA',
  activeModal: null,       // null | 'panel' | 'history'
  sound: true,
  // Metrónomo Opción A (pulso editable en segundos)
  metroEnabled: false,
  metroIntervalSec: 1.0,
  // Configuraciones de rutina y series por bloque
  gripA: 'prono',          // 'prono' | 'neutro' | 'supino'
  roundsBlockA: 3,
  roundsBlockB: 3,
  roundsBlockC: 3,
  variantB2_B: 'diamante', // 'diamante' | 'fondos'
  day6Mode: 'run',         // 'run' | 'rest'
  dayOverrides: {},        // Objetivos personalizados por día { [1..7]: 'routineA' | 'routineB' | 'run' | 'rest' }
  // Cargas personalizadas y tiempos de descanso editables
  customWeights: {},
  restConfig: Object.assign({}, DEFAULT_REST_CONFIG),
  // Progreso de la sesión activa (y diccionario por día para no perder progreso al cambiar de pestaña)
  stepIndex: 0,
  isResting: false,
  restRemaining: 0,
  restEndTimestamp: null,
  currentReps: 8,
  currentRIR: '2',
  expandedExId: null,
  manualExpandedBlocks: {},
  sessionLogs: {},
  sessionStartTime: null,
  sessionLastLogTime: null,
  sessionDurationMin: null,
  sessionCompletedToday: false,
  sessionDateKey: '',
  daySessions: {},         // Guarda el progreso en vivo de cada día de fuerza { [day]: {...} }
  runDrafts: {},           // Guarda borradores no guardados de trote por día { [day]: { dist, time, kcal, dateKey } }
  completedDays: {},
  confirmingClearAll: false,
  pendingConfirmAction: null, // null | 'resetDay' | 'resetWeek'
  dayMenuTarget: null,        // Día seleccionado al mantener presionado (1..7)
  // Trote Urbano (vacío en días no realizados, auto-formato 0.00 y 00:00 + selector de fecha)
  runDistStr: '',
  runTimeStr: '',
  runKcal: '',
  runDateKey: '',
  // Historial de la semana actual + archivo de semanas cerradas + memoria de última vez por ejercicio
  history: [],
  archivedHistory: [],
  lastExerciseRecords: {},
  showArchivedWeeks: false
};

var timerInterval = null;
var metroTimer = null;
var sharedAudioCtx = null;

function getTodayDateKey() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function formatDateKeyForDisplay(dateKey) {
  if (!dateKey || typeof dateKey !== 'string') {
    return new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
  }
  var parts = dateKey.split('-');
  if (parts.length !== 3) return dateKey;
  var y = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10) - 1;
  var d = parseInt(parts[2], 10);
  var dt = new Date(y, m, d, 12, 0, 0);
  if (isNaN(dt.getTime())) return dateKey;
  return dt.toLocaleDateString('es-CL', { day: '2-digit', month: 'short' });
}

function getCycleDays() {
  var order = state.weekPattern || state.weekOrder || 'ABA';
  var isABA = order === 'ABA';
  var baseDays = [
    { day: 1, short: 'D1', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
    { day: 2, short: 'D2', tag: 'Trote',    type: 'run' },
    { day: 3, short: 'D3', tag: isABA ? 'Fuerza B' : 'Fuerza A', type: isABA ? 'routineB' : 'routineA' },
    { day: 4, short: 'D4', tag: 'Trote',    type: 'run' },
    { day: 5, short: 'D5', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
    { day: 6, short: 'D6', tag: 'Trote/D',  type: 'run_opt' },
    { day: 7, short: 'D7', tag: 'Descanso', type: 'rest' }
  ];
  var tagByType = {
    routineA: 'Fuerza A',
    routineB: 'Fuerza B',
    run: 'Trote',
    rest: 'Descanso'
  };
  var overrides = state.dayOverrides || {};
  return baseDays.map(function(d) {
    var ov = overrides[d.day];
    if (ov && tagByType[ov]) {
      return { day: d.day, short: d.short, tag: tagByType[ov], type: ov };
    }
    return d;
  });
}

function getEffectiveDayType(d) {
  var days = getCycleDays();
  var dayObj = days.find(function(x) { return Number(x.day) === Number(d); }) || days[0];
  if (!dayObj) return 'rest';
  return dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;
}

function hasAnyLoggedSets(logsObj) {
  if (!logsObj || typeof logsObj !== 'object') return false;
  return Object.keys(logsObj).some(function(k) {
    return Array.isArray(logsObj[k]) && logsObj[k].length > 0;
  });
}

/* Guarda instantánea del día actual para que explorar otros días nunca borre las series hechas */
function saveCurrentDaySnapshot() {
  if (!state.daySessions || typeof state.daySessions !== 'object') {
    state.daySessions = {};
  }
  if (!state.runDrafts || typeof state.runDrafts !== 'object') {
    state.runDrafts = {};
  }
  var curType = getEffectiveDayType(state.day);
  if (curType === 'routineA' || curType === 'routineB') {
    var prevSnap = state.daySessions[state.day];
    var lockedGripA = (state.sessionCompletedToday && prevSnap && prevSnap.gripA) ? prevSnap.gripA : state.gripA;
    var lockedVarB2 = (state.sessionCompletedToday && prevSnap && prevSnap.variantB2_B) ? prevSnap.variantB2_B : state.variantB2_B;
    state.daySessions[state.day] = {
      routineType: curType,
      stepIndex: Number(state.stepIndex) || 0,
      currentReps: Number(state.currentReps) || 8,
      currentRIR: String(state.currentRIR || '2'),
      expandedExId: state.expandedExId || null,
      manualExpandedBlocks: Object.assign({}, state.manualExpandedBlocks || {}),
      sessionLogs: JSON.parse(JSON.stringify(state.sessionLogs || {})),
      sessionStartTime: state.sessionStartTime || null,
      sessionLastLogTime: state.sessionLastLogTime || null,
      sessionDurationMin: state.sessionDurationMin || null,
      sessionCompletedToday: !!state.sessionCompletedToday,
      dateKey: state.sessionDateKey || getTodayDateKey(),
      gripA: lockedGripA,
      variantB2_B: lockedVarB2
    };
  } else if (curType === 'run') {
    var cleanDist = (state.runDistStr === '0.00' || state.runDistStr === '0') ? '' : String(state.runDistStr || '');
    var cleanTime = (state.runTimeStr === '00:00' || state.runTimeStr === '0') ? '' : String(state.runTimeStr || '');
    var cleanKcal = state.runKcal === '0' ? '' : String(state.runKcal || '');
    state.runDrafts[state.day] = {
      distStr: cleanDist,
      timeStr: cleanTime,
      kcal: cleanKcal,
      dateKey: state.runDateKey || getTodayDateKey()
    };
  }
}

function getRunDraft(d) {
  var draft = state.runDrafts && state.runDrafts[d];
  if (!draft || typeof draft !== 'object') {
    return { distStr: '', timeStr: '', kcal: '', dateKey: getTodayDateKey() };
  }
  var dist = (draft.distStr === '0.00' || draft.distStr === '0') ? '' : String(draft.distStr || '');
  var time = (draft.timeStr === '00:00' || draft.timeStr === '0') ? '' : String(draft.timeStr || '');
  var kcal = draft.kcal === '0' ? '' : String(draft.kcal || '');
  var dKey = draft.dateKey || getTodayDateKey();
  return { distStr: dist, timeStr: time, kcal: kcal, dateKey: dKey };
}

function restoreDaySnapshot(targetDay) {
  var targetType = getEffectiveDayType(targetDay);
  if (targetType === 'routineA' || targetType === 'routineB') {
    var snap = state.daySessions && state.daySessions[targetDay];
    var hasProgress = snap && (hasAnyLoggedSets(snap.sessionLogs) || snap.sessionCompletedToday);
    var opts = hasProgress
      ? { gripA: snap.gripA || state.gripA, variantB2_B: snap.variantB2_B || state.variantB2_B }
      : { gripA: state.gripA, variantB2_B: state.variantB2_B };
    var rData = getRoutineData(targetType, opts);
    var steps = buildStepsForRoutine(rData);

    if (snap && snap.routineType === targetType && hasProgress) {
      if (!snap.sessionCompletedToday) {
        if (targetType === 'routineA' && snap.gripA) state.gripA = snap.gripA;
        if (targetType === 'routineB' && snap.variantB2_B) state.variantB2_B = snap.variantB2_B;
      }
      state.stepIndex = Math.min(Number(snap.stepIndex) || 0, Math.max(0, steps.length - 1));
      state.sessionLogs = JSON.parse(JSON.stringify(snap.sessionLogs || {}));
      state.manualExpandedBlocks = Object.assign({}, snap.manualExpandedBlocks || {});
      state.sessionStartTime = snap.sessionStartTime || null;
      state.sessionLastLogTime = snap.sessionLastLogTime || null;
      state.sessionDurationMin = snap.sessionDurationMin || null;
      state.sessionCompletedToday = !!snap.sessionCompletedToday;
      state.sessionDateKey = snap.dateKey || getTodayDateKey();
      state.currentRIR = String(snap.currentRIR || '2');
      var activeStep = steps[state.stepIndex] || steps[0];
      state.currentReps = Number(snap.currentReps) || (activeStep ? activeStep.ex.defaultReps : 8);
      state.expandedExId = snap.expandedExId || (activeStep ? activeStep.ex.id : null);
    } else {
      state.stepIndex = 0;
      state.sessionLogs = {};
      state.manualExpandedBlocks = {};
      state.sessionStartTime = null;
      state.sessionLastLogTime = null;
      state.sessionDurationMin = null;
      state.sessionCompletedToday = false;
      state.sessionDateKey = getTodayDateKey();
      state.currentRIR = '2';
      if (steps[0]) {
        state.currentReps = steps[0].ex.defaultReps;
        state.expandedExId = steps[0].ex.id;
      }
    }
  } else if (targetType === 'run') {
    syncRunInputsForDay(targetDay);
  }
}

/* Escáner universal con normalización profunda a prueba de fallos */
function loadState() {
  try {
    var keysToScan = [];
    for (var i = 0; i < localStorage.length; i++) {
      var kName = localStorage.key(i);
      if (kName && keysToScan.indexOf(kName) === -1) {
        keysToScan.push(kName);
      }
    }
    for (var j = 0; j < KNOWN_STORAGE_KEYS.length; j++) {
      if (keysToScan.indexOf(KNOWN_STORAGE_KEYS[j]) === -1) {
        keysToScan.push(KNOWN_STORAGE_KEYS[j]);
      }
    }

    var mergedHistory = [];
    var mergedArchived = [];
    var mergedLastRecords = {};
    var mergedWeights = {};
    var mergedDays = {};
    var preferredConfig = null;

    for (var idx = 0; idx < keysToScan.length; idx++) {
      var key = keysToScan[idx];
      var raw = null;
      try {
        raw = localStorage.getItem(key);
      } catch (eGet) {}
      if (!raw) continue;

      try {
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') continue;

        if (Array.isArray(parsed.history) && parsed.history.length > 0) {
          for (var hIdx = 0; hIdx < parsed.history.length; hIdx++) {
            var item = parsed.history[hIdx];
            if (!item || typeof item !== 'object') continue;
            var itemId = item.id || (item.date + '_' + item.type + '_' + item.day);
            var alreadyExists = mergedHistory.some(function(existing) {
              var exId = existing.id || (existing.date + '_' + existing.type + '_' + existing.day);
              return exId === itemId;
            });
            if (!alreadyExists) {
              mergedHistory.push(item);
            }
          }
        }

        var archSource = parsed.archivedHistory || parsed.archivedWeeks;
        if (Array.isArray(archSource) && archSource.length > 0) {
          for (var aIdx = 0; aIdx < archSource.length; aIdx++) {
            var archItem = archSource[aIdx];
            if (!archItem || typeof archItem !== 'object') continue;
            var archId = archItem.id || (archItem.closedAt + '_' + aIdx);
            var archExists = mergedArchived.some(function(exArch) {
              return (exArch.id || '') === archId;
            });
            if (!archExists) {
              mergedArchived.push(archItem);
            }
          }
        }

        var lastMemSource = parsed.lastExerciseRecords || parsed.lastExerciseMemory;
        if (lastMemSource && typeof lastMemSource === 'object') {
          mergedLastRecords = Object.assign({}, mergedLastRecords, lastMemSource);
        }

        if (parsed.customWeights && typeof parsed.customWeights === 'object') {
          mergedWeights = Object.assign({}, mergedWeights, parsed.customWeights);
        }

        if (parsed.completedDays && typeof parsed.completedDays === 'object') {
          mergedDays = Object.assign({}, mergedDays, parsed.completedDays);
        }

        if (key === STORAGE_KEY || !preferredConfig) {
          preferredConfig = parsed;
        }
      } catch (eParse) {}
    }

    mergedHistory.sort(function(a, b) {
      return (Number(a.id) || 0) - (Number(b.id) || 0);
    });

    for (var m = 0; m < mergedHistory.length; m++) {
      var hRec = mergedHistory[m];
      if (hRec && hRec.type === 'strength' && hRec.exercises) {
        Object.keys(hRec.exercises).forEach(function(exKey) {
          var exData = hRec.exercises[exKey];
          if (exData && exData.sets && exData.sets.length > 0) {
            mergedLastRecords[exKey] = exData;
          }
        });
      }
    }

    if (preferredConfig) {
      var resolvedOrder = preferredConfig.weekPattern || preferredConfig.weekOrder || 'ABA';
      var rawDrafts = (preferredConfig.runDrafts && typeof preferredConfig.runDrafts === 'object') ? preferredConfig.runDrafts : {};
      Object.keys(rawDrafts).forEach(function(dKey) {
        if (rawDrafts[dKey] && typeof rawDrafts[dKey] === 'object') {
          if (rawDrafts[dKey].distStr === '0.00' || rawDrafts[dKey].distStr === '0') rawDrafts[dKey].distStr = '';
          if (rawDrafts[dKey].timeStr === '00:00' || rawDrafts[dKey].timeStr === '0') rawDrafts[dKey].timeStr = '';
          if (rawDrafts[dKey].kcal === '0') rawDrafts[dKey].kcal = '';
        }
      });
      var initDistStr = (preferredConfig.runDistStr === '0.00' || preferredConfig.runDistStr === '0') ? '' : String(preferredConfig.runDistStr || '');
      var initTimeStr = (preferredConfig.runTimeStr === '00:00' || preferredConfig.runTimeStr === '0') ? '' : String(preferredConfig.runTimeStr || '');
      var initKcalStr = preferredConfig.runKcal === '0' ? '' : String(preferredConfig.runKcal || '');

      state = Object.assign({}, state, preferredConfig, {
        day: Number(preferredConfig.day) || 1,
        weekPattern: resolvedOrder,
        weekOrder: resolvedOrder,
        roundsBlockA: Number(preferredConfig.roundsBlockA || preferredConfig.roundsBlockA_A || 3),
        roundsBlockB: Number(preferredConfig.roundsBlockB || 3),
        roundsBlockC: Number(preferredConfig.roundsBlockC || 3),
        restConfig: Object.assign({}, DEFAULT_REST_CONFIG, preferredConfig.restConfig || {}),
        sessionLogs: (preferredConfig.sessionLogs && typeof preferredConfig.sessionLogs === 'object') ? preferredConfig.sessionLogs : {},
        manualExpandedBlocks: (preferredConfig.manualExpandedBlocks && typeof preferredConfig.manualExpandedBlocks === 'object') ? preferredConfig.manualExpandedBlocks : {},
        daySessions: (preferredConfig.daySessions && typeof preferredConfig.daySessions === 'object') ? preferredConfig.daySessions : {},
        dayOverrides: (preferredConfig.dayOverrides && typeof preferredConfig.dayOverrides === 'object') ? preferredConfig.dayOverrides : {},
        runDrafts: rawDrafts,
        runDistStr: initDistStr,
        runTimeStr: initTimeStr,
        runKcal: initKcalStr,
        runDateKey: preferredConfig.runDateKey || getTodayDateKey(),
        sessionDateKey: preferredConfig.sessionDateKey || getTodayDateKey(),
        sessionCompletedToday: !!preferredConfig.sessionCompletedToday,
        activeModal: null,
        confirmingClearAll: false,
        dayMenuTarget: null
      });

      if (Array.isArray(preferredConfig.history) && preferredConfig.history.length === 0 && mergedArchived.length > 0) {
        mergedHistory = [];
        mergedDays = (preferredConfig.completedDays && typeof preferredConfig.completedDays === 'object') ? preferredConfig.completedDays : {};
      }
    }

    // Sanitiza cualquier registro histórico que haya guardado más series de las configuradas
    mergedHistory.forEach(function(rec) {
      if (rec && rec.type === 'strength' && rec.exercises) {
        Object.keys(rec.exercises).forEach(function(exId) {
          var exObj = rec.exercises[exId];
          if (exObj && Array.isArray(exObj.sets)) {
            var bySet = {};
            exObj.sets.forEach(function(st) {
              var sNum = Number(st.set) || 1;
              bySet[sNum] = st;
            });
            var cleanSets = Object.keys(bySet).map(function(k) { return bySet[k]; }).sort(function(a, b) {
              return (Number(a.set) || 0) - (Number(b.set) || 0);
            });
            exObj.sets = cleanSets;
          }
        });
      }
    });

    state.history = mergedHistory;
    state.archivedHistory = mergedArchived;
    state.lastExerciseRecords = mergedLastRecords;
    state.customWeights = Object.assign({}, state.customWeights, mergedWeights);
    state.completedDays = Object.assign({}, state.completedDays, mergedDays);

    rescueUncommittedStrengthSessions();

    if (state.history.length > 0 || mergedArchived.length > 0 || Object.keys(mergedWeights).length > 0) {
      saveState();
    }
  } catch (e) {}
}

function saveState() {
  try {
    state.weekOrder = state.weekPattern;
    saveCurrentDaySnapshot();

    var existingRaw = localStorage.getItem(STORAGE_KEY);
    if (existingRaw && (!state.history || state.history.length === 0) && !state._allowEmptyHistorySave) {
      try {
        var prevObj = JSON.parse(existingRaw);
        if (prevObj && Array.isArray(prevObj.history) && prevObj.history.length > 0) {
          state.history = prevObj.history;
        }
      } catch (e) {}
    }
    state._allowEmptyHistorySave = false;

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      day: state.day,
      weekPattern: state.weekPattern,
      weekOrder: state.weekPattern,
      sound: state.sound,
      metroEnabled: state.metroEnabled,
      metroIntervalSec: state.metroIntervalSec,

function getExerciseTargetSets(block, ex) {
  return Number(ex.sets) || Number(block.rounds) || 3;
}

function buildStepsForRoutine(routineData) {
  var steps = [];
  routineData.blocks.forEach(function(block, bIdx) {
    var maxRounds = block.rounds;
    block.exercises.forEach(function(ex) {
      var exSets = getExerciseTargetSets(block, ex);
      if (exSets > maxRounds) maxRounds = exSets;
    });

    for (var r = 1; r <= maxRounds; r++) {
      var activeExInRound = block.exercises.filter(function(ex) {
        return r <= getExerciseTargetSets(block, ex);
      });
      activeExInRound.forEach(function(ex, eIdx) {
        var exTotalSets = getExerciseTargetSets(block, ex);
        var isLastExInRound = eIdx === activeExInRound.length - 1;
        var isLastRound = r === maxRounds;
        var isLastBlock = bIdx === routineData.blocks.length - 1;

        if (ex.unilateral) {
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: exTotalSets,
            ex: ex,
            limbIndex: 0,
            limbLabel: ex.limbLabels[0],
            restAfter: ex.restBetweenLimbs,
            restLabel: 'Cambio de lado (' + ex.restBetweenLimbs + 's)'
          });
          var nextRest = ex.restAfter;
          var rLabel = 'Transición Biserie (' + ex.restAfter + 's)';
          if (isLastExInRound && isLastRound) {
            nextRest = isLastBlock ? 0 : block.transitionRest;
            rLabel = isLastBlock ? 'Fin de sesión' : 'Pausa Fin de Bloque (' + nextRest + 's)';
          }
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: exTotalSets,
            ex: ex,
            limbIndex: 1,
            limbLabel: ex.limbLabels[1],
            restAfter: nextRest,
            restLabel: rLabel
          });
        } else {
          var nextRest2 = ex.restAfter;
          var rLabel2 = block.type === 'biserie'
            ? 'Descanso Biserie (' + ex.restAfter + 's)'
            : 'Descanso Serie (' + ex.restAfter + 's)';
          if (isLastExInRound && isLastRound) {
            nextRest2 = isLastBlock ? 0 : block.transitionRest;
            rLabel2 = isLastBlock ? 'Fin de sesión' : 'Pausa Fin de Bloque (' + nextRest2 + 's)';
          }
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: exTotalSets,
            ex: ex,
            limbIndex: null,
            limbLabel: null,
            restAfter: nextRest2,
            restLabel: rLabel2
          });
        }
      });
    }
  });
  return steps;
}

function clearIOSUndoStack(inputEl) {
  if (!inputEl || !inputEl.parentNode) return;
  try {
    var clone = inputEl.cloneNode(true);
    clone.value = inputEl.value;
    inputEl.parentNode.replaceChild(clone, inputEl);
  } catch (e) {}
}

function blurAnyActiveInput() {
  var act = document.activeElement;
  if (act && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA')) {
    act.blur();
  }
}

function onWeightInputLive(weightKey, rawValue, defaultWeight) {
  if (!weightKey) return;
  var cleaned = String(rawValue).replace(',', '.').replace(/[^0-9.]/g, '');
  if (cleaned === '') {
    delete state.customWeights[weightKey];
  } else {
    var num = parseFloat(cleaned);
    if (!isNaN(num) && num >= 0) {
      state.customWeights[weightKey] = num;
    }
  }
  saveState();

  var effective = getEffectiveWeight(weightKey, defaultWeight);
  var badges = document.querySelectorAll('[data-weight-badge="' + weightKey + '"]');
  for (var i = 0; i < badges.length; i++) {
    badges[i].textContent = effective + ' kg';
  }
  var inputs = document.querySelectorAll('input[data-weight-input="' + weightKey + '"]');
  for (var j = 0; j < inputs.length; j++) {
    if (document.activeElement !== inputs[j]) {
      inputs[j].value = state.customWeights[weightKey] !== undefined ? state.customWeights[weightKey] : '';
    }
  }
}

function updateBlockRounds(blockKey, newRounds) {
  blurAnyActiveInput();
  var effectiveType = getEffectiveDayType(state.day);
  var prevAnchor = null;

  if (effectiveType === 'routineA' || effectiveType === 'routineB') {
    var oldData = getRoutineData(effectiveType);
    var oldSteps = buildStepsForRoutine(oldData);
    prevAnchor = oldSteps[state.stepIndex] || null;
  }

  state[blockKey] = Number(newRounds);

  if (prevAnchor && (effectiveType === 'routineA' || effectiveType === 'routineB')) {
    var newData = getRoutineData(effectiveType);
    var newSteps = buildStepsForRoutine(newData);
    var foundIdx = newSteps.findIndex(function(s) {
      return s.ex.id === prevAnchor.ex.id && s.round === prevAnchor.round && s.limbIndex === prevAnchor.limbIndex;
    });
    if (foundIdx === -1) {
      foundIdx = newSteps.findIndex(function(s) {
        return s.ex.id === prevAnchor.ex.id;
      });
    }
    state.stepIndex = foundIdx !== -1 ? foundIdx : Math.min(state.stepIndex, Math.max(0, newSteps.length - 1));
  }

  saveState();
  render();
  showToast('✓ Series actualizadas en el entrenamiento activo');
}

function setGripA(newGrip) {
  blurAnyActiveInput();
  state.gripA = newGrip;
  var effType = getEffectiveDayType(state.day);
  if (effType === 'routineA' && !state.sessionCompletedToday) {
    var rData = getRoutineData('routineA', { gripA: newGrip });
    var steps = buildStepsForRoutine(rData);
    state.stepIndex = Math.min(state.stepIndex, Math.max(0, steps.length - 1));
    if (hasAnyLoggedSets(state.sessionLogs)) {
      syncStrengthSessionToHistory(
        rData,
        state.day,
        state.sessionLogs,
        state.sessionDateKey,
        state.sessionStartTime,
        false,
        null,
        { gripA: newGrip }
      );
    }
  }
  saveState();
  render();
}

function setVariantB2_B(newVariant) {
  blurAnyActiveInput();
  state.variantB2_B = newVariant;
  var effType = getEffectiveDayType(state.day);
  if (effType === 'routineB' && !state.sessionCompletedToday) {
    var rData = getRoutineData('routineB', { variantB2_B: newVariant });
    var steps = buildStepsForRoutine(rData);
    state.stepIndex = Math.min(state.stepIndex, Math.max(0, steps.length - 1));
    if (hasAnyLoggedSets(state.sessionLogs)) {
      syncStrengthSessionToHistory(
        rData,
        state.day,
        state.sessionLogs,
        state.sessionDateKey,
        state.sessionStartTime,
        false,
        null,
        { variantB2_B: newVariant }
      );
    }
  }
  saveState();
  render();
}

function setRIR(rirVal) {
  blurAnyActiveInput();
  state.currentRIR = rirVal;
  saveState();
  var btns = document.querySelectorAll('.rir-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.rir === rirVal);
  }
  var capEl = document.getElementById('rirLiveHint');
  if (capEl) {
    var hints = {
      '0': 'Fallo técnico (0 en reserva)',
      '1': 'Zona óptima alta (1 en reserva)',
      '2': 'Objetivo ideal (2 en reserva)',
      '3+': 'Carga con margen (3+ en reserva)'
    };
    capEl.textContent = hints[rirVal] || '';
  }
}

function adjustReps(delta) {
  blurAnyActiveInput();
  state.currentReps = Math.max(1, (Number(state.currentReps) || 1) + delta);
  saveState();
  var repEl = document.getElementById('liveRepDisplay');
  if (repEl) repEl.textContent = state.currentReps;
}

/* Permite deshacer la última serie/lado si presionaste "Serie Completada" por error */
function canUndoLastStep() {
  return state.isResting || state.stepIndex > 0;
}

function undoLastStep() {
  blurAnyActiveInput();
  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType !== 'routineA' && effectiveType !== 'routineB') return;

  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);
  var targetStepIdx = state.isResting ? state.stepIndex : Math.max(0, state.stepIndex - 1);
  var targetStep = steps[targetStepIdx];
  if (!targetStep) return;

  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;
  state.stepIndex = targetStepIdx;

  var ex = targetStep.ex;
  var exLogs = state.sessionLogs[ex.id] || [];
  var setEntryIdx = exLogs.findIndex(function(s) { return s.set === targetStep.round; });

  if (setEntryIdx !== -1) {
    var entry = exLogs[setEntryIdx];
    if (ex.unilateral && targetStep.limbIndex === 1 && entry.leftReps !== null && entry.leftReps !== undefined) {
      state.currentReps = Number(entry.rightReps) || ex.defaultReps;
      state.currentRIR = String(entry.rir || '2');
      entry.rightReps = null;
      entry.reps = entry.leftReps + '/-';
    } else {
      state.currentReps = Number(ex.unilateral ? entry.leftReps : entry.reps) || ex.defaultReps;
      state.currentRIR = String(entry.rir || '2');
      exLogs.splice(setEntryIdx, 1);
    }
  } else {
    state.currentReps = ex.defaultReps;
  }

  state.expandedExId = ex.id;
  saveState();
  syncMetronomeLoop();
  showToast('↶ Última serie deshecha');
  render();
}

function getLastExerciseRecord(exId) {
  for (var i = state.history.length - 1; i >= 0; i--) {
    var item = state.history[i];
    if (item && item.exercises && item.exercises[exId] && item.exercises[exId].sets && item.exercises[exId].sets.length > 0) {
      return item.exercises[exId];
    }
  }
  if (state.lastExerciseRecords && state.lastExerciseRecords[exId]) {
    return state.lastExerciseRecords[exId];
  }
  return null;
}

/* Evalúa si el promedio de series efectivas superó el techo del rango en RIR 1-2 */
function shouldFlagExerciseProgression(maxReps, sets) {
  if (!Array.isArray(sets) || sets.length === 0) return false;
  var effectiveSets = sets.filter(function(s) {
    var rirStr = String(s.rir || '2');
    return rirStr === '1' || rirStr === '2' || rirStr === '0';
  });
  if (effectiveSets.length === 0) return false;
  var totalAvgReps = 0;
  effectiveSets.forEach(function(s) {
    if (s.leftReps !== undefined && s.leftReps !== null) {
      var l = Number(s.leftReps) || 0;
      var r = (s.rightReps !== undefined && s.rightReps !== null) ? Number(s.rightReps) : l;
      totalAvgReps += (l + r) / 2;
    } else {
      totalAvgReps += parseFloat(s.reps) || 0;
    }
  });
  var avg = totalAvgReps / effectiveSets.length;
  return avg > maxReps;
}

/* Sugerencias en vivo Serie a Serie (Regla v4 de autorregulación RIR) */
function getOverloadSuggestion(ex) {
  var todayLogs = state.sessionLogs[ex.id] || [];
  var completedToday = todayLogs.filter(function(s) {
    if (ex.unilateral) {
      return s.leftReps !== null && s.leftReps !== undefined && s.rightReps !== null && s.rightReps !== undefined;
    }
    return s.reps !== null && s.reps !== undefined;
  });

  if (completedToday.length === 0) {
    return {
      type: 'steady',
      label: 'Guía: ' + ex.minReps + '–' + ex.maxReps + ' reps @ RIR 1–2 (si hay RIR 3+, sigue)'
    };
  }

  if (shouldFlagExerciseProgression(ex.maxReps, completedToday)) {
    return {
      type: 'up',
      label: '↑ Promedio sobre ' + ex.maxReps + ' reps @ RIR 1–2: Subir carga / dificultad en próxima sesión'
    };
  }

  var lastSet = completedToday[completedToday.length - 1];
  var rirStr = String(lastSet.rir || '2');
  var rirNum = rirStr === '3+' ? 3 : parseInt(rirStr, 10);
  var repVal = ex.unilateral
    ? Math.min(Number(lastSet.leftReps) || 0, Number(lastSet.rightReps) || 0)
    : (parseInt(lastSet.reps, 10) || 0);

  if (rirNum >= 3) {
    if (repVal >= ex.maxReps) {
      return {
        type: 'up',
        label: '↑ Techo con RIR 3+: Continúa hasta RIR 1–2 (subir carga próxima sesión)'
      };
    }
    return {
      type: 'up',
      label: '↑ Quedó margen (RIR 3+): Sube +1–2 reps hasta llegar a RIR 1–2'
    };
  }

  if (rirNum === 0) {
    if (repVal < ex.minReps) {
      return {
        type: 'hold',
        label: '↓ Bajo rango en RIR 0: Baja carga o prioriza técnica estricta'
      };
    }
    return {
      type: 'hold',
      label: '⚠ Tocaste RIR 0: Mantén carga y baja 1 rep para cuidar técnica'
    };
  }

  if (repVal < ex.minReps) {
    return {
      type: 'hold',
      label: '↓ Bajo rango (' + repVal + ' reps): Baja 1–2 kg o mantén técnica limpia'
    };
  }

  return {
    type: 'steady',
    label: '✓ Zona óptima (RIR ' + rirStr + '): Mantener carga y sostener reps'
  };
}

/* ============================================================================
   4. AUDIO SINTÉTICO (CAMPANA DESCANSO + PULSO METRÓNOMO)
   ============================================================================ */
function getAudioContext() {
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  if (!sharedAudioCtx) {
    sharedAudioCtx = new AudioCtx();
  }
  if (sharedAudioCtx.state === 'suspended') {
    sharedAudioCtx.resume().catch(function() {});
  }
  return sharedAudioCtx;
}

function playBell() {
  if (!state.sound) return;
  try {
    var ctx = getAudioContext();
    if (!ctx) return;
    [880, 1318.5].forEach(function(freq, idx) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
      gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + idx * 0.14 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.14 + 0.65);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.14);
      osc.stop(ctx.currentTime + idx * 0.14 + 0.68);
    });
  } catch (e) {}
}

function playMetroTick() {
  if (!state.metroEnabled || state.isResting || state.activeModal) return;
  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType !== 'routineA' && effectiveType !== 'routineB') return;
  try {
    var ctx = getAudioContext();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1050, ctx.currentTime);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.11, ctx.currentTime + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.065);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.07);
  } catch (e) {}
}

function syncMetronomeLoop() {
  clearInterval(metroTimer);
  var effectiveType = getEffectiveDayType(state.day);
  if (state.metroEnabled && !state.isResting && !state.activeModal && (effectiveType === 'routineA' || effectiveType === 'routineB')) {
    var ms = Math.max(400, Math.round((Number(state.metroIntervalSec) || 1.0) * 1000));
    metroTimer = setInterval(playMetroTick, ms);
  }
}

function toggleMetronome() {
  getAudioContext();
  state.metroEnabled = !state.metroEnabled;
  saveState();
  syncMetronomeLoop();
  render();
}

function setMetroInterval(sec) {
  getAudioContext();
  state.metroIntervalSec = Number(sec);
  saveState();
  syncMetronomeLoop();
  render();
}

/* ============================================================================
   5. TEMPORIZADOR DE DESCANSO CON MARCA DE TIEMPO REAL (PERSISTE EN SEGUNDO PLANO)
   ============================================================================ */
function startRestTimer(seconds) {
  clearInterval(timerInterval);
  if (!seconds || seconds <= 0) {
    state.isResting = false;
    state.restRemaining = 0;
    state.restEndTimestamp = null;
    saveState();
    syncMetronomeLoop();
    render();
    return;
  }
  state.isResting = true;
  state.restRemaining = seconds;
  state.restEndTimestamp = Date.now() + seconds * 1000;
  saveState();
  syncMetronomeLoop();
  render();

  timerInterval = setInterval(function() {
    if (!state.restEndTimestamp) {
      clearInterval(timerInterval);
      return;
    }
    var left = Math.ceil((state.restEndTimestamp - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(timerInterval);
      state.isResting = false;
      state.restRemaining = 0;
      state.restEndTimestamp = null;
      playBell();
      advanceToNextStep();
    } else {
      state.restRemaining = left;
      var el = document.getElementById('restTimerText');
      if (el) el.textContent = formatTime(state.restRemaining);
    }
  }, 400);
}

function syncSessionAfterWake() {
  var didChange = false;

  if (state.isResting && state.restEndTimestamp) {
    var left = Math.ceil((state.restEndTimestamp - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(timerInterval);
      state.isResting = false;
      state.restRemaining = 0;
      state.restEndTimestamp = null;
      advanceToNextStep();
      return;
    } else {
      state.restRemaining = left;
      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        if (!state.restEndTimestamp) {
          clearInterval(timerInterval);
          return;
        }
        var rem = Math.ceil((state.restEndTimestamp - Date.now()) / 1000);
        if (rem <= 0) {
          clearInterval(timerInterval);
          state.isResting = false;
          state.restRemaining = 0;
          state.restEndTimestamp = null;
          playBell();
          advanceToNextStep();
        } else {
          state.restRemaining = rem;
          var el = document.getElementById('restTimerText');
          if (el) el.textContent = formatTime(state.restRemaining);
        }
      }, 400);
      didChange = true;
    }
  }

  var effType = getEffectiveDayType(state.day);
  if ((effType === 'routineA' || effType === 'routineB') && !hasAnyLoggedSets(state.sessionLogs) && !state.sessionCompletedToday) {
    var todayKey = getTodayDateKey();
    if (state.sessionDateKey !== todayKey) {
      state.sessionDateKey = todayKey;
      didChange = true;
    }
  }

  if (didChange) {
    saveState();
    render();
  }
}

function adjustRestTime(delta) {
  if (!state.isResting) return;
  var baseEnd = state.restEndTimestamp || (Date.now() + state.restRemaining * 1000);
  var newEnd = Math.max(Date.now() + 1000, baseEnd + delta * 1000);
  state.restEndTimestamp = newEnd;
  state.restRemaining = Math.max(1, Math.ceil((newEnd - Date.now()) / 1000));
  saveState();
  var el = document.getElementById('restTimerText');
  if (el) el.textContent = formatTime(state.restRemaining);
}

function skipRestTimer() {
  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;
  advanceToNextStep();
}

function formatTime(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ============================================================================
   6. FLUJO PRINCIPAL DE ENTRENAMIENTO (REGISTRO EN VIVO + PROTECCIÓN CONTRA DUPLICADOS)
   ============================================================================ */
function handlePrimaryAction() {
  blurAnyActiveInput();
  getAudioContext();
  var effectiveType = getEffectiveDayType(state.day);

  if (effectiveType === 'rest') {
    state.completedDays[state.day] = true;
    saveState();
    showToast('✓ Día de descanso marcado');
    render();
    return;
  }

  if (effectiveType === 'run') {
    saveRunSession();
    return;
  }

  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);

  if (state.isResting) {
    skipRestTimer();
    return;
  }

  if (state.sessionCompletedToday) {
    showToast('✓ Sesión ya completada (usa ↺ Reiniciar para repetir)');
    return;
  }

  var currentStep = steps[state.stepIndex];
  if (!currentStep) return;

  var nowTs = Date.now();
  if (!state.sessionStartTime) {
    state.sessionStartTime = nowTs;
  }
  state.sessionLastLogTime = nowTs;

  var ex = currentStep.ex;
  if (!state.sessionLogs[ex.id]) state.sessionLogs[ex.id] = [];

  var roundNum = currentStep.round;
  var weightVal = getEffectiveWeight(ex.weightKey, ex.defaultWeight);
  var repsLogged = Number(state.currentReps) || ex.defaultReps;
  var rirLogged = String(state.currentRIR || '2');

  // Busca exclusivamente por ranura de serie (set === roundNum) para evitar duplicaciones o series extra
  var existingIdx = state.sessionLogs[ex.id].findIndex(function(item) {
    return item.set === roundNum;
  });

  if (ex.unilateral) {
    if (existingIdx !== -1) {
      var prevObj = state.sessionLogs[ex.id][existingIdx];
      if (currentStep.limbIndex === 0) {
        prevObj.leftReps = repsLogged;
      } else {
        prevObj.rightReps = repsLogged;
      }
      prevObj.reps = (prevObj.leftReps !== null && prevObj.leftReps !== undefined ? prevObj.leftReps : '-') +
        '/' + (prevObj.rightReps !== null && prevObj.rightReps !== undefined ? prevObj.rightReps : '-');
      prevObj.rir = rirLogged;
      prevObj.weight = weightVal;
    } else {
      var lVal = currentStep.limbIndex === 0 ? repsLogged : null;
      var rVal = currentStep.limbIndex === 1 ? repsLogged : null;
      state.sessionLogs[ex.id].push({
        set: roundNum,
        leftReps: lVal,
        rightReps: rVal,
        reps: (lVal !== null ? lVal : '-') + '/' + (rVal !== null ? rVal : '-'),
        rir: rirLogged,
        weight: weightVal
      });
    }
  } else {
    if (existingIdx !== -1) {
      state.sessionLogs[ex.id][existingIdx] = {
        set: roundNum,
        reps: repsLogged,
        rir: rirLogged,
        weight: weightVal
      };
    } else {
      state.sessionLogs[ex.id].push({
        set: roundNum,
        reps: repsLogged,
        rir: rirLogged,
        weight: weightVal
      });
    }
  }

  // Asegura que nunca existan más entradas que el total configurado de series del ejercicio
  var maxAllowedSets = Number(ex.sets) || 3;
  state.sessionLogs[ex.id] = state.sessionLogs[ex.id]
    .filter(function(item) { return item.set >= 1 && item.set <= maxAllowedSets; })
    .sort(function(a, b) { return a.set - b.set; });

  state.completedDays[state.day] = true;

  var isLastStep = state.stepIndex >= steps.length - 1;
  syncStrengthSessionToHistory(
    rData,
    state.day,
    state.sessionLogs,
    state.sessionDateKey,
    state.sessionStartTime,
    isLastStep,
    null,
    { gripA: state.gripA, variantB2_B: state.variantB2_B }
  );

  if (isLastStep) {
    completeStrengthWorkout(rData);
    saveState();
    render();
    return;
  }

  if (currentStep.restAfter > 0) {
    startRestTimer(currentStep.restAfter);
  } else {
    advanceToNextStep();
  }
}

function advanceToNextStep() {
  var effectiveType = getEffectiveDayType(state.day);
  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);

  if (state.stepIndex < steps.length - 1) {
    state.stepIndex++;
    var nextStep = steps[state.stepIndex];
    state.expandedExId = nextStep.ex.id;

    var exLogs = state.sessionLogs[nextStep.ex.id] || [];
    var prevRound = exLogs.length > 0 ? exLogs[exLogs.length - 1] : null;
    if (prevRound) {
      if (nextStep.ex.unilateral) {
        state.currentReps = prevRound.leftReps || prevRound.rightReps || nextStep.ex.defaultReps;
      } else {
        state.currentReps = parseInt(prevRound.reps, 10) || nextStep.ex.defaultReps;
      }
    } else {
      state.currentReps = nextStep.ex.defaultReps;
    }
  }

  saveState();
  syncMetronomeLoop();
  render();
}

/* Guarda o actualiza en vivo el entrenamiento en el historial (un registro por día de ciclo) */
function upsertHistoryRecord(record) {
  var dateKey = record.dateKey || getTodayDateKey();
  record.dateKey = dateKey;
  var daySlot = Number(record.day) || Number(state.day) || 1;
  record.day = daySlot;

  var existingIdx = state.history.findIndex(function(h) {
    return h.type === record.type && Number(h.day) === daySlot && h.dateKey === dateKey;
  });

  if (existingIdx === -1) {
    existingIdx = state.history.findIndex(function(h) {
      return h.type === record.type && Number(h.day) === daySlot;
    });
  }

  if (existingIdx !== -1) {
    record.id = state.history[existingIdx].id || record.id;
    state.history[existingIdx] = record;
  } else {
    state.history.push(record);
  }
}

function syncStrengthSessionToHistory(rData, targetDay, logsSource, customDateKey, startTimeMs, isFinal, explicitDurationMin, sessionOpts) {
  var exercisesSummary = {};
  var hasLogs = false;

  rData.blocks.forEach(function(block) {
    block.exercises.forEach(function(ex) {
      var rawLogs = logsSource[ex.id];
      if (rawLogs && rawLogs.length > 0) {
        var maxSets = getExerciseTargetSets(block, ex);
        var cleanSets = rawLogs
          .filter(function(st) { return st.set >= 1 && st.set <= maxSets; })
          .sort(function(a, b) { return a.set - b.set; });
        if (cleanSets.length > 0) {
          hasLogs = true;
          var exRecord = {
            code: ex.code,
            name: ex.name,
            weight: getEffectiveWeight(ex.weightKey, ex.defaultWeight),
            sets: JSON.parse(JSON.stringify(cleanSets))
          };
          exercisesSummary[ex.id] = exRecord;
          state.lastExerciseRecords[ex.id] = exRecord;
        }
      }
    });
  });

  if (!hasLogs) return;

  var existingRec = state.history.find(function(h) {
    return h.type === 'strength' && Number(h.day) === Number(targetDay);
  });

  var dur = 38;
  if (explicitDurationMin !== null && explicitDurationMin !== undefined) {
    dur = explicitDurationMin;
  } else if (existingRec && existingRec.isCompleted && existingRec.durationMin) {
    dur = existingRec.durationMin;
  } else if (startTimeMs) {
    var endRef = isFinal ? (state.sessionLastLogTime || Date.now()) : Date.now();
    dur = Math.max(1, Math.round((endRef - startTimeMs) / 60000));
  }

  var dKey = customDateKey || getTodayDateKey();
  var lockedGripA = (sessionOpts && sessionOpts.gripA) || (existingRec && existingRec.gripA) || state.gripA;
  var lockedVarB2 = (sessionOpts && sessionOpts.variantB2_B) || (existingRec && existingRec.variantB2_B) || state.variantB2_B;

  var record = {
    id: (existingRec && existingRec.id) ? existingRec.id : Date.now(),
    dateKey: dKey,
    date: formatDateKeyForDisplay(dKey),
    type: 'strength',
    day: targetDay,
    routineType: rData.routineType,
    routine: rData.shortName,
    gripA: lockedGripA,
    variantB2_B: lockedVarB2,
    durationMin: dur,
    isCompleted: !!(isFinal || (existingRec && existingRec.isCompleted)),
    exercises: exercisesSummary
  };

  upsertHistoryRecord(record);
}

/* Revisa al cargar si quedó algún entrenamiento con series hechas en daySessions que aún no estaba en history */
function rescueUncommittedStrengthSessions() {
  var cycleDays = getCycleDays();
  var daySnaps = state.daySessions || {};

  Object.keys(daySnaps).forEach(function(dStr) {
    var dNum = Number(dStr);
    var snap = daySnaps[dNum];
    if (!snap || !hasAnyLoggedSets(snap.sessionLogs)) return;

    var alreadyInHistory = state.history.some(function(h) {
      return h.type === 'strength' && Number(h.day) === dNum;
    });
    if (alreadyInHistory) return;

    var dayObj = cycleDays.find(function(x) { return x.day === dNum; });
    var effType = snap.routineType || (dayObj ? (dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type) : 'routineA');
    if (effType === 'routineA' || effType === 'routineB') {
      var opts = {
        gripA: snap.gripA || state.gripA,
        variantB2_B: snap.variantB2_B || state.variantB2_B
      };
      var rData = getRoutineData(effType, opts);
      var frozenRescueDur = snap.sessionDurationMin ||
        (snap.sessionStartTime && snap.sessionLastLogTime
          ? Math.max(1, Math.round((snap.sessionLastLogTime - snap.sessionStartTime) / 60000))
          : 38);
      syncStrengthSessionToHistory(
        rData,
        dNum,
        snap.sessionLogs,
        snap.dateKey || getTodayDateKey(),
        snap.sessionStartTime,
        !!snap.sessionCompletedToday,
        frozenRescueDur,
        opts
      );
      state.completedDays[dNum] = true;
    }
  });
}

function completeStrengthWorkout(rData) {
  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;

  var endTs = state.sessionLastLogTime || Date.now();
  var frozenDur = state.sessionStartTime
    ? Math.max(1, Math.round((endTs - state.sessionStartTime) / 60000))
    : 38;
  state.sessionDurationMin = frozenDur;
  state.sessionCompletedToday = true;

  syncStrengthSessionToHistory(
    rData,
    state.day,
    state.sessionLogs,
    state.sessionDateKey,
    state.sessionStartTime,
    true,
    frozenDur,
    { gripA: state.gripA, variantB2_B: state.variantB2_B }
  );
  saveState();
  showToast('✓ Entrenamiento guardado (' + frozenDur + ' min)');
}

    state.runDistStr = '';

  state.restEndTimestamp = null;

  if (state.history && state.history.length > 0) {

    state.archivedHistory.unshift({
      id: Date.now(),
      closedAt: closedDateStr,

    });

  state._allowEmptyHistorySave = true;
  state.daySessions = {};
  state.runDrafts = {};
  state.dayOverrides = {};
  state.completedDays = {};
  state.sessionLogs = {};
  state.manualExpandedBlocks = {};
  state.stepIndex = 0;
  state.sessionStartTime = null;
  state.sessionLastLogTime = null;
  state.sessionDurationMin = null;
  state.sessionCompletedToday = false;
  state.sessionDateKey = getTodayDateKey();
  state.runDistStr = '';
  state.runTimeStr = '';
  state.runKcal = '';
  state.runDateKey = getTodayDateKey();

  var rData = getRoutineData(state.weekPattern === 'ABA' ? 'routineA' : 'routineB');

  var savedForThisDay = null;
  for (var i = state.history.length - 1; i >= 0; i--) {
    if (state.history[i].type === 'run' && Number(state.history[i].day) === Number(d)) {
      savedForThisDay = state.history[i];
      break;
    }
  }
  if (isDoneDay && savedForThisDay) {
    var dNum = parseFloat(savedForThisDay.dist);
    state.runDistStr = (!isNaN(dNum) && dNum > 0) ? dNum.toFixed(2) : '';
    state.runTimeStr = savedForThisDay.time ? String(savedForThisDay.time) : '';
    state.runKcal = savedForThisDay.kcal ? String(savedForThisDay.kcal) : '';
    state.runDateKey = savedForThisDay.dateKey || getTodayDateKey();
  } else {
    var draft = getRunDraft(d);
    state.runDistStr = draft.distStr;
    state.runTimeStr = draft.timeStr;
    state.runKcal = draft.kcal;
    state.runDateKey = draft.dateKey || getTodayDateKey();

/* Convierte el texto de distancia ("6.49") en número */
function parseDistanceKm(str) {
  if (!str) return 0;
  var clean = String(str).replace(',', '.').replace(/[^0-9.]/g, '');
  var parts = clean.split('.');
  if (parts.length > 2) {
    clean = parts[0] + '.' + parts.slice(1).join('');
  }
  var val = parseFloat(clean);
  return isNaN(val) ? 0 : val;
}

/* Convierte tiempo "30:11" (mm:ss) o "30" en minutos decimales */
function parseTimeMinutes(str) {
  if (!str) return 0;
  var clean = String(str).trim().replace(/[^0-9:]/g, '');
  if (!clean) return 0;
  if (clean.indexOf(':') !== -1) {
    var parts = clean.split(':');
    var mins = parseInt(parts[0], 10) || 0;
    var secs = parseInt((parts[1] || '0').slice(0, 2), 10) || 0;
    return mins + (secs / 60);
  }
  var onlyMins = parseFloat(clean);
  return isNaN(onlyMins) ? 0 : onlyMins;
}

function formatPaceFromRun(distStr, timeStr) {
  var d = parseDistanceKm(distStr);
  var t = parseTimeMinutes(timeStr);
  if (d <= 0 || t <= 0) {
    return { text: '--:-- /km', optimal: false, empty: true };
  }
  var pace = t / d;
  var mins = Math.floor(pace);
  var secs = Math.round((pace - mins) * 60);
  if (secs === 60) {
    mins += 1;
    secs = 0;
  }
  var optimal = pace >= 5.50 && pace <= 6.05;
  return {
    text: mins + ':' + (secs < 10 ? '0' : '') + secs + ' /km',
    optimal: optimal,
    empty: false
  };
}

/* Relleno en orden natural (de izquierda a derecha):
   - Distancia: 6 -> 6, 64 -> 6.4, 649 -> 6.49, 1025 -> 10.25
   - Tiempo: 3 -> 3, 30 -> 30, 301 -> 30:1, 3011 -> 30:11 */
function formatDigitsLeftToRight(digitsOnly, separatorChar, allowTwoLeadingDigitsThreshold) {
  if (!digitsOnly) return '';
  if (separatorChar === '.') {
    var d = digitsOnly.slice(0, 4);
    if (d.length <= 1) return d;
    if (d.length <= 3) return d.slice(0, 1) + '.' + d.slice(1);
    return d.slice(0, 2) + '.' + d.slice(2, 4);
  } else {
    var t = digitsOnly.slice(0, 4);
    if (t.length <= 2) return t;
    return t.slice(0, 2) + ':' + t.slice(2, 4);
  }
}

function onRunDistFormattedInput(inputEl, rawVal) {
  var digits = String(rawVal).replace(/\D/g, '');
  var formatted = formatDigitsLeftToRight(digits, '.');
  state.runDistStr = formatted;
  if (inputEl && inputEl.value !== formatted) {
    inputEl.value = formatted;
  }
  saveState();
  updateRunPaceLive();
}

function onRunTimeFormattedInput(inputEl, rawVal) {
  var digits = String(rawVal).replace(/\D/g, '');
  var formatted = formatDigitsLeftToRight(digits, ':');
  state.runTimeStr = formatted;
  if (inputEl && inputEl.value !== formatted) {
    inputEl.value = formatted;
  }
  saveState();
  updateRunPaceLive();
}

function onRunKcalInput(rawVal) {
  state.runKcal = String(rawVal).replace(/[^0-9]/g, '');
  saveState();
}

function updateRunPaceLive() {
  var pace = formatPaceFromRun(state.runDistStr, state.runTimeStr);
  var paceEl = document.getElementById('runPaceDisplay');
  var statusEl = document.getElementById('runPaceStatus');
  if (paceEl) paceEl.textContent = pace.text;
  if (statusEl) {
    if (pace.empty) {
      statusEl.className = 'pace-status';
      statusEl.textContent = 'PENDIENTE DE DATOS';
    } else {
      statusEl.className = 'pace-status ' + (pace.optimal ? 'ok' : 'warn');
      statusEl.textContent = pace.optimal ? '✓ ZONA AERÓBICA (5\'30"–6\'00")' : '⚡ FUERA DE RANGO META';
    }
  }
}

function saveRunSession() {
  blurAnyActiveInput();
  var d = parseDistanceKm(state.runDistStr);
  var t = parseTimeMinutes(state.runTimeStr);
  if (d <= 0 || t <= 0) {
    showToast('Ingresa distancia (ej. 6.49) y tiempo (ej. 30:11)');
    return;
  }
  var pace = formatPaceFromRun(state.runDistStr, state.runTimeStr);
  var distFormatted = d.toFixed(2);
  var timeFormatted = String(state.runTimeStr).trim();
  if (timeFormatted.indexOf(':') === -1) {
    timeFormatted = Math.floor(t) + ':00';
  }
  var dKey = state.runDateKey || getTodayDateKey();

  var record = {
    id: Date.now(),
    dateKey: dKey,
    date: formatDateKeyForDisplay(dKey),
    type: 'run',
    day: state.day,
    dist: distFormatted,
    time: timeFormatted,
    pace: pace.text,
    kcal: state.runKcal ? Number(state.runKcal) : null
  };
  upsertHistoryRecord(record);
  state.completedDays[state.day] = true;
  saveState();
  showToast('✓ Trote guardado en Historial');
  render();
}
