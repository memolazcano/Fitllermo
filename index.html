/* ============================================================================
   9. RENDERIZADO PRINCIPAL (CONSOLA UNIFICADA + BLOQUES DINÁMICOS)
   ============================================================================ */
function render() {
  var isABA = state.weekPattern === 'ABA';
  var wpText = document.getElementById('weekPatternText');
  if (wpText) wpText.textContent = isABA ? 'A-B-A' : 'B-A-B';

  document.getElementById('panelToggleBtn').classList.toggle('active', state.activeModal === 'panel');
  document.getElementById('historyToggleBtn').classList.toggle('active', state.activeModal === 'history');

  var days = getCycleDays();
  var stripEl = document.getElementById('daysStrip');
  stripEl.innerHTML = days.map(function(d) {
    var active = d.day === state.day && !state.activeModal ? 'active' : '';
    var done = state.completedDays[d.day] ? 'done' : '';
    return '<button type="button" class="day-btn ' + active + ' ' + done + '"' +
      ' onpointerdown="handleDayPointerDown(' + d.day + ')"' +
      ' onpointerup="handleDayPointerUp(' + d.day + ')"' +
      ' onpointerleave="handleDayPointerCancel()"' +
      ' onpointercancel="handleDayPointerCancel()"' +
      ' oncontextmenu="event.preventDefault(); openDayTypeMenu(' + d.day + ');">' +
      '<span class="d-num">' + d.short + '</span>' +
      '<span class="d-tag">' + d.tag + '</span>' +
      '</button>';
  }).join('');

  var mainEl = document.getElementById('mainContent');
  var mainBtn = document.getElementById('mainActionBtn');
  var secBtn = document.getElementById('secondaryActionBtn');
  var bottomDock = document.getElementById('bottomDock');

  if (state.activeModal === 'panel') {
    bottomDock.style.display = 'none';
    renderPanelView(mainEl);
    return;
  }

  if (state.activeModal === 'history') {
    bottomDock.style.display = 'none';
    renderHistoryView(mainEl);
    return;
  }

  bottomDock.style.display = 'block';
  secBtn.textContent = 'Reiniciar Semana ⇄';
  secBtn.onclick = function() { requestConfirmAction('resetWeek'); };

  var currentDayObj = days.find(function(x) { return x.day === state.day; }) || days[0];
  var effectiveType = getEffectiveDayType(state.day);

  if (effectiveType === 'rest') {
    renderRestView(mainEl, currentDayObj.type === 'run_opt');
    mainBtn.className = 'btn-primary-action';
    mainBtn.textContent = state.completedDays[state.day] ? '✓ Descanso Registrado' : '✓ Marcar Descanso Completado';
    return;
  }

  if (effectiveType === 'run') {
    renderRunView(mainEl, currentDayObj.type === 'run_opt');
    mainBtn.className = 'btn-primary-action';
    mainBtn.textContent = '✓ Guardar Trote';
    return;
  }

  renderStrengthView(mainEl, effectiveType);
}

function renderStrengthView(container, routineType) {
  var rData = getRoutineData(routineType);
  var steps = buildStepsForRoutine(rData);
  if (state.stepIndex >= steps.length) state.stepIndex = Math.max(0, steps.length - 1);
  var currentStep = steps[state.stepIndex];
  var activeBlockId = currentStep ? currentStep.blockId : rData.blocks[0].id;
  var mainBtn = document.getElementById('mainActionBtn');

  var curEx = currentStep.ex;
  var curWeightVal = curEx.weightKey ? getEffectiveWeight(curEx.weightKey, curEx.defaultWeight) : 0;
  var curWeightInputStr = curEx.weightKey && state.customWeights[curEx.weightKey] !== undefined
    ? state.customWeights[curEx.weightKey]
    : '';
  var overloadInfo = getOverloadSuggestion(curEx);

  var rirHints = {
    '0': 'Fallo técnico (0 en reserva)',
    '1': 'Zona óptima alta (1 en reserva)',
    '2': 'Objetivo ideal (2 en reserva)',
    '3+': 'Carga con margen (3+ en reserva)'
  };

  var undoBtnHTML = canUndoLastStep()
    ? '<button type="button" class="undo-step-btn" onclick="undoLastStep()">↶ Deshacer</button>'
    : '';

  var consoleHTML = '';
  if (state.isResting) {
    var nextStepPreview = steps[Math.min(state.stepIndex + 1, steps.length - 1)];
    consoleHTML = [
      '<div class="unified-console resting">',
        '<div class="uc-top">',
          '<div class="status-pill"><span class="pulse"></span> DESCANSO ACTIVO · ' + currentStep.restLabel + '</div>',
          '<div style="display:flex;gap:5px;align-items:center">',
            undoBtnHTML,
            '<button type="button" class="metro-quick-btn ' + (state.metroEnabled ? 'on' : '') + '" onclick="toggleMetronome()">',
              state.metroEnabled ? 'Metrónomo ON' : 'Metrónomo OFF',
            '</button>',
          '</div>',
        '</div>',
        '<div class="uc-rest-body">',
          '<div class="timer-display" id="restTimerText">' + formatTime(state.restRemaining) + '</div>',
          '<div class="timer-controls">',
            '<button type="button" class="mini-t-btn" onclick="adjustRestTime(-15)">−15s</button>',
            '<button type="button" class="mini-t-btn" onclick="adjustRestTime(15)">+15s</button>',
            '<button type="button" class="mini-t-btn" onclick="skipRestTimer()">Saltar →</button>',
          '</div>',
          '<div style="font-size:11.5px;color:var(--muted)">',
            'Siguiente: <strong style="color:var(--text)">' + nextStepPreview.ex.code + '. ' + nextStepPreview.ex.name + '</strong>' +
            (nextStepPreview.limbLabel ? ' · ' + nextStepPreview.limbLabel : ''),
          '</div>',
        '</div>',
      '</div>'
    ].join('');
    mainBtn.className = 'btn-primary-action resting-mode';
    mainBtn.textContent = 'Siguiente Serie → (Saltar Descanso)';
  } else {
    var weightSectionHTML = curEx.weightKey ? [
      '<div class="uc-weight-box">',
        '<div class="uc-weight-head">',
          '<span>Carga Activa</span>',
          '<span style="color:var(--accent)" data-weight-badge="' + curEx.weightKey + '">' + curWeightVal + ' kg</span>',
        '</div>',
        '<div class="uc-weight-row">',
          '<input type="text" inputmode="decimal" class="live-weight-input" data-weight-input="' + curEx.weightKey + '" placeholder="' + curEx.defaultWeight + '" value="' + curWeightInputStr + '" oninput="onWeightInputLive(\'' + curEx.weightKey + '\', this.value, ' + curEx.defaultWeight + ')" onblur="clearIOSUndoStack(this)">',
          '<span class="unit-lbl">kg</span>',
        '</div>',
        '<div class="overload-badge ' + overloadInfo.type + '">' + overloadInfo.label + '</div>',
      '</div>'
    ].join('') : [
      '<div class="uc-weight-box">',
        '<div class="uc-weight-head"><span>Carga Corporal</span><span style="color:var(--teal)">PC</span></div>',
        '<div style="font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--text)">' + curEx.tempo + '</div>',
        '<div class="overload-badge ' + overloadInfo.type + '">' + overloadInfo.label + '</div>',
      '</div>'
    ].join('');

    consoleHTML = [
      '<div class="unified-console">',
        '<div class="uc-top">',
          '<div class="status-pill"><span class="pulse"></span> SERIE ' + currentStep.round + '/' + currentStep.totalRounds + ' · PASO ' + (state.stepIndex + 1) + '/' + steps.length + '</div>',
          '<div style="display:flex;gap:5px;align-items:center">',
            undoBtnHTML,
            '<button type="button" class="metro-quick-btn ' + (state.metroEnabled ? 'on' : '') + '" onclick="toggleMetronome()">',
              state.metroEnabled ? 'Metrónomo ' + state.metroIntervalSec + 's' : 'Metrónomo OFF',
            '</button>',
          '</div>',
        '</div>',

        '<div class="uc-ex-header">',
          '<div class="uc-ex-title">' + curEx.code + '. ' + curEx.name + '</div>',
          currentStep.limbLabel ? '<span class="limb-badge">' + currentStep.limbLabel + '</span>' : '',
        '</div>',

        '<div class="uc-mid-grid">',
          '<div class="uc-reps-box">',
            '<button type="button" class="step-btn" onclick="adjustReps(-1)">−</button>',
            '<div>',
              '<div class="big-number" id="liveRepDisplay">' + state.currentReps + '</div>',
              '<span class="big-unit">REPS (META ' + curEx.minReps + '–' + curEx.maxReps + ')</span>',
            '</div>',
            '<button type="button" class="step-btn" onclick="adjustReps(1)">+</button>',
          '</div>',
          weightSectionHTML,
        '</div>',

        '<div class="uc-rir-bar">',
          '<div class="uc-rir-label">RIR AL TERMINAR<span id="rirLiveHint">' + (rirHints[state.currentRIR] || '') + '</span></div>',
          '<div class="rir-grid">',
            RIR_OPTIONS.map(function(rVal) {
              return '<button type="button" class="rir-btn ' + (state.currentRIR === rVal ? 'active' : '') + '" data-rir="' + rVal + '" onclick="setRIR(\'' + rVal + '\')">' + rVal + '</button>';
            }).join(''),
          '</div>',
        '</div>',
      '</div>'
    ].join('');

    mainBtn.className = 'btn-primary-action';
    mainBtn.textContent = state.sessionCompletedToday
      ? '✓ Entrenamiento Completado'
      : (state.stepIndex >= steps.length - 1
          ? '✓ Serie Completada (Fin)'
          : '✓ Serie Completada (' + currentStep.restAfter + 's)');
  }

  var activeIdx = rData.blocks.findIndex(function(b) { return b.id === activeBlockId; });
  if (activeIdx === -1) activeIdx = 0;

  var orderedBlocks = [];
  for (var i = activeIdx; i < rData.blocks.length; i++) {
    orderedBlocks.push({ block: rData.blocks[i], status: i === activeIdx ? 'active' : 'upcoming' });
  }
  for (var j = 0; j < activeIdx; j++) {
    orderedBlocks.push({ block: rData.blocks[j], status: 'completed' });
  }

  var blocksHTML = orderedBlocks.map(function(entry) {
    var block = entry.block;
    var status = entry.status;
    var isCompleted = status === 'completed';
    var isExpandedBlock = !isCompleted || !!state.manualExpandedBlocks[block.id];

    var blockContent = '';
    if (isExpandedBlock) {
      var cards = block.exercises.map(function(ex, idxInBlock) {
        var isCurrentEx = currentStep && currentStep.ex.id === ex.id && !state.isResting;
        var isExpandedCard = state.expandedExId === ex.id;
        var exLogs = state.sessionLogs[ex.id] || [];
        var lastRec = getLastExerciseRecord(ex.id);
        var effectiveW = ex.weightKey ? getEffectiveWeight(ex.weightKey, ex.defaultWeight) : 0;

        var chips = [];
        var totalSetsEx = getExerciseTargetSets(block, ex);
        for (var s = 1; s <= totalSetsEx; s++) {
          var found = exLogs.find(function(x) { return x.set === s; });
          var isSetActive = isCurrentEx && currentStep.round === s;
          if (found) {
            chips.push('<span class="set-chip done">S' + s + ': <b>' + found.reps + '</b> @RIR' + found.rir + '</span>');
          } else {
            chips.push('<span class="set-chip ' + (isSetActive ? 'active-set' : '') + '">S' + s + ': ' + ex.minReps + '–' + ex.maxReps + '</span>');
          }
        }

        var lastBar = lastRec
          ? '<div class="last-session-bar"><span>Última vez: <strong>' + lastRec.sets.map(function(x) { return x.reps + '@RIR' + x.rir; }).join(', ') + '</strong></span><span>' + (lastRec.weight ? lastRec.weight + ' kg' : 'PC') + '</span></div>'
          : '<div class="last-session-bar"><span>Primera sesión registrada en este ejercicio</span><span>Meta RIR 1–2</span></div>';

        var cardHTML = [
          '<div class="ex-card ' + (isCurrentEx ? 'current ' : '') + (isExpandedCard ? 'expanded' : '') + '">',

function buildSummaryText(rec) {
  if (!rec) return '';
  if (rec.type === 'run') {
    var kcalStr = rec.kcal ? ' | Energia: ' + rec.kcal + ' kcal' : '';
    return 'FITLLERMO · TROTE URBANO (' + rec.date + ')\n' +
      'Distancia: ' + rec.dist + ' km | Tiempo: ' + rec.time + ' | Ritmo: ' + rec.pace + kcalStr;
  }
  var lines = [
    'FITLLERMO · ' + rec.routine.toUpperCase() + ' (' + rec.date + ' · ' + rec.durationMin + ' min)'
  ];
  Object.keys(rec.exercises || {}).forEach(function(k) {
    var ex = rec.exercises[k];
    var setsStr = ex.sets.map(function(s) { return s.reps + '@RIR' + s.rir; }).join(', ');
    var wStr = ex.weight ? ex.weight + ' kg' : 'PC';
    lines.push('• ' + ex.code + '. ' + ex.name + ' [' + wStr + ']: ' + setsStr);
  });
  return lines.join('\n');
}

/* Reporte semanal objetivo: esquema cronológico real sin emoticones ni agarres en encabezado */
function buildWeeklyReportForChat() {
  var sortedSessions = state.history.slice().sort(function(a, b) {
    var kA = a.dateKey || '';
    var kB = b.dateKey || '';
    if (kA !== kB) return kA < kB ? -1 : 1;
    return (Number(a.day) || 0) - (Number(b.day) || 0);
  });

  var strengthSessions = sortedSessions.filter(function(h) { return h.type === 'strength'; });
  var runSessions = sortedSessions.filter(function(h) { return h.type === 'run'; });

  var dynamicScheme = strengthSessions.map(function(s) {
    if (s.routineType === 'routineB' || (s.routine && s.routine.indexOf('B') !== -1)) return 'B';
    return 'A';
  }).join('-');
  if (!dynamicScheme) {
    dynamicScheme = state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B';
  }

  var totalKm = runSessions.reduce(function(acc, r) { return acc + (parseFloat(r.dist) || 0); }, 0);
  var totalKcal = runSessions.reduce(function(acc, r) { return acc + (Number(r.kcal) || 0); }, 0);

  var out = [
    'REPORTE SEMANAL FITLLERMO',
    'Esquema de la semana: ' + dynamicScheme,
    'Sesiones de Fuerza: ' + strengthSessions.length + ' | Trotes: ' + runSessions.length + ' (' + totalKm.toFixed(2) + ' km' + (totalKcal > 0 ? ', ' + totalKcal + ' kcal' : '') + ')',
    '----------------------------------------'
  ];

  if (sortedSessions.length === 0) {
    out.push('Aun no hay sesiones registradas en esta semana.');
    return out.join('\n');
  }

  sortedSessions.forEach(function(rec, idx) {
    if (rec.type === 'run') {
      out.push((idx + 1) + '. [' + rec.date + '] Trote Urbano: ' + rec.dist + ' km en ' + rec.time + ' (Ritmo ' + rec.pace + (rec.kcal ? ', ' + rec.kcal + ' kcal' : '') + ')');
    } else {
      out.push((idx + 1) + '. [' + rec.date + '] ' + rec.routine + ' (' + rec.durationMin + ' min):');
      Object.keys(rec.exercises || {}).forEach(function(exId) {
        var ex = rec.exercises[exId];
        var setsTxt = ex.sets.map(function(s) { return s.reps + '@RIR' + s.rir; }).join(' | ');
        var wTxt = ex.weight ? ex.weight + ' kg' : 'PC';
        var progFlag = '';
        if (exId === 'A1_dom' && shouldFlagExerciseProgression(10, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'A2_push' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B1_bulg' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B2_curl' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B2_lat' && shouldFlagExerciseProgression(15, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'C_crunch' && shouldFlagExerciseProgression(15, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B_A1_rdl' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B_A2_pike' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B_B1_row' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if ((exId === 'B_B2_diam' || exId === 'B_B2_dips') && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        if (exId === 'B_C_hang' && shouldFlagExerciseProgression(12, ex.sets)) progFlag = ' [Subir carga / dificultad en proxima sesion]';
        out.push('   - ' + ex.code + ' ' + ex.name + ' (' + wTxt + '): ' + setsTxt + progFlag);
      });
    }
  });

  return out.join('\n');
}

function shareReportNative(text) {
  if (!text) return;
  if (navigator.share) {
    navigator.share({
      title: 'Reporte Semanal Fitllermo',
      text: text
    }).catch(function() {});
  } else {
    copyText(text);
  }
}

function deleteHistoryRecord(recordId) {
  var idx = state.history.findIndex(function(h) { return Number(h.id) === Number(recordId); });
  if (idx === -1) return;
  var removed = state.history[idx];
  state.history.splice(idx, 1);

  if (removed && removed.day) {
    var stillHasDay = state.history.some(function(h) { return Number(h.day) === Number(removed.day); });
    if (!stillHasDay) {
      delete state.completedDays[removed.day];
      if (state.daySessions && state.daySessions[removed.day]) {
        delete state.daySessions[removed.day];
      }
      if (Number(state.day) === Number(removed.day)) {
        state.sessionLogs = {};
        state.stepIndex = 0;
        state.sessionStartTime = null;
        state.sessionLastLogTime = null;
        state.sessionDurationMin = null;
        state.sessionCompletedToday = false;
      }
    }
  }

  saveState();
  showToast('✓ Registro eliminado');
  render();
}

function clearAllHistory() {
  if (!state.confirmingClearAll) {
    state.confirmingClearAll = true;
    render();
    return;
  }
  state.history = [];
  state._allowEmptyHistorySave = true;
  state.daySessions = {};
  state.completedDays = {};
  state.sessionLogs = {};
  state.stepIndex = 0;
  state.sessionStartTime = null;
  state.sessionLastLogTime = null;
  state.sessionDurationMin = null;
  state.sessionCompletedToday = false;
  state.confirmingClearAll = false;
  saveState();
  showToast('✓ Semana actual limpia');
  render();
}

function renderHistoryView(container) {
  var weeklyReport = buildWeeklyReportForChat();
  var itemsHTML = state.history.length === 0
    ? '<div style="text-align:center;color:var(--muted);padding:22px 0;font-size:13px">Aún no hay entrenamientos en la semana actual.</div>'
    : state.history.slice().reverse().map(function(rec) {
        var txt = buildSummaryText(rec);
        var encoded = encodeURIComponent(txt);
        return [
          '<div class="panel-section" style="padding:12px">',
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
              '<strong style="font-size:12.5px">' + (rec.type === 'run' ? 'Trote Urbano' : rec.routine) + ' · ' + rec.date + '</strong>',
              '<div style="display:flex;gap:5px">',
                '<button type="button" class="chip-btn" style="padding:4px 8px;font-size:10px" onclick="copyEncoded(\'' + encoded + '\')">📋 Copiar</button>',
                '<button type="button" class="chip-btn danger" style="padding:4px 8px;font-size:10px" onclick="deleteHistoryRecord(' + rec.id + ')">🗑 Limpiar</button>',
              '</div>',
            '</div>',
            '<pre class="summary-pre" style="margin-bottom:0">' + txt + '</pre>',
          '</div>'
        ].join('');
      }).join('');

  var archivedCount = Array.isArray(state.archivedHistory) ? state.archivedHistory.length : 0;
  var archivedSectionHTML = '';
  if (archivedCount > 0) {
    var archBody = '';
    if (state.showArchivedWeeks) {
      archBody = state.archivedHistory.map(function(wk) {
        var encWk = encodeURIComponent(wk.reportText || '');
        return [
          '<div class="panel-section" style="padding:12px;margin-top:8px;border-style:dashed">',
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
              '<strong style="font-size:12px;color:var(--muted)">Semana cerrada ' + wk.closedAt + ' (' + wk.pattern + ')</strong>',
              '<button type="button" class="chip-btn" style="padding:4px 8px;font-size:10px" onclick="copyEncoded(\'' + encWk + '\')">📋 Copiar</button>',
            '</div>',
            '<pre class="summary-pre" style="margin-bottom:0">' + (wk.reportText || '') + '</pre>',
          '</div>'
        ].join('');
      }).join('');
    }
    archivedSectionHTML = [
      '<div style="margin-top:14px">',
        '<button type="button" class="chip-btn" style="width:100%;padding:10px;text-align:center" onclick="state.showArchivedWeeks=!state.showArchivedWeeks;render()">',
          (state.showArchivedWeeks ? '▲ Ocultar Semanas Anteriores (' + archivedCount + ')' : '📁 Ver Semanas Anteriores (' + archivedCount + ')'),
        '</button>',
        archBody,
      '</div>'
    ].join('');
  }

  container.innerHTML = [
    '<div class="summary-card">',
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">',
        '<span style="font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--accent)">REPORTE DE LA SEMANA ACTUAL</span>',
        '<div style="display:flex;gap:5px">',
          '<button type="button" class="chip-btn" style="padding:5px 9px;font-size:10.5px" onclick="copyEncoded(\'' + encodeURIComponent(weeklyReport) + '\')">📋 Copiar</button>',
          '<button type="button" class="chip-btn active" style="padding:5px 9px;font-size:10.5px" onclick="shareReportNative(decodeURIComponent(\'' + encodeURIComponent(weeklyReport) + '\'))">📤 Compartir</button>',
        '</div>',
      '</div>',
      '<pre class="summary-pre" style="margin-bottom:0">' + weeklyReport + '</pre>',
    '</div>',

    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px">',
      '<span style="font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--muted)">SESIONES DE ESTA SEMANA (' + state.history.length + ')</span>',
      state.history.length > 0 ? '<button type="button" class="chip-btn danger" style="padding:5px 9px;font-size:10px" onclick="clearAllHistory()">' + (state.confirmingClearAll ? 'Confirmar Borrar Todo' : 'Limpiar Semana') + '</button>' : '',
    '</div>',
    itemsHTML,
    archivedSectionHTML
  ].join('');
}

function copyEncoded(encodedStr) {
  copyText(decodeURIComponent(encodedStr));
}

function copyText(text) {
  if (!text) return;
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ Copiado para el chat');
  } catch (e) {}
}

function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() {
    el.style.display = 'none';
  }, 2200);
}

/* ============================================================================
   13. INICIALIZACIÓN Y CICLO DE VIDA iOS (MINIMIZAR / BLOQUEAR PANTALLA)
   ============================================================================ */
window.addEventListener('historyUndo', function(e) {
  e.preventDefault();
});

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    saveState();
  } else if (document.visibilityState === 'visible') {
    syncSessionAfterWake();
  }
});

window.addEventListener('pagehide', function() {
  saveState();
});

window.addEventListener('pageshow', function() {
  syncSessionAfterWake();
});

window.addEventListener('focus', function() {
  syncSessionAfterWake();
});

window.onload = function() {
  setupIOSPWA();
  loadState();

  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType === 'routineA' || effectiveType === 'routineB') {
    var snap = state.daySessions && state.daySessions[state.day];
    var hasProgress = snap && (hasAnyLoggedSets(snap.sessionLogs) || snap.sessionCompletedToday);
    var opts = hasProgress
      ? { gripA: snap.gripA || state.gripA, variantB2_B: snap.variantB2_B || state.variantB2_B }
      : { gripA: state.gripA, variantB2_B: state.variantB2_B };
    var initRData = getRoutineData(effectiveType, opts);
    var initSteps = buildStepsForRoutine(initRData);
    if (!state.expandedExId && initSteps[0]) {
      state.expandedExId = initSteps[0].ex.id;
    }
    if (!hasAnyLoggedSets(state.sessionLogs) && !state.sessionCompletedToday) {
      state.sessionDateKey = getTodayDateKey();
    }
  } else if (effectiveType === 'run') {
    syncRunInputsForDay(state.day);
  }

  syncMetronomeLoop();
  render();
  syncSessionAfterWake();
};
</script>
