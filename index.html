<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fitllermo</title>

<!-- Configuración PWA nativa para iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitllermo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18181B">
<link id="appleTouchIcon" rel="apple-touch-icon" href="">
<link id="pwaManifest" rel="manifest" href="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #18181B;
    --card: #242429;
    --card-alt: #1E1E23;
    --border: #32323A;
    --border-strong: #454550;
    --text: #F4F4F0;
    --muted: #9E9EA8;
    --primary: #F4F4F0;
    --primary-text: #18181B;
    --accent: #EA580C;
    --accent-soft: rgba(234, 88, 12, 0.16);
    --accent-text: #FFFFFF;
    --teal: #14B8A6;
    --teal-soft: rgba(20, 184, 166, 0.14);
    --diag-bg: #151518;
    --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  input, textarea {
    user-select: text;
    -webkit-user-select: text;
  }

  .app-shell {
    max-width: 500px;
    margin: 0 auto;
    padding: 14px 14px 32px;
  }

  /* Header Suizo */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .braun-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(234, 88, 12, 0.55);
  }
  .brand-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
    cursor: pointer;
  }
  .brand-sub strong {
    color: var(--accent);
  }
  .top-actions {
    display: flex;
    gap: 6px;
  }
  .chip-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .chip-btn.danger:hover {
    border-color: #EF4444;
    color: #F87171;
  }

  /* Tira de 7 días */
  .days-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 12px;
  }
  .day-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 12px;
    padding: 8px 2px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    position: relative;
  }
  .day-btn .d-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    display: block;
  }
  .day-btn .d-tag {
    font-size: 9.5px;
    font-weight: 700;
    display: block;
    margin-top: 2px;
    opacity: 0.88;
  }
  .day-btn.active {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .day-btn.done::after {
    content: "";
    position: absolute;
    top: 4px;
    right: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* CONSOLA UNIFICADA EN SERIE (1 SOLA TARJETA) */
  .unified-console {
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  .unified-console.resting {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .uc-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status-pill .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
  }
  .unified-console.resting .status-pill {
    color: var(--accent);
  }
  .unified-console.resting .status-pill .pulse {
    background: var(--accent);
  }

  .metro-quick-btn {
    background: var(--card-alt);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .metro-quick-btn.on {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(234, 88, 12, 0.45);
  }
  .undo-step-btn {
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .undo-step-btn:active {
    background: var(--primary);
    color: var(--primary-text);
  }

  .uc-ex-header {
    margin-top: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .uc-ex-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.25;
  }
  .limb-badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(234, 88, 12, 0.4);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* Franja Central de la Consola Unificada: Reps + Carga */
  .uc-mid-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 10px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 10px;
    align-items: center;
  }
  @media (max-width: 380px) {
    .uc-mid-grid {
      grid-template-columns: 1fr;
    }
  }
  .uc-reps-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-right: 6px;
    border-right: 1px solid var(--border);
  }
  @media (max-width: 380px) {
    .uc-reps-box {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding-right: 0;
      padding-bottom: 8px;
    }
  }
  .step-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-btn:active {
    background: var(--primary);
    color: var(--primary-text);
  }
  .big-number {
    font-family: var(--font-mono);
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1.5px;
    color: var(--text);
    text-align: center;
  }
  .big-unit {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    display: block;
    margin-top: 2px;
    text-align: center;
  }

  .uc-weight-box {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 5px;
  }
  .uc-weight-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
  }
  .uc-weight-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-weight-input {
    width: 76px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 6px 7px;
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 800;
    text-align: center;
  }
  .live-weight-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unit-lbl {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .overload-badge {
    padding: 4px 7px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.25;
  }
  .overload-badge.up {
    background: var(--accent-soft);
    color: #FB923C;
    border: 1px solid rgba(234, 88, 12, 0.35);
  }
  .overload-badge.steady {
    background: var(--teal-soft);
    color: #2DD4BF;
    border: 1px solid rgba(20, 184, 166, 0.3);
  }
  .overload-badge.hold {
    background: rgba(245, 158, 11, 0.14);
    color: #FBBF24;
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  /* Franja Inferior de la Consola Unificada: RIR */
  .uc-rir-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 4px;
  }
  .uc-rir-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .uc-rir-label span {
    display: block;
    font-size: 9px;
    color: var(--accent);
    font-weight: 600;
  }
  .rir-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    flex: 1;
    max-width: 240px;
  }
  .rir-btn {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 0;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .rir-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(234, 88, 12, 0.35);
  }

  /* Estado Descanso dentro de la Consola Unificada */
  .uc-rest-body {
    text-align: center;
    padding: 10px 0 4px;
  }
  .timer-display {
    font-family: var(--font-mono);
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -2px;
    line-height: 1;
    margin: 6px 0 10px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    max-width: 300px;
    margin: 0 auto 10px;
  }
  .mini-t-btn {
    flex: 1;
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }

  /* BLOQUES DE BISERIE CON REORDENAMIENTO DINÁMICO */
  .biserie-capsule {
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 12px;
    transition: all 0.2s ease;
  }
  .biserie-capsule.active-block {
    border-color: var(--border-strong);
  }
  .biserie-capsule.completed-block {
    opacity: 0.72;
    background: #1A1A1E;
    border-style: dashed;
  }
  .capsule-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    cursor: pointer;
  }
  .capsule-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .capsule-pill {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
  }
  .capsule-body {
    margin-top: 10px;
  }

  .biserie-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 6px 0;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
  }
  .biserie-connector::before,
  .biserie-connector::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .biserie-connector span {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 99px;
    color: var(--accent);
  }

  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
  }
  .ex-card.current {
    border-color: var(--primary);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  }
  .ex-card-head {
    padding: 12px 13px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .ex-code {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    color: var(--text);
    margin-right: 6px;
  }
  .ex-card.current .ex-code {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
  }
  .ex-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
  }
  .ex-subline {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.35;
  }
  .ex-right-meta {
    text-align: right;
    flex-shrink: 0;
  }
  .ex-weight-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    display: block;
  }
  .ex-reps-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .sets-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 13px 10px;
  }
  .set-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 7px;
    background: var(--card-alt);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .set-chip.done {
    background: rgba(244, 244, 240, 0.08);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .set-chip.done b {
    color: var(--accent);
  }
  .set-chip.active-set {
    border-color: var(--primary);
    color: var(--primary);
  }

  .ex-body {
    display: none;
    padding: 0 13px 13px;
    border-top: 1px solid var(--border);
  }
  .ex-card.expanded .ex-body {
    display: block;
  }
  .last-session-bar {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    background: var(--card-alt);
    border: 1px solid var(--border);
    padding: 6px 9px;
    border-radius: 8px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .bio-canvas {
    background: var(--diag-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    margin-top: 9px;
  }
  .bio-legend {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    padding: 0 4px;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* VISTA TROTE URBANO MINIMALISTA CON AUTO-FORMATO 0.00 y 00:00 */
  .run-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .run-inputs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .run-field-box {
    background: var(--card-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .run-field-box label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .run-clean-input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 800;
    text-align: center;
  }
  .run-clean-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .run-pace-result {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 0;
  }
  .pace-big {
    font-family: var(--font-mono);
    font-size: 25px;
    font-weight: 800;
    color: var(--text);
  }
  .pace-status {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 8px;
  }
  .pace-status.ok {
    background: var(--teal-soft);
    color: #2DD4BF;
  }
  .pace-status.warn {
    background: var(--accent-soft);
    color: #FB923C;
  }

  /* MODAL PANEL DE CONTROL (⚙️ Panel) */
  .panel-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .panel-sec-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
  }
  .panel-row:first-of-type {
    border-top: none;
    padding-top: 2px;
  }
  .panel-lbl {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
  }
  .panel-sub {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .seg-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

</style>

<!-- Input oculto para importar respaldo JSON en iOS -->
<input type="file" id="jsonFileInput" accept=".json,application/json" style="display:none" onchange="handleFileImport(event)">

<script>
/* ============================================================================
   0. CONFIGURACIÓN PWA NATIVA iOS (ÍCONO AUTOMÁTICO EN CANVAS)
   ============================================================================ */
function setupIOSPWA() {
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#18181B';
    ctx.fillRect(0, 0, 512, 512);

    ctx.fillStyle = '#242429';
    ctx.strokeStyle = '#32323A';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.roundRect(44, 44, 424, 424, 88);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#F4F4F0';
    ctx.font = '800 250px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('F', 125, 272);

    ctx.fillStyle = '#EA580C';
    ctx.beginPath();
    ctx.arc(356, 172, 42, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#EA580C';
    ctx.beginPath();
    ctx.roundRect(130, 368, 252, 22, 11);
    ctx.fill();

    var iconDataUrl = canvas.toDataURL('image/png');
    var appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = iconDataUrl;

    var manifest = {
      name: 'Fitllermo',
      short_name: 'Fitllermo',
      start_url: '.',
      display: 'standalone',
      background_color: '#18181B',
      theme_color: '#18181B',
      icons: [{ src: iconDataUrl, sizes: '512x512', type: 'image/png' }]
    };
    var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var manifestUrl = URL.createObjectURL(manifestBlob);
    var manifestLink = document.getElementById('pwaManifest');
    if (manifestLink) manifestLink.href = manifestUrl;
  } catch (e) {}
}

/* ============================================================================
   1. ESTADO GLOBAL, MEMORIA POR DÍA Y ALTERNANCIA SEMANAL (A-B-A <-> B-A-B)
   ============================================================================ */
var STORAGE_KEY = 'fitllermo_swiss_bento_v3';
var KNOWN_STORAGE_KEYS = [
  'fitllermo_swiss_bento_v1',
  'fitllermo_swiss_bento_v2',
  'fitllermo_swiss_bento_v3',
  'fitllermo_swiss_bento_v4',
  'fitllermo_state',
  'fitllermo'
];
var RIR_OPTIONS = ['0', '1', '2', '3+'];

var DEFAULT_REST_CONFIG = {
  unilateral: 45,
  blockA: 80,
  blockB: 60,
  transition: 90,
  coreA: 45,
  coreB: 60
};

var state = {
  day: 1,
  weekPattern: 'ABA',      // 'ABA' | 'BAB'
  weekOrder: 'ABA',
  activeModal: null,       // null | 'panel' | 'history'
  sound: true,
  // Metrónomo Opción A (pulso editable en segundos)
  metroEnabled: false,
  metroIntervalSec: 1.0,
  // Configuraciones de rutina y series por bloque
  gripA: 'prono',          // 'prono' | 'supino'
  roundsBlockA: 3,
  roundsBlockB: 3,
  roundsBlockC: 3,
  variantB2_B: 'diamante', // 'diamante' | 'fondos'
  day6Mode: 'run',         // 'run' | 'rest'
  // Cargas personalizadas y tiempos de descanso editables
  customWeights: {},
  restConfig: Object.assign({}, DEFAULT_REST_CONFIG),
  // Progreso de la sesión activa (y diccionario por día para no perder progreso al cambiar de pestaña)
  stepIndex: 0,
  isResting: false,
  restRemaining: 0,
  restEndTimestamp: null,
  currentReps: 8,
  currentRIR: '2',
  expandedExId: null,
  manualExpandedBlocks: {},
  sessionLogs: {},
  sessionStartTime: null,
  daySessions: {},         // Guarda el progreso en vivo de cada día de fuerza { [day]: {...} }
  runDrafts: {},           // Guarda borradores no guardados de trote por día { [day]: { dist, time, kcal } }
  completedDays: {},
  confirmingClearAll: false,
  // Trote Urbano (vacío en días no realizados, auto-formato 0.00 y 00:00)
  runDistStr: '',
  runTimeStr: '',
  runKcal: '',
  // Historial de la semana actual + archivo de semanas cerradas + memoria de última vez por ejercicio
  history: [],
  archivedHistory: [],
  lastExerciseRecords: {},
  showArchivedWeeks: false
};

var timerInterval = null;
var metroTimer = null;
var sharedAudioCtx = null;

function getTodayDateKey() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function getCycleDays() {
  var order = state.weekPattern || state.weekOrder || 'ABA';
  var isABA = order === 'ABA';
  return [
    { day: 1, short: 'D1', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
    { day: 2, short: 'D2', tag: 'Trote',    type: 'run' },
    { day: 3, short: 'D3', tag: isABA ? 'Fuerza B' : 'Fuerza A', type: isABA ? 'routineB' : 'routineA' },
    { day: 4, short: 'D4', tag: 'Trote',    type: 'run' },
    { day: 5, short: 'D5', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
    { day: 6, short: 'D6', tag: 'Trote/D',  type: 'run_opt' },
    { day: 7, short: 'D7', tag: 'Descanso', type: 'rest' }
  ];
}

function getEffectiveDayType(dayNumber) {
  var days = getCycleDays();
  var dayObj = days.find(function(x) { return x.day === dayNumber; }) || days[0];
  return dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;
}

/* Guarda instantánea del día actual para que explorar otros días nunca borre las series hechas */
function saveCurrentDaySnapshot() {
  if (!state.daySessions || typeof state.daySessions !== 'object') {
    state.daySessions = {};
  }
  if (!state.runDrafts || typeof state.runDrafts !== 'object') {
    state.runDrafts = {};
  }
  var curType = getEffectiveDayType(state.day);
  if (curType === 'routineA' || curType === 'routineB') {
    state.daySessions[state.day] = {
      routineType: curType,
      stepIndex: Number(state.stepIndex) || 0,
      currentReps: Number(state.currentReps) || 8,
      currentRIR: String(state.currentRIR || '2'),
      expandedExId: state.expandedExId || null,
      manualExpandedBlocks: Object.assign({}, state.manualExpandedBlocks || {}),
      sessionLogs: JSON.parse(JSON.stringify(state.sessionLogs || {})),
      sessionStartTime: state.sessionStartTime || null
    };
  } else if (curType === 'run') {
    var cleanDist = (state.runDistStr === '0.00' || state.runDistStr === '0') ? '' : String(state.runDistStr || '');
    var cleanTime = (state.runTimeStr === '00:00' || state.runTimeStr === '0') ? '' : String(state.runTimeStr || '');
    var cleanKcal = state.runKcal === '0' ? '' : String(state.runKcal || '');
    state.runDrafts[state.day] = {
      distStr: cleanDist,
      timeStr: cleanTime,
      kcal: cleanKcal
    };
  }
}

function getRunDraft(d) {
  var draft = state.runDrafts && state.runDrafts[d];
  if (!draft || typeof draft !== 'object') {
    return { distStr: '', timeStr: '', kcal: '' };
  }
  var dist = (draft.distStr === '0.00' || draft.distStr === '0') ? '' : String(draft.distStr || '');
  var time = (draft.timeStr === '00:00' || draft.timeStr === '0') ? '' : String(draft.timeStr || '');
  var kcal = draft.kcal === '0' ? '' : String(draft.kcal || '');
  return { distStr: dist, timeStr: time, kcal: kcal };
}

function restoreDaySnapshot(targetDay) {
  var targetType = getEffectiveDayType(targetDay);
  if (targetType === 'routineA' || targetType === 'routineB') {
    var rData = getRoutineData(targetType);
    var steps = buildStepsForRoutine(rData);
    var snap = state.daySessions && state.daySessions[targetDay];

    if (snap && snap.routineType === targetType) {
      state.stepIndex = Math.min(Number(snap.stepIndex) || 0, Math.max(0, steps.length - 1));
      state.sessionLogs = JSON.parse(JSON.stringify(snap.sessionLogs || {}));
      state.manualExpandedBlocks = Object.assign({}, snap.manualExpandedBlocks || {});
      state.sessionStartTime = snap.sessionStartTime || null;
      state.currentRIR = String(snap.currentRIR || '2');
      var activeStep = steps[state.stepIndex] || steps[0];
      state.currentReps = Number(snap.currentReps) || (activeStep ? activeStep.ex.defaultReps : 8);
      state.expandedExId = snap.expandedExId || (activeStep ? activeStep.ex.id : null);
    } else {
      state.stepIndex = 0;
      state.sessionLogs = {};
      state.manualExpandedBlocks = {};
      state.sessionStartTime = null;
      state.currentRIR = '2';
      if (steps[0]) {
        state.currentReps = steps[0].ex.defaultReps;
        state.expandedExId = steps[0].ex.id;
      }
    }
  } else if (targetType === 'run') {
    syncRunInputsForDay(targetDay);
  }
}

/* Escáner universal con normalización profunda a prueba de fallos */
function loadState() {
  try {
    var keysToScan = [];
    for (var i = 0; i < localStorage.length; i++) {
      var kName = localStorage.key(i);
      if (kName && keysToScan.indexOf(kName) === -1) {
        keysToScan.push(kName);
      }
    }
    for (var j = 0; j < KNOWN_STORAGE_KEYS.length; j++) {
      if (keysToScan.indexOf(KNOWN_STORAGE_KEYS[j]) === -1) {
        keysToScan.push(KNOWN_STORAGE_KEYS[j]);
      }
    }

    var mergedHistory = [];
    var mergedArchived = [];
    var mergedLastRecords = {};
    var mergedWeights = {};
    var mergedDays = {};
    var preferredConfig = null;

    for (var idx = 0; idx < keysToScan.length; idx++) {
      var key = keysToScan[idx];
      var raw = null;
      try {
        raw = localStorage.getItem(key);
      } catch (eGet) {}
      if (!raw) continue;

      try {
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') continue;

        if (Array.isArray(parsed.history) && parsed.history.length > 0) {
          for (var hIdx = 0; hIdx < parsed.history.length; hIdx++) {
            var item = parsed.history[hIdx];
            if (!item || typeof item !== 'object') continue;
            var itemId = item.id || (item.date + '_' + item.type + '_' + item.day);
            var alreadyExists = mergedHistory.some(function(existing) {
              var exId = existing.id || (existing.date + '_' + existing.type + '_' + existing.day);
              return exId === itemId;
            });
            if (!alreadyExists) {
              mergedHistory.push(item);
            }
          }
        }

        var archSource = parsed.archivedHistory || parsed.archivedWeeks;
        if (Array.isArray(archSource) && archSource.length > 0) {
          for (var aIdx = 0; aIdx < archSource.length; aIdx++) {
            var archItem = archSource[aIdx];
            if (!archItem || typeof archItem !== 'object') continue;
            var archId = archItem.id || (archItem.closedAt + '_' + aIdx);
            var archExists = mergedArchived.some(function(exArch) {
              return (exArch.id || '') === archId;
            });
            if (!archExists) {
              mergedArchived.push(archItem);
            }
          }
        }

        var lastMemSource = parsed.lastExerciseRecords || parsed.lastExerciseMemory;
        if (lastMemSource && typeof lastMemSource === 'object') {
          mergedLastRecords = Object.assign({}, mergedLastRecords, lastMemSource);
        }

        if (parsed.customWeights && typeof parsed.customWeights === 'object') {
          mergedWeights = Object.assign({}, mergedWeights, parsed.customWeights);
        }

        if (parsed.completedDays && typeof parsed.completedDays === 'object') {
          mergedDays = Object.assign({}, mergedDays, parsed.completedDays);
        }

        if (key === STORAGE_KEY || !preferredConfig) {
          preferredConfig = parsed;
        }
      } catch (eParse) {}
    }

    mergedHistory.sort(function(a, b) {
      return (Number(a.id) || 0) - (Number(b.id) || 0);
    });

    for (var m = 0; m < mergedHistory.length; m++) {
      var hRec = mergedHistory[m];
      if (hRec && hRec.type === 'strength' && hRec.exercises) {
        Object.keys(hRec.exercises).forEach(function(exKey) {
          var exData = hRec.exercises[exKey];
          if (exData && exData.sets && exData.sets.length > 0) {
            mergedLastRecords[exKey] = exData;
          }
        });
      }
    }

    if (preferredConfig) {
      var resolvedOrder = preferredConfig.weekPattern || preferredConfig.weekOrder || 'ABA';
      var rawDrafts = (preferredConfig.runDrafts && typeof preferredConfig.runDrafts === 'object') ? preferredConfig.runDrafts : {};
      Object.keys(rawDrafts).forEach(function(dKey) {
        if (rawDrafts[dKey] && typeof rawDrafts[dKey] === 'object') {
          if (rawDrafts[dKey].distStr === '0.00' || rawDrafts[dKey].distStr === '0') rawDrafts[dKey].distStr = '';
          if (rawDrafts[dKey].timeStr === '00:00' || rawDrafts[dKey].timeStr === '0') rawDrafts[dKey].timeStr = '';
          if (rawDrafts[dKey].kcal === '0') rawDrafts[dKey].kcal = '';
        }
      });
      var initDistStr = (preferredConfig.runDistStr === '0.00' || preferredConfig.runDistStr === '0') ? '' : String(preferredConfig.runDistStr || '');
      var initTimeStr = (preferredConfig.runTimeStr === '00:00' || preferredConfig.runTimeStr === '0') ? '' : String(preferredConfig.runTimeStr || '');
      var initKcalStr = preferredConfig.runKcal === '0' ? '' : String(preferredConfig.runKcal || '');

      state = Object.assign({}, state, preferredConfig, {
        day: Number(preferredConfig.day) || 1,
        weekPattern: resolvedOrder,
        weekOrder: resolvedOrder,
        roundsBlockA: Number(preferredConfig.roundsBlockA || preferredConfig.roundsBlockA_A || 3),
        roundsBlockB: Number(preferredConfig.roundsBlockB || 3),
        roundsBlockC: Number(preferredConfig.roundsBlockC || 3),
        restConfig: Object.assign({}, DEFAULT_REST_CONFIG, preferredConfig.restConfig || {}),
        sessionLogs: (preferredConfig.sessionLogs && typeof preferredConfig.sessionLogs === 'object') ? preferredConfig.sessionLogs : {},
        manualExpandedBlocks: (preferredConfig.manualExpandedBlocks && typeof preferredConfig.manualExpandedBlocks === 'object') ? preferredConfig.manualExpandedBlocks : {},
        daySessions: (preferredConfig.daySessions && typeof preferredConfig.daySessions === 'object') ? preferredConfig.daySessions : {},
        runDrafts: rawDrafts,
        runDistStr: initDistStr,
        runTimeStr: initTimeStr,
        runKcal: initKcalStr,
        activeModal: null,
        confirmingClearAll: false
      });

      if (Array.isArray(preferredConfig.history) && preferredConfig.history.length === 0 && mergedArchived.length > 0) {
        mergedHistory = [];
        mergedDays = (preferredConfig.completedDays && typeof preferredConfig.completedDays === 'object') ? preferredConfig.completedDays : {};
      }
    }

    state.history = mergedHistory;
    state.archivedHistory = mergedArchived;
    state.lastExerciseRecords = mergedLastRecords;
    state.customWeights = Object.assign({}, state.customWeights, mergedWeights);
    state.completedDays = Object.assign({}, state.completedDays, mergedDays);

    if (mergedHistory.length > 0 || mergedArchived.length > 0 || Object.keys(mergedWeights).length > 0) {
      saveState();
    }
  } catch (e) {}
}

function saveState() {
  try {
    state.weekOrder = state.weekPattern;
    saveCurrentDaySnapshot();

    var existingRaw = localStorage.getItem(STORAGE_KEY);
    if (existingRaw && (!state.history || state.history.length === 0) && !state._allowEmptyHistorySave) {
      try {
        var prevObj = JSON.parse(existingRaw);
        if (prevObj && Array.isArray(prevObj.history) && prevObj.history.length > 0) {
          state.history = prevObj.history;
        }
      } catch (e) {}
    }
    state._allowEmptyHistorySave = false;

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      day: state.day,
      weekPattern: state.weekPattern,
      weekOrder: state.weekPattern,
      sound: state.sound,
      metroEnabled: state.metroEnabled,
      metroIntervalSec: state.metroIntervalSec,
      gripA: state.gripA,
      roundsBlockA: state.roundsBlockA,
      roundsBlockB: state.roundsBlockB,
      roundsBlockC: state.roundsBlockC,
      variantB2_B: state.variantB2_B,
      day6Mode: state.day6Mode,
      customWeights: state.customWeights,
      restConfig: state.restConfig,
      stepIndex: state.stepIndex,
      isResting: state.isResting,
      restRemaining: state.restRemaining,
      restEndTimestamp: state.restEndTimestamp,
      currentReps: state.currentReps,
      currentRIR: state.currentRIR,
      expandedExId: state.expandedExId,
      manualExpandedBlocks: state.manualExpandedBlocks,
      sessionLogs: state.sessionLogs,
      sessionStartTime: state.sessionStartTime,
      daySessions: state.daySessions,
      runDrafts: state.runDrafts,
      completedDays: state.completedDays,
      runDistStr: state.runDistStr,
      runTimeStr: state.runTimeStr,
      runKcal: state.runKcal,
      history: state.history,
      archivedHistory: state.archivedHistory,
      lastExerciseRecords: state.lastExerciseRecords
    }));
  } catch (e) {}
}

/* ============================================================================
   2. DEFINICIÓN DE RUTINAS, BLOQUES Y EQUIPAMIENTO (NOMBRES LIMPIOS)
   ============================================================================ */
function getEffectiveWeight(weightKey, defaultWeight) {
  if (!weightKey) return 0;
  var custom = state.customWeights[weightKey];
  if (custom !== undefined && custom !== null && custom !== '' && !isNaN(Number(custom))) {
    return Number(custom);
  }
  return defaultWeight;
}

function getAllEquipmentCatalog() {
  return [
    { key: 'bulgara_db', name: 'Mancuerna Búlgara (Rutina A · B1)', defaultWeight: 13.6, plates: '1×10lb + 1×2kg por lado (13,6 kg) o 1×1,5kg (12,6 kg)' },
    { key: 'curl_db',    name: 'Par Mancuernas Bíceps (Rutina A · B2)', defaultWeight: 7.5, plates: '2×2,5kg + 2×1,25kg por barra (7,5 kg c/u)' },
    { key: 'lat_db',     name: 'Par Mancuernas Laterales (Rutina A · B2)', defaultWeight: 3.0, plates: '1×1,5kg por lado (3 kg) o 1×2kg (4 kg)' },
    { key: 'crunch_plate', name: 'Disco Libre Crunches (Rutina A · C)', defaultWeight: 4.5, plates: 'Disco de 10 lbs (4,5 kg) o 2,5 kg al esternón' },
    { key: 'kb_heavy',   name: 'Kettlebell Ajustable (Rutina B · A1 y B1)', defaultWeight: 16.7, plates: 'Tope mango: 3×10lb + 1×2,5kg + mango (16,7 kg)' }
  ];
}

function getRoutineData(routineType) {
  var rc = Object.assign({}, DEFAULT_REST_CONFIG, state.restConfig || {});
  var rA = Number(state.roundsBlockA) || 3;

function buildStepsForRoutine(routineData) {
  var steps = [];
  routineData.blocks.forEach(function(block, bIdx) {
    for (var r = 1; r <= block.rounds; r++) {
      block.exercises.forEach(function(ex, eIdx) {
        var isLastExInBlock = eIdx === block.exercises.length - 1;
        var isLastRound = r === block.rounds;
        var isLastBlock = bIdx === routineData.blocks.length - 1;

        if (ex.unilateral) {
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: block.rounds,
            ex: ex,
            limbIndex: 0,
            limbLabel: ex.limbLabels[0],
            restAfter: ex.restBetweenLimbs,
            restLabel: 'Cambio de lado (' + ex.restBetweenLimbs + 's)'
          });
          var nextRest = ex.restAfter;
          var rLabel = 'Transición Biserie (' + ex.restAfter + 's)';
          if (isLastExInBlock && isLastRound) {
            nextRest = isLastBlock ? 0 : block.transitionRest;
            rLabel = isLastBlock ? 'Fin de sesión' : 'Pausa Fin de Bloque (' + nextRest + 's)';
          }
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: block.rounds,
            ex: ex,
            limbIndex: 1,
            limbLabel: ex.limbLabels[1],
            restAfter: nextRest,
            restLabel: rLabel
          });
        } else {
          var nextRest2 = ex.restAfter;
          var rLabel2 = block.type === 'biserie'
            ? 'Descanso Biserie (' + ex.restAfter + 's)'
            : 'Descanso Serie (' + ex.restAfter + 's)';
          if (isLastExInBlock && isLastRound) {
            nextRest2 = isLastBlock ? 0 : block.transitionRest;
            rLabel2 = isLastBlock ? 'Fin de sesión' : 'Pausa Fin de Bloque (' + nextRest2 + 's)';
          }
          steps.push({
            blockId: block.id,
            blockName: block.name,
            round: r,
            totalRounds: block.rounds,
            ex: ex,
            limbIndex: null,
            limbLabel: null,
            restAfter: nextRest2,
            restLabel: rLabel2
          });
        }
      });
    }
  });
  return steps;
}

/* ============================================================================
   3. MOTOR DE PESO EN VIVO, RIR, SERIES, DESHACER PASO Y ANTI-UNDO iOS
   ============================================================================ */
function clearIOSUndoStack(inputEl) {
  if (!inputEl || !inputEl.parentNode) return;
  try {
    var clone = inputEl.cloneNode(true);
    clone.value = inputEl.value;
    inputEl.parentNode.replaceChild(clone, inputEl);
  } catch (e) {}
}

function blurAnyActiveInput() {
  var act = document.activeElement;
  if (act && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA')) {
    act.blur();
  }
}

function onWeightInputLive(weightKey, rawValue, defaultWeight) {
  if (!weightKey) return;
  var cleaned = String(rawValue).replace(',', '.').replace(/[^0-9.]/g, '');
  if (cleaned === '') {
    delete state.customWeights[weightKey];
  } else {
    var num = parseFloat(cleaned);
    if (!isNaN(num) && num >= 0) {
      state.customWeights[weightKey] = num;
    }
  }
  saveState();

  var effective = getEffectiveWeight(weightKey, defaultWeight);
  var badges = document.querySelectorAll('[data-weight-badge="' + weightKey + '"]');
  for (var i = 0; i < badges.length; i++) {
    badges[i].textContent = effective + ' kg';
  }
  var inputs = document.querySelectorAll('input[data-weight-input="' + weightKey + '"]');
  for (var j = 0; j < inputs.length; j++) {
    if (document.activeElement !== inputs[j]) {
      inputs[j].value = state.customWeights[weightKey] !== undefined ? state.customWeights[weightKey] : '';
    }
  }
}

function updateBlockRounds(blockKey, newRounds) {
  blurAnyActiveInput();
  var effectiveType = getEffectiveDayType(state.day);
  var prevAnchor = null;

  if (effectiveType === 'routineA' || effectiveType === 'routineB') {
    var oldData = getRoutineData(effectiveType);
    var oldSteps = buildStepsForRoutine(oldData);
    prevAnchor = oldSteps[state.stepIndex] || null;
  }

  state[blockKey] = Number(newRounds);

  if (prevAnchor && (effectiveType === 'routineA' || effectiveType === 'routineB')) {
    var newData = getRoutineData(effectiveType);
    var newSteps = buildStepsForRoutine(newData);
    var foundIdx = newSteps.findIndex(function(s) {
      return s.ex.id === prevAnchor.ex.id && s.round === prevAnchor.round && s.limbIndex === prevAnchor.limbIndex;
    });
    if (foundIdx === -1) {
      foundIdx = newSteps.findIndex(function(s) {
        return s.ex.id === prevAnchor.ex.id;
      });
    }
    state.stepIndex = foundIdx !== -1 ? foundIdx : Math.min(state.stepIndex, Math.max(0, newSteps.length - 1));
  }

  saveState();
  render();
  showToast('✓ Series actualizadas en el entrenamiento activo');
}

    };

}

function adjustReps(delta) {

/* Permite deshacer la última serie/lado si presionaste "Serie Completada" por error */
function canUndoLastStep() {
  return state.isResting || state.stepIndex > 0;
}

function undoLastStep() {
  blurAnyActiveInput();
  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType !== 'routineA' && effectiveType !== 'routineB') return;

  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);
  var targetStepIdx = state.isResting ? state.stepIndex : Math.max(0, state.stepIndex - 1);
  var targetStep = steps[targetStepIdx];
  if (!targetStep) return;

  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;
  state.stepIndex = targetStepIdx;

  var ex = targetStep.ex;
  var exLogs = state.sessionLogs[ex.id] || [];
  var setEntryIdx = exLogs.findIndex(function(s) { return s.set === targetStep.round; });

  if (setEntryIdx !== -1) {
    var entry = exLogs[setEntryIdx];
    if (ex.unilateral && targetStep.limbIndex === 1 && entry.leftReps !== null && entry.leftReps !== undefined) {
      state.currentReps = Number(entry.rightReps) || ex.defaultReps;
      state.currentRIR = String(entry.rir || '2');
      entry.rightReps = null;
      entry.reps = entry.leftReps + '/-';
    } else {
      state.currentReps = Number(ex.unilateral ? entry.leftReps : entry.reps) || ex.defaultReps;
      state.currentRIR = String(entry.rir || '2');
      exLogs.splice(setEntryIdx, 1);
    }
  } else {
    state.currentReps = ex.defaultReps;
  }

  state.expandedExId = ex.id;
  saveState();
  syncMetronomeLoop();
  showToast('↶ Última serie deshecha');
  render();
}

function getLastExerciseRecord(exId) {
  for (var i = state.history.length - 1; i >= 0; i--) {
    var item = state.history[i];
    if (item && item.exercises && item.exercises[exId] && item.exercises[exId].sets && item.exercises[exId].sets.length > 0) {
      return item.exercises[exId];
    }
  }
  if (state.lastExerciseRecords && state.lastExerciseRecords[exId]) {
    return state.lastExerciseRecords[exId];
  }
  return null;
}

/* Sugerencia en vivo Serie a Serie basada en lo que acabas de hacer HOY */
function getOverloadSuggestion(ex) {
  var logsToday = (state.sessionLogs && state.sessionLogs[ex.id]) ? state.sessionLogs[ex.id] : [];
  var completedToday = logsToday.filter(function(s) {
    if (ex.unilateral) {
      return s.rightReps !== null && s.rightReps !== undefined;
    }
    return s.reps !== null && s.reps !== undefined;
  });

  if (completedToday.length === 0) {
    return {
      type: 'steady',
      label: 'Meta hoy: ' + ex.minReps + '–' + ex.maxReps + ' reps @ RIR 1–2'
    };
  }

  var lastSet = completedToday[completedToday.length - 1];
  var reps = ex.unilateral
    ? Math.min(Number(lastSet.leftReps) || 0, Number(lastSet.rightReps) || 0)
    : Number(lastSet.reps) || 0;
  var rir = String(lastSet.rir || '2');

  if (rir === '3+' && reps < ex.maxReps) {
    return {
      type: 'up',
      label: '↑ Quedó margen (RIR 3+): Sube +1 o +2 reps en esta serie'
    };
  }
  if (rir === '3+' && reps >= ex.maxReps) {
    return {
      type: 'up',
      label: '↑ Carga liviana hoy: Busca +1–2 reps sobre el rango (evalúa subir kg)'
    };
  }
  if ((rir === '1' || rir === '2') && reps >= ex.minReps) {
    return {
      type: 'steady',
      label: '✓ Zona óptima (RIR 1–2): Mantener peso y sostener reps'
    };
  }
  if (rir === '0' && reps >= ex.minReps) {
    return {
      type: 'hold',
      label: '⚠ Tocaste RIR 0: Mantén peso, baja 1 rep objetivo para cuidar técnica'
    };
  }
  return {
    type: 'hold',
    label: '↓ Bajo el rango mínimo: Baja 1–2 kg o prioriza técnica'
  };
}

/* ============================================================================
   4. AUDIO, METRÓNOMO EDITABLE (OPCIÓN A) Y TEMPORIZADOR EN SEGUNDO PLANO
   ============================================================================ */
function getAudioCtx() {
  if (!sharedAudioCtx) {
    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) sharedAudioCtx = new AudioContextClass();
  }
  if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
    sharedAudioCtx.resume();
  }
  return sharedAudioCtx;
}

function playBeep(freq, duration, type) {
  if (!state.sound) return;
  try {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq || 880;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.12));
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + (duration || 0.12));
  } catch (e) {}
}

function playMetronomeTick() {
  if (!state.sound || !state.metroEnabled) return;
  try {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + 0.045);
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  } catch (e) {}
}

function syncMetronomeLoop() {
  clearInterval(metroTimer);
  var effectiveType = getEffectiveDayType(state.day);
  var isStrength = effectiveType === 'routineA' || effectiveType === 'routineB';

  if (state.metroEnabled && isStrength && !state.isResting && state.activeModal === null) {
    var ms = Math.max(300, Math.round((Number(state.metroIntervalSec) || 1.0) * 1000));
    metroTimer = setInterval(playMetronomeTick, ms);
  }
}

function toggleMetronome() {
  blurAnyActiveInput();
  state.metroEnabled = !state.metroEnabled;
  if (state.metroEnabled) playMetronomeTick();
  saveState();
  syncMetronomeLoop();
  render();
}

function updateMetroInterval(newSec) {
  var val = parseFloat(String(newSec).replace(',', '.'));
  if (!isNaN(val) && val >= 0.3 && val <= 5.0) {
    state.metroIntervalSec = Math.round(val * 10) / 10;
    saveState();
    syncMetronomeLoop();
  }
}

function stepMetroInterval(delta) {
  var next = Math.max(0.4, Math.min(3.0, Math.round((state.metroIntervalSec + delta) * 10) / 10));
  state.metroIntervalSec = next;
  saveState();
  syncMetronomeLoop();
  var inp = document.getElementById('panelMetroInput');
  if (inp) inp.value = next.toFixed(1);
}

function runActiveRestLoop() {
  clearInterval(timerInterval);
  if (!state.isResting || !state.restEndTimestamp) return;

  var lastWholeSec = Math.ceil((state.restEndTimestamp - Date.now()) / 1000);

  timerInterval = setInterval(function() {
    var rem = Math.max(0, (state.restEndTimestamp - Date.now()) / 1000);
    state.restRemaining = rem;

    var whole = Math.ceil(rem);
    if (whole !== lastWholeSec && whole <= 3 && whole > 0) {
      playBeep(660, 0.1, 'sine');
      lastWholeSec = whole;
    }

    var timerEl = document.getElementById('liveTimerVal');
    if (timerEl) timerEl.textContent = rem.toFixed(1) + 's';

    if (rem <= 0) {
      clearInterval(timerInterval);
      playBeep(1046, 0.25, 'sine');
      finishRestAndAdvance();
    }
  }, 90);
}

function startRestTimer(seconds) {
  clearInterval(timerInterval);
  if (seconds <= 0) {
    finishRestAndAdvance();
    return;
  }
  state.isResting = true;
  state.restRemaining = seconds;
  state.restEndTimestamp = Date.now() + Math.round(seconds * 1000);
  saveState();
  syncMetronomeLoop();
  render();
  runActiveRestLoop();
}

function syncSessionAfterWake() {
  if (state.isResting && state.restEndTimestamp) {
    var rem = (state.restEndTimestamp - Date.now()) / 1000;
    if (rem <= 0) {
      clearInterval(timerInterval);
      finishRestAndAdvance();
    } else {
      state.restRemaining = rem;
      runActiveRestLoop();
      render();
    }
  }
}

function adjustRestTime(deltaSec) {
  if (!state.isResting) return;
  var currentRem = state.restEndTimestamp
    ? Math.max(0, (state.restEndTimestamp - Date.now()) / 1000)
    : state.restRemaining;
  var next = Math.max(1, currentRem + deltaSec);
  startRestTimer(next);
}

function skipRest() {
  clearInterval(timerInterval);
  finishRestAndAdvance();
}

function finishRestAndAdvance() {
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;
  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType !== 'routineA' && effectiveType !== 'routineB') {
    render();
    return;
  }
  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);

  if (state.stepIndex < steps.length - 1) {
    state.stepIndex++;
    var nextStep = steps[state.stepIndex];
    state.currentReps = nextStep.ex.defaultReps;
    state.expandedExId = nextStep.ex.id;
    saveState();
  } else {
    completeStrengthWorkout(rData);
  }
  syncMetronomeLoop();
  render();
}

/* ============================================================================
   5. FLUJO DE "SERIE COMPLETADA", REORDENAMIENTO Y CIERRE SEMANAL
   ============================================================================ */
function isBlockCompleted(block, logs) {
  return block.exercises.every(function(ex) {
    var exSets = (logs && logs[ex.id]) ? logs[ex.id] : [];
    if (exSets.length < block.rounds) return false;
    if (ex.unilateral) {
      return exSets.slice(0, block.rounds).every(function(s) {
        return s.rightReps !== null && s.rightReps !== undefined;
      });
    }
    return true;
  });
}

function handlePrimaryAction() {
  blurAnyActiveInput();
  if (state.activeModal !== null) {
    state.activeModal = null;
    syncMetronomeLoop();
    render();
    return;
  }

  var effectiveType = getEffectiveDayType(state.day);

  if (effectiveType === 'run') {
    saveRunSession();
    return;
  }
  if (effectiveType === 'rest') {
    state.completedDays[state.day] = true;
    saveState();
    showToast('Día de descanso registrado');
    render();
    return;
  }

  if (state.isResting) {
    skipRest();
    return;
  }

  var rData = getRoutineData(effectiveType);
  var steps = buildStepsForRoutine(rData);
  var curStep = steps[state.stepIndex];
  if (!curStep) return;

  if (!state.sessionStartTime) state.sessionStartTime = Date.now();

  var ex = curStep.ex;
  var usedWeight = ex.weightKey ? getEffectiveWeight(ex.weightKey, ex.defaultWeight) : 0;

  if (!state.sessionLogs[ex.id]) state.sessionLogs[ex.id] = [];

  if (ex.unilateral) {
    if (curStep.limbIndex === 0) {
      var existingLeft = state.sessionLogs[ex.id].find(function(s) { return s.set === curStep.round; });
      if (existingLeft) {
        existingLeft.leftReps = state.currentReps;
        existingLeft.rightReps = null;
        existingLeft.reps = state.currentReps + '/-';
        existingLeft.rir = state.currentRIR;
        existingLeft.weight = usedWeight;
      } else {
        state.sessionLogs[ex.id].push({
          set: curStep.round,
          leftReps: state.currentReps,
          rightReps: null,
          reps: state.currentReps + '/-',
          rir: state.currentRIR,
          weight: usedWeight
        });
      }
    } else {
      var existing = state.sessionLogs[ex.id].find(function(s) { return s.set === curStep.round; });
      if (existing) {
        existing.rightReps = state.currentReps;
        existing.reps = existing.leftReps + '/' + state.currentReps;
        existing.rir = state.currentRIR;
        existing.weight = usedWeight;
      } else {
        state.sessionLogs[ex.id].push({
          set: curStep.round,
          leftReps: state.currentReps,
          rightReps: state.currentReps,
          reps: state.currentReps + '/' + state.currentReps,
          rir: state.currentRIR,
          weight: usedWeight
        });
      }
    }
  } else {
    var existingSingle = state.sessionLogs[ex.id].find(function(s) { return s.set === curStep.round; });
    if (existingSingle) {
      existingSingle.reps = state.currentReps;
      existingSingle.rir = state.currentRIR;
      existingSingle.weight = usedWeight;
    } else {
      state.sessionLogs[ex.id].push({
        set: curStep.round,
        reps: state.currentReps,
        rir: state.currentRIR,
        weight: usedWeight
      });
    }
  }

  saveState();
  playBeep(784, 0.12, 'sine');

  if (curStep.restAfter > 0) {
    startRestTimer(curStep.restAfter);
  } else {
    finishRestAndAdvance();
  }
}

function upsertHistoryRecord(newRecord) {
  var existingIdx = state.history.findIndex(function(h) {
    return h.dateKey && newRecord.dateKey &&
           h.dateKey === newRecord.dateKey &&
           h.type === newRecord.type;
  });

  if (existingIdx !== -1) {
    state.history[existingIdx] = newRecord;
  } else {
    state.history.push(newRecord);
  }
}

function completeStrengthWorkout(rData) {
  var durationMin = state.sessionStartTime
    ? Math.max(1, Math.round((Date.now() - state.sessionStartTime) / 60000))
    : 38;

  if (!state.lastExerciseRecords) state.lastExerciseRecords = {};

  var exSummary = {};
  rData.blocks.forEach(function(b) {
    b.exercises.forEach(function(ex) {
      var sets = state.sessionLogs[ex.id] || [];
      var w = ex.weightKey ? getEffectiveWeight(ex.weightKey, ex.defaultWeight) + ' kg' : 'PC';
      var exEntry = {
        id: ex.id,
        name: ex.name,
        code: ex.code,
        minReps: ex.minReps,
        maxReps: ex.maxReps,
        weight: w,
        sets: sets
      };
      exSummary[ex.id] = exEntry;
      if (sets.length > 0) {
        state.lastExerciseRecords[ex.id] = exEntry;
      }
    });
  });

  var record = {
    id: Date.now(),
    dateKey: getTodayDateKey(),
    date: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
    day: state.day,
    weekPattern: state.weekPattern,
    type: 'strength',
    title: rData.title,
    shortName: rData.shortName,
    durationMin: durationMin,
    exercises: exSummary
  };

  upsertHistoryRecord(record);
  state.completedDays[state.day] = true;
  saveState();
  showToast('✓ Entrenamiento guardado en Historial');
}

/* ÚNICO BOTÓN QUE CIERRA Y ARCHIVA LA SEMANA: "Reiniciar ⇄" en la barra inferior */
function resetWeekAndFlipPattern() {
  blurAnyActiveInput();
  clearInterval(timerInterval);

  if (!state.lastExerciseRecords) state.lastExerciseRecords = {};
  if (!Array.isArray(state.archivedHistory)) state.archivedHistory = [];

  state.history.forEach(function(rec) {
    if (rec && rec.type === 'strength' && rec.exercises) {
      Object.keys(rec.exercises).forEach(function(exKey) {
        var exObj = rec.exercises[exKey];
        if (exObj && exObj.sets && exObj.sets.length > 0) {
          state.lastExerciseRecords[exKey] = exObj;
        }
      });
    }
  });

  if (state.history.length > 0) {
    state.archivedHistory.push({
      id: Date.now(),
      closedAt: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' }),
      weekPattern: state.weekPattern,
      sessions: state.history.slice()
    });
  }

  state.history = [];
  state.completedDays = {};
  state.daySessions = {};
  state.runDrafts = {};
  state.weekPattern = state.weekPattern === 'ABA' ? 'BAB' : 'ABA';
  state.weekOrder = state.weekPattern;
  state.day = 1;
  state.activeModal = null;
  state._allowEmptyHistorySave = true;

  resetOnlyCurrentDaySession(false);
  state._allowEmptyHistorySave = true;
  saveState();
  var label = state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B';
  showToast('⇄ Semana cerrada y archivada · Nuevo orden: ' + label);
  render();
}

/* Cambio manual de orden A-B-A <-> B-A-B: NO archiva ni borra sesiones de la semana */
function toggleWeekPatternManual(newPattern) {
  blurAnyActiveInput();
  var target = newPattern || (state.weekPattern === 'ABA' ? 'BAB' : 'ABA');
  if (state.weekPattern === target) return;

  saveCurrentDaySnapshot();
  state.weekPattern = target;
  state.weekOrder = target;
  restoreDaySnapshot(state.day);

  saveState();
  var label = state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B';
  showToast('Orden semanal cambiado a ' + label + ' (sin archivar semana)');
  render();
}

function resetOnlyCurrentDaySession(showFeedback) {
  clearInterval(timerInterval);
  state.isResting = false;
  state.restRemaining = 0;
  state.restEndTimestamp = null;
  state.stepIndex = 0;
  state.sessionLogs = {};
  state.manualExpandedBlocks = {};
  state.sessionStartTime = null;
  if (state.daySessions) delete state.daySessions[state.day];
  if (state.runDrafts) delete state.runDrafts[state.day];

  var effectiveType = getEffectiveDayType(state.day);
  if (effectiveType === 'routineA' || effectiveType === 'routineB') {
    var rData = getRoutineData(effectiveType);
    var steps = buildStepsForRoutine(rData);
    if (steps[0]) {
      state.currentReps = steps[0].ex.defaultReps;
      state.expandedExId = steps[0].ex.id;
    }
  } else if (effectiveType === 'run') {
    state.runDistStr = '';
    state.runTimeStr = '';
    state.runKcal = '';
  }
  saveState();
  syncMetronomeLoop();
  if (showFeedback) showToast('Sesión de hoy reiniciada');
  render();
}

/* ============================================================================
   6. TROTE URBANO CON AUTO-FORMATO DE "." (0.00) Y ":" (00:00)
   ============================================================================ */
function formatAutoDistance(raw) {
  var digits = String(raw || '').replace(/\D/g, '').slice(0, 4);
  if (!digits) return '';
  if (digits.length === 1) return digits;
  if (digits.length === 2) return digits.charAt(0) + '.' + digits.charAt(1);
  if (digits.length === 3) return digits.charAt(0) + '.' + digits.slice(1, 3);
  return digits.slice(0, 2) + '.' + digits.slice(2, 4);
}

function formatAutoTime(raw) {
  var digits = String(raw || '').replace(/\D/g, '').slice(0, 4);
  if (!digits) return '';
  if (digits.length <= 2) return digits;
  return digits.slice(0, 2) + ':' + digits.slice(2);
}

function moveCursorToEnd(el) {
  if (!el) return;
  setTimeout(function() {
    try {
      var len = el.value.length;
      el.setSelectionRange(len, len);
    } catch (e) {}
  }, 0);
}

function parseRunTimeSeconds(rawTime) {
  var str = String(rawTime || '').trim();
  if (!str || str === '00:00') return 0;
  if (str.indexOf(':') !== -1) {
    var parts = str.split(':');
    var m = parseInt(parts[0], 10) || 0;
    var s = parseInt(parts[1], 10) || 0;
    return m * 60 + Math.min(59, Math.max(0, s));
  }
  var mOnly = parseInt(str.replace(/\D/g, ''), 10);
  return isNaN(mOnly) ? 0 : mOnly * 60;
}

function formatNormalizedRunTime(rawTime) {
  var totalSec = parseRunTimeSeconds(rawTime);
  if (totalSec <= 0) return '00:00';
  var m = Math.floor(totalSec / 60);
  var s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatPaceFromRun(distStr, timeStr) {
  var d = parseFloat(String(distStr || '').replace(',', '.'));
  var totalSec = parseRunTimeSeconds(timeStr);
  if (!d || d <= 0 || totalSec <= 0) {
    return { text: "--'--\" /km", secPerKm: 0, optimal: false, empty: true };
  }
  var secPerKm = Math.round(totalSec / d);
  var pMin = Math.floor(secPerKm / 60);
  var pSec = secPerKm % 60;
  var optimal = secPerKm >= 335 && secPerKm <= 365 && d >= 4.8 && d <= 6.8;
  return {
    text: pMin + "'" + String(pSec).padStart(2, '0') + '" /km',
    secPerKm: secPerKm,
    optimal: optimal,
    empty: false
  };
}

function updateLiveRunPaceDisplay() {
  var pace = formatPaceFromRun(state.runDistStr, state.runTimeStr);
  var paceEl = document.getElementById('runLivePace');
  var badgeEl = document.getElementById('runLiveStatus');
  if (paceEl) paceEl.textContent = pace.text;
  if (badgeEl) {
    if (pace.empty) {
      badgeEl.className = 'pace-status';
      badgeEl.textContent = 'PENDIENTE DE DATOS';
    } else {
      badgeEl.className = 'pace-status ' + (pace.optimal ? 'ok' : 'warn');
      badgeEl.textContent = pace.optimal ? '✓ RITMO META (5\'40"–6\'00")' : '⚡ RITMO REGISTRADO';
    }
  }
}

function onRunDistFormattedInput(inputEl) {
  var formattedDist = formatAutoDistance(inputEl.value);
  state.runDistStr = formattedDist;
  inputEl.value = formattedDist;
  moveCursorToEnd(inputEl);
  saveState();
  updateLiveRunPaceDisplay();
}

function onRunTimeFormattedInput(inputEl) {
  var formattedTime = formatAutoTime(inputEl.value);
  state.runTimeStr = formattedTime;
  inputEl.value = formattedTime;
  moveCursorToEnd(inputEl);
  saveState();
  updateLiveRunPaceDisplay();
}

function onCleanRunInput(field, inputEl) {
  if (field === 'dist') {
    onRunDistFormattedInput(inputEl);
  } else if (field === 'time') {
    onRunTimeFormattedInput(inputEl);
  } else if (field === 'kcal') {
    var digits = String(inputEl.value || '').replace(/\D/g, '').slice(0, 4);
    state.runKcal = digits === '' ? '' : String(parseInt(digits, 10) || '');
    inputEl.value = state.runKcal;
    saveState();
  }
}

function saveRunSession() {
  var dVal = parseFloat(String(state.runDistStr || '').replace(',', '.'));
  var totalSec = parseRunTimeSeconds(state.runTimeStr);
  if (!dVal || dVal <= 0 || totalSec <= 0) {
    showToast('⚠ Ingresa distancia y tiempo antes de guardar');
    return;
  }
  var pace = formatPaceFromRun(dVal, state.runTimeStr);
  var formattedTime = formatNormalizedRunTime(state.runTimeStr);
  var record = {
    id: Date.now(),
    dateKey: getTodayDateKey(),
    date: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
    day: state.day,
    type: 'run',
    title: 'Trote Urbano',
    distKm: dVal.toFixed(2),
    timeFormatted: formattedTime,
    pace: pace.text,
    secPerKm: pace.secPerKm,
    kcal: state.runKcal ? Number(state.runKcal) : 0
  };
  upsertHistoryRecord(record);
  state.completedDays[state.day] = true;
  if (state.runDrafts) delete state.runDrafts[state.day];
  saveState();
  showToast('✓ Trote guardado en Historial');
  render();
}

/* ============================================================================
   7. REPORTE SEMANAL OBJETIVO, COMPARTIR NATIVO iOS Y BORRADO INDIVIDUAL
   ============================================================================ */
function buildSummaryText(record) {
  if (!record) return '';
  if (record.type === 'run') {
    var kcalLine = record.kcal ? '\n• Energía activa: ' + record.kcal + ' kcal' : '';
    return [
      '📋 Fitllermo — ' + record.title + ' (' + record.date + ')',
      '• Distancia: ' + record.distKm + ' km',
      '• Tiempo total: ' + record.timeFormatted,
      '• Ritmo promedio: ' + record.pace + kcalLine
    ].join('\n');
  }
  var lines = [
    '📋 Fitllermo — ' + record.title + ' (' + record.date + ')',
    '• Duración: ' + record.durationMin + ' min'
  ];
  Object.keys(record.exercises || {}).forEach(function(k) {
    var ex = record.exercises[k];
    var setsStr = (ex.sets || []).map(function(s) {
      return s.reps + '@RIR' + s.rir;
    }).join(', ') || 'Sin series';
    lines.push('• ' + ex.code + '. ' + ex.name + ' (' + ex.weight + '): ' + setsStr);
  });
  return lines.join('\n');
}

function buildWeeklyReportForChat() {
  if (!state.history || state.history.length === 0) {
    return '📊 REPORTE SEMANAL FITLLERMO\nAún no hay sesiones registradas en la semana actual.';
  }

  var strengthSessions = state.history.filter(function(r) { return r.type === 'strength'; });
  var runSessions = state.history.filter(function(r) { return r.type === 'run'; });

  var totalKm = runSessions.reduce(function(acc, r) {
    return acc + (parseFloat(r.distKm) || 0);
  }, 0);

  var lines = [
    '📊 REPORTE SEMANAL FITLLERMO',
    '• Esquema de la semana: ' + (state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B') + ' | Agarre A: ' + state.gripA.toUpperCase() + ' | B2 Rutina B: ' + state.variantB2_B.toUpperCase(),
    '• Sesiones registradas: ' + strengthSessions.length + ' Fuerza + ' + runSessions.length + ' Trotes (' + totalKm.toFixed(2) + ' km acumulados)',
    ''
  ];

  if (strengthSessions.length > 0) {
    lines.push('🏋️‍♂️ SESIONES DE FUERZA:');
    strengthSessions.forEach(function(s) {
      lines.push('▸ ' + (s.shortName || s.title) + ' (' + s.date + ' · ' + s.durationMin + ' min):');
      Object.keys(s.exercises || {}).forEach(function(k) {
        var ex = s.exercises[k];
        var setsArr = ex.sets || [];
        var setsFormatted = setsArr.map(function(st) {
          return st.reps + '@RIR' + st.rir;
        }).join(', ');
        lines.push('  - ' + ex.code + ' ' + ex.name + ' [' + ex.weight + ']: ' + (setsFormatted || 'Sin series'));
      });
    });
    lines.push('');
  }

  if (runSessions.length > 0) {
    lines.push('🏃‍♂️ SESIONES DE TROTE URBANO:');
    runSessions.forEach(function(r) {
      var timeDisplay = r.timeFormatted || (r.timeMin + ' min');
      var kcalInfo = r.kcal ? ' · ' + r.kcal + ' kcal' : '';
      lines.push('  - ' + r.date + ': ' + r.distKm + ' km en ' + timeDisplay + ' (Ritmo ' + r.pace + kcalInfo + ')');
    });
  }

  return lines.join('\n');
}

function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      showToast('📋 Copiado al portapapeles');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Copiado al portapapeles');
  }
}

function shareReportNative() {
  var txt = buildWeeklyReportForChat();
  if (navigator.share) {
    navigator.share({
      title: 'Reporte Semanal Fitllermo',
      text: txt
    }).catch(function() {});
  } else {
    copyText(txt);
  }
}

function deleteHistoryRecord(recordId) {
  var target = state.history.find(function(h) { return h.id === recordId; });
  state.history = state.history.filter(function(h) { return h.id !== recordId; });
  if (target && target.day) {
    var stillHasDay = state.history.some(function(h) { return h.day === target.day; });
    if (!stillHasDay) {
      delete state.completedDays[target.day];
    }
  }
  state._allowEmptyHistorySave = true;
  saveState();
  showToast('🗑 Registro eliminado del historial y reporte');
  render();
}

function clearAllHistory() {
  state.history = [];
  state.completedDays = {};
  state.confirmingClearAll = false;
  state._allowEmptyHistorySave = true;
  saveState();
  showToast('Semana actual limpiada');
  render();
}

function handleFileImport(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      if (parsed && Array.isArray(parsed.history)) {
        state.history = parsed.history;
        if (parsed.customWeights) state.customWeights = parsed.customWeights;
        if (parsed.restConfig) state.restConfig = Object.assign({}, DEFAULT_REST_CONFIG, parsed.restConfig);
        if (parsed.completedDays) state.completedDays = parsed.completedDays;
        saveState();
        render();
        showToast('✓ Historial y pesos restaurados');
      } else {
        showToast('⚠ Archivo JSON no válido');
      }
    } catch (err) {
      showToast('⚠ Error al leer el archivo JSON');
    }
  };
  reader.readAsText(file);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2400);
}
