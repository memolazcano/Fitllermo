    /* =========================================================================
       5. AUDIO, METRÓNOMO EDITABLE (OPCIÓN A) Y TEMPORIZADOR DE DESCANSO
       ========================================================================= */
    function getAudioCtx() {
      if (!sharedAudioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) sharedAudioCtx = new AudioClass();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playBeep(freq = 880, duration = 0.12, type = 'sine', vol = 0.16) {
      if (!state.sound) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    /* Pulso de Metrónomo (Opción A) */
    function restartMetronomeLoop() {
      clearInterval(metroTimer);
      if (!state.metroEnabled) return;
      const ms = Math.max(300, Math.min(5000, Math.round((Number(state.metroIntervalSec) || 1.0) * 1000)));
      metroTimer = setInterval(() => {
        if (!state.isResting && state.activeModal === null) {
          playBeep(960, 0.04, 'triangle', 0.08);
          const led = document.getElementById('liveMetroLed');
          if (led) {
            led.classList.remove('pulsing');
            void led.offsetWidth;
            led.classList.add('pulsing');
          }
        }
      }, ms);
    }

    function toggleMetronome() {
      state.metroEnabled = !state.metroEnabled;
      saveState();
      if (state.metroEnabled) {
        playBeep(960, 0.04, 'triangle', 0.09);
        restartMetronomeLoop();
        showToast(`⏱ Metrónomo ON (${Number(state.metroIntervalSec).toFixed(1)}s)`);
      } else {
        clearInterval(metroTimer);
        showToast('⏱ Metrónomo OFF');
      }
      render();
    }

    function updateMetroInterval(newVal) {
      const parsed = parseFloat(String(newVal).replace(',', '.'));
      if (!isNaN(parsed)) {
        state.metroIntervalSec = Math.max(0.3, Math.min(5.0, Math.round(parsed * 10) / 10));
        saveState();
        if (state.metroEnabled) restartMetronomeLoop();
        const inp = document.getElementById('panelMetroInput');
        if (inp && document.activeElement !== inp) {
          inp.value = state.metroIntervalSec.toFixed(1);
        }
      }
    }

    function stepMetroInterval(delta) {
      const next = Math.max(0.3, Math.min(5.0, Math.round((Number(state.metroIntervalSec) + delta) * 10) / 10));
      state.metroIntervalSec = next;
      saveState();
      if (state.metroEnabled) restartMetronomeLoop();
      render();
    }

    function startRestTimer(seconds) {
      clearInterval(timerInterval);
      if (seconds <= 0) {
        finishRestAndAdvance();
        return;
      }
      state.isResting = true;
      state.restRemaining = seconds;
      render();

      let lastWholeSec = Math.ceil(seconds);
      const endTime = performance.now() + seconds * 1000;

      timerInterval = setInterval(() => {
        const now = performance.now();
        const rem = Math.max(0, (endTime - now) / 1000);
        state.restRemaining = rem;

        const whole = Math.ceil(rem);
        if (whole !== lastWholeSec && whole <= 3 && whole > 0) {
          playBeep(660, 0.09);
          lastWholeSec = whole;
        }

        const timerEl = document.getElementById('liveTimerVal');
        if (timerEl) timerEl.textContent = rem.toFixed(1) + 's';

        if (rem <= 0) {
          clearInterval(timerInterval);
          playBeep(1046, 0.24);
          finishRestAndAdvance();
        }
      }, 80);
    }

    function adjustRestTime(deltaSec) {
      if (!state.isResting) return;
      const next = Math.max(1, state.restRemaining + deltaSec);
      startRestTimer(next);
    }

    function skipRest() {
      clearInterval(timerInterval);
      finishRestAndAdvance();
    }

    function finishRestAndAdvance() {
      state.isResting = false;
      state.restRemaining = 0;
      const days = getCycleDays();
      const dayObj = days.find(d => d.day === state.day);
      const rData = getRoutineData(dayObj.type);
      const steps = buildStepsForRoutine(rData);

      if (state.stepIndex < steps.length - 1) {
        state.stepIndex++;
        const nextStep = steps[state.stepIndex];
        state.currentReps = nextStep.ex.defaultReps;
        state.expandedExId = nextStep.ex.id;
      } else {
        completeStrengthWorkout(rData);
      }
      render();
    }

    /* =========================================================================
       6. FLUJO DE SERIE COMPLETADA Y REINICIO CON ALTERNANCIA A-B-A ⇄ B-A-B
       ========================================================================= */
    function handlePrimaryAction() {
      if (state.activeModal !== null) {
        state.activeModal = null;
        render();
        return;
      }

      const days = getCycleDays();
      const dayObj = days.find(d => d.day === state.day);
      const effectiveType = dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;

      if (effectiveType === 'run') {
        saveRunSession();
        return;
      }
      if (effectiveType === 'rest') {
        state.completedDays[state.day] = true;
        saveState();
        showToast('✓ Día de descanso registrado');
        render();
        return;
      }

      if (state.isResting) {
        skipRest();
        return;
      }

      const rData = getRoutineData(effectiveType);
      const steps = buildStepsForRoutine(rData);
      const curStep = steps[state.stepIndex];
      if (!curStep) return;

      if (!state.sessionStartTime) state.sessionStartTime = Date.now();

      const ex = curStep.ex;
      const usedWeight = ex.weightKey ? getEffectiveWeight(ex.weightKey, ex.defaultWeight) : 0;

      if (!state.sessionLogs[ex.id]) state.sessionLogs[ex.id] = [];

      if (ex.unilateral) {
        if (curStep.limbIndex === 0) {
          state.sessionLogs[ex.id].push({
            set: curStep.round,
            leftReps: state.currentReps,
            rightReps: null,
            reps: `${state.currentReps}/-`,
            rir: state.currentRIR,
            weight: usedWeight
          });
        } else {
          const existing = state.sessionLogs[ex.id].find(s => s.set === curStep.round);
          if (existing) {
            existing.rightReps = state.currentReps;
            existing.reps = `${existing.leftReps}/${state.currentReps}`;
            existing.rir = state.currentRIR;
            existing.weight = usedWeight;
          } else {
            state.sessionLogs[ex.id].push({
              set: curStep.round,
              leftReps: state.currentReps,
              rightReps: state.currentReps,
              reps: `${state.currentReps}/${state.currentReps}`,
              rir: state.currentRIR,
              weight: usedWeight
            });
          }
        }
      } else {
        state.sessionLogs[ex.id].push({
          set: curStep.round,
          reps: state.currentReps,
          rir: state.currentRIR,
          weight: usedWeight
        });
      }

      playBeep(784, 0.12);

      if (curStep.restAfter > 0) {
        startRestTimer(curStep.restAfter);
      } else {
        finishRestAndAdvance();
      }
    }

    function completeStrengthWorkout(rData) {
      const durationMin = state.sessionStartTime
        ? Math.max(1, Math.round((Date.now() - state.sessionStartTime) / 60000))
        : 38;

      const exSummary = {};
      rData.blocks.forEach(b => {
        b.exercises.forEach(ex => {
          const sets = state.sessionLogs[ex.id] || [];
          const w = ex.weightKey ? `${getEffectiveWeight(ex.weightKey, ex.defaultWeight)} kg` : 'PC';
          exSummary[ex.id] = {
            name: ex.name,
            code: ex.code,
            weight: w,
            minReps: ex.minReps,
            maxReps: ex.maxReps,
            sets: sets
          };
        });
      });

      const record = {
        id: Date.now(),
        timestamp: Date.now(),
        date: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
        day: state.day,
        weekPattern: state.weekPattern,
        type: 'strength',
        routineKey: rData.shortName,
        title: rData.title,
        durationMin,
        exercises: exSummary
      };

      state.history.push(record);
      state.completedDays[state.day] = true;
      saveState();
      showToast('✓ Entrenamiento guardado en Historial');
    }

    /* Botón inferior "Reiniciar ⇄": Reinicia la semana y alterna entre A-B-A y B-A-B */
    function resetWeekAndFlipPattern() {
      clearInterval(timerInterval);
      state.weekPattern = state.weekPattern === 'ABA' ? 'BAB' : 'ABA';
      state.completedDays = {};
      state.day = 1;
      state.activeModal = null;
      resetOnlyCurrentDaySession(false);
      saveState();
      const label = state.weekPattern === 'ABA' ? 'A-B-A (D1:A · D3:B · D5:A)' : 'B-A-B (D1:B · D3:A · D5:B)';
      showToast(`🔄 Semana reiniciada · Nuevo orden: ${label}`);
      render();
    }

    function flipWeekPatternManual() {
      state.weekPattern = state.weekPattern === 'ABA' ? 'BAB' : 'ABA';
      resetOnlyCurrentDaySession(false);
      saveState();
      showToast(`⇄ Orden semanal cambiado a ${state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B'}`);
      render();
    }

    /* Reinicia únicamente las series del día actual sin cambiar el patrón ABA/BAB */
    function resetOnlyCurrentDaySession(notify = true) {
      clearInterval(timerInterval);
      state.isResting = false;
      state.restRemaining = 0;
      state.stepIndex = 0;
      state.sessionLogs = {};
      state.manualExpandedBlocks = {};
      state.sessionStartTime = null;
      const days = getCycleDays();
      const dayObj = days.find(d => d.day === state.day);
      const effectiveType = dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;
      if (effectiveType === 'routineA' || effectiveType === 'routineB') {
        const rData = getRoutineData(effectiveType);
        const steps = buildStepsForRoutine(rData);
        if (steps[0]) {
          state.currentReps = steps[0].ex.defaultReps;
          state.expandedExId = steps[0].ex.id;
        }
      }
      if (notify) {
        showToast('↺ Series de hoy reiniciadas');
        render();
      }
    }

    /* =========================================================================
       7. TROTE URBANO MINIMALISTA (SIN NRC, SIN BOTONES +-, SIN SEGUNDOS)
       ========================================================================= */
    function formatPaceFromRun(distKm, totalMin) {
      const d = parseFloat(String(distKm).replace(',', '.'));
      const m = parseFloat(String(totalMin).replace(',', '.'));
      if (!d || d <= 0 || !m || m <= 0) return { text: "--'--\" /km", secPerKm: 0, optimal: false };
      const totalSec = m * 60;
      const secPerKm = Math.round(totalSec / d);
      const pMin = Math.floor(secPerKm / 60);
      const pSec = secPerKm % 60;
      const optimal = secPerKm >= 335 && secPerKm <= 365 && d >= 4.8 && d <= 6.5;
      return {
        text: `${pMin}'${String(pSec).padStart(2, '0')}" /km`,
        secPerKm,
        optimal
      };
    }

    function onCleanRunInput(field, rawVal) {
      const cleaned = String(rawVal).replace(',', '.');
      const num = parseFloat(cleaned);
      if (field === 'dist' && !isNaN(num) && num > 0) {
        state.runDistKm = Math.round(num * 100) / 100;
      } else if (field === 'min' && !isNaN(num) && num > 0) {
        state.runTotalMin = Math.round(num * 10) / 10;
      } else if (field === 'kcal') {
        state.runKcal = parseInt(rawVal, 10) || 0;
      }
      saveState();

      const pace = formatPaceFromRun(state.runDistKm, state.runTotalMin);
      const paceEl = document.getElementById('runLivePace');
      const badgeEl = document.getElementById('runLiveStatus');
      if (paceEl) paceEl.textContent = pace.text;
      if (badgeEl) {
        badgeEl.className = 'pace-status ' + (pace.optimal ? 'ok' : 'warn');
        badgeEl.textContent = pace.optimal ? '✓ ZONA AERÓBICA (5\'40"–6\'00")' : '⚡ FUERA DE RANGO META';
      }
    }

    function saveRunSession() {
      const pace = formatPaceFromRun(state.runDistKm, state.runTotalMin);
      const record = {
        id: Date.now(),
        timestamp: Date.now(),
        date: new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
        day: state.day,
        weekPattern: state.weekPattern,
        type: 'run',
        title: 'Trote Urbano',
        distKm: Number(state.runDistKm).toFixed(2),
        timeFormatted: `${state.runTotalMin} min`,
        pace: pace.text,
        kcal: state.runKcal
      };
      state.history.push(record);
      state.completedDays[state.day] = true;
      saveState();
      showToast('✓ Trote Urbano guardado en Historial');
      render();
    }

    /* =========================================================================
       8. GENERADOR DE REPORTE SEMANAL PARA CHAT + RESPALDO JSON
       ========================================================================= */
    function buildSummaryText(record) {
      if (!record) return '';
      if (record.type === 'run') {
        return [
          `📋 Fitllermo — ${record.title} (${record.date})`,
          `• Distancia: ${record.distKm} km`,
          `• Tiempo total: ${record.timeFormatted}`,
          `• Ritmo promedio: ${record.pace}`,
          `• Energía activa: ${record.kcal} kcal`
        ].join('\n');
      }
      const lines = [
        `📋 Fitllermo — ${record.title} (${record.date})`,
        `• Duración: ${record.durationMin} min · Orden semanal: ${record.weekPattern || state.weekPattern}`
      ];
      Object.values(record.exercises || {}).forEach(ex => {
        const setsStr = (ex.sets || []).map(s => `${s.reps}@RIR${s.rir}`).join(', ') || 'Sin series';
        lines.push(`• ${ex.code}. ${ex.name} (${ex.weight}): ${setsStr}`);
      });
      return lines.join('\n');
    }

    /* Genera el Reporte Semanal analítico listo para pegar en el chat */
    function buildWeeklyReportForChat() {
      const recent = state.history.slice(-10);
      if (recent.length === 0) {
        return '📈 REPORTE SEMANAL FITLLERMO\nAún no hay sesiones registradas en el historial.';
      }

      const strengthSessions = recent.filter(r => r.type === 'strength');
      const runSessions = recent.filter(r => r.type === 'run');
      const totalKm = runSessions.reduce((acc, r) => acc + (parseFloat(r.distKm) || 0), 0);

      const lines = [
        `📈 REPORTE SEMANAL DE PROGRESIÓN — FITLLERMO`,
        `• Esquema actual: ${state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B'} | Sesiones registradas: ${strengthSessions.length} fuerza + ${runSessions.length} trotes`,
        `• Volumen aeróbico acumulado: ${totalKm.toFixed(2)} km (${runSessions.map(r => `${r.distKm}km @ ${r.pace}`).join(' / ') || 'Sin trotes'})`,
        ``,
        `🏋️‍♂️ ESTADO POR EJERCICIO Y ALERTAS DE CARGA:`
      ];

      // Agrupar última aparición de cada ejercicio
      const latestByEx = {};
      strengthSessions.forEach(sess => {
        Object.entries(sess.exercises || {}).forEach(([exId, exData]) => {
          latestByEx[exId] = { ...exData, date: sess.date };
        });
      });

      Object.values(latestByEx).forEach(ex => {
        const sets = ex.sets || [];
        const setsTxt = sets.map(s => `${s.reps}@RIR${s.rir}`).join(', ');
        let statusNote = '✓ Mantener carga y buscar +1 rep';

        if (sets.length > 0 && ex.maxReps) {
          const parsed = sets.map(s => ({
            r: typeof s.reps === 'string' ? Math.min(...s.reps.split('/').map(Number).filter(n => !isNaN(n))) : Number(s.reps),
            rir: String(s.rir || '2')
          }));
          const allTop = parsed.every(p => p.r >= ex.maxReps);
          const allRes = parsed.every(p => p.rir === '2' || p.rir === '3+');
          const anyFail = parsed.filter(p => p.rir === '0').length >= 2;
          if (allTop && allRes) statusNote = '↑ SUBIR CARGA (+0.5 a +1 kg)';
          else if (anyFail) statusNote = '⚠ Fatiga alta (RIR 0) · Consolidar peso';
        }
        lines.push(`- ${ex.code} ${ex.name} [${ex.weight}]: ${setsTxt || 'S/D'} → ${statusNote}`);
      });

      lines.push(``, `💬 Nota para revisión en chat: Evaluar ajustes de peso/repeticiones según este bloque.`);
      return lines.join('\n');
    }

    function copyText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast('📋 Copiado al portapapeles'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('📋 Copiado al portapapeles');
      }
    }

    function exportBackupJSON() {
      const payload = {
        app: 'Fitllermo',
        exportedAt: new Date().toISOString(),
        weekPattern: state.weekPattern,
        customWeights: state.customWeights,
        restConfig: state.restConfig,
        completedDays: state.completedDays,
        history: state.history
      };
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateTag = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `fitllermo-backup-${dateTag}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📦 Respaldo JSON descargado');
    }

    function triggerFileImport() {
      const input = document.getElementById('jsonFileInput');
      if (input) {
        input.value = '';
        input.click();
      }
    }

    function handleFileImport(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.history)) {
            state.history = parsed.history;
            if (parsed.customWeights) state.customWeights = parsed.customWeights;
            if (parsed.restConfig) state.restConfig = { ...state.restConfig, ...parsed.restConfig };
            if (parsed.completedDays) state.completedDays = parsed.completedDays;
            if (parsed.weekPattern) state.weekPattern = parsed.weekPattern;
            saveState();
            render();
            showToast('✓ Historial y ajustes restaurados');
          } else {
            showToast('⚠ Archivo JSON no válido');
          }
        } catch (err) {
          showToast('⚠ Error al leer el archivo JSON');
        }
      };
      reader.readAsText(file);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    /* =========================================================================
       9. NAVEGACIÓN Y RENDERIZADO PRINCIPAL (CONSOLA UNIFICADA + REORDENAMIENTO)
       ========================================================================= */
    function selectDay(d) {
      clearInterval(timerInterval);
      state.day = d;
      state.activeModal = null;
      state.isResting = false;
      state.restRemaining = 0;
      state.stepIndex = 0;
      state.sessionLogs = {};
      state.manualExpandedBlocks = {};
      state.sessionStartTime = null;

      const days = getCycleDays();
      const dayObj = days.find(x => x.day === d);
      const effectiveType = dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;
      if (effectiveType === 'routineA' || effectiveType === 'routineB') {
        const rData = getRoutineData(effectiveType);
        const steps = buildStepsForRoutine(rData);
        if (steps[0]) {
          state.currentReps = steps[0].ex.defaultReps;
          state.expandedExId = steps[0].ex.id;
        }
      }
      saveState();
      render();
    }

    function closeModalsAndGoHome() {
      state.activeModal = null;
      render();
    }

    function toggleControlPanel() {
      state.activeModal = state.activeModal === 'panel' ? null : 'panel';
      render();
    }

    function toggleHistoryView() {
      state.activeModal = state.activeModal === 'history' ? null : 'history';
      render();
    }

    function toggleCompletedBlockExpand(blockId) {
      state.manualExpandedBlocks[blockId] = !state.manualExpandedBlocks[blockId];
      render();
    }

    function renderDaysStrip() {
      const days = getCycleDays();
      const nav = document.getElementById('daysStrip');
      nav.innerHTML = days.map(d => {
        const isAct = d.day === state.day && state.activeModal === null;
        const isDone = !!state.completedDays[d.day];
        return `
          <button class="day-btn ${isAct ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectDay(${d.day})">
            <span class="d-num">${d.short}</span>
            <span class="d-tag">${d.tag}</span>
          </button>
        `;
      }).join('');

      const subLbl = document.getElementById('brandSubLabel');
      if (subLbl) subLbl.textContent = `Ciclo ${state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B'} · RIR 1–2`;

      const patPill = document.getElementById('patternIndicator');
      if (patPill) patPill.textContent = `Orden: ${state.weekPattern === 'ABA' ? 'A-B-A' : 'B-A-B'} ⇄`;

      const pBtn = document.getElementById('panelToggleBtn');
      if (pBtn) pBtn.classList.toggle('active', state.activeModal === 'panel');

      const hBtn = document.getElementById('historyToggleBtn');
      if (hBtn) hBtn.classList.toggle('active', state.activeModal === 'history');
    }

    function render() {
      renderDaysStrip();
      const main = document.getElementById('mainContent');
      const mainBtn = document.getElementById('mainActionBtn');

      if (state.activeModal === 'panel') {
        mainBtn.className = 'btn-primary-action';
        mainBtn.innerHTML = '✓ Volver al Entrenamiento';
        renderControlPanelView(main);
        return;
      }

      if (state.activeModal === 'history') {
        mainBtn.className = 'btn-primary-action';
        mainBtn.innerHTML = '✓ Volver al Entrenamiento';
        renderHistoryView(main);
        return;
      }

      const days = getCycleDays();
      const dayObj = days.find(d => d.day === state.day);
      const effectiveType = dayObj.type === 'run_opt' ? state.day6Mode : dayObj.type;

      if (effectiveType === 'run') {
        mainBtn.className = 'btn-primary-action';
        mainBtn.innerHTML = '✓ Guardar Trote Urbano';
        renderRunView(main, dayObj.type === 'run_opt');
        return;
      }

      if (effectiveType === 'rest') {
        mainBtn.className = 'btn-primary-action';
        mainBtn.innerHTML = '✓ Marcar Descanso Completado';
        renderRestView(main, dayObj.type === 'run_opt');
        return;
      }

      // Vista de Fuerza (Rutina A o Rutina B)
      const rData = getRoutineData(effectiveType);
      const steps = buildStepsForRoutine(rData);
      const curStep = steps[state.stepIndex] || steps[steps.length - 1];
      const curEx = curStep.ex;
      const effWeight = curEx.weightKey ? getEffectiveWeight(curEx.weightKey, curEx.defaultWeight) : 0;
      const overload = getOverloadSuggestion(curEx);

      if (state.isResting) {
        mainBtn.className = 'btn-primary-action resting-mode';
        mainBtn.innerHTML = '⏭ Saltar Descanso y Seguir';
      } else {
        mainBtn.className = 'btn-primary-action';
        mainBtn.innerHTML = `✓ Serie Completada (${curStep.restAfter > 0 ? curStep.restAfter + 's' : 'Fin'})`;
      }

      // =======================================================================
      // 1. CONSOLA UNIFICADA "EN SERIE" (1 SOLA TARJETA COHESIVA)
      // =======================================================================
      let unifiedConsoleHTML = '';
      if (state.isResting) {
        const nextStep = steps[state.stepIndex + 1];
        unifiedConsoleHTML = `
          <section class="unified-console resting">
            <div class="uc-topbar">
              <div class="uc-status-left">
                <span class="uc-status-badge"><span class="pulse-dot"></span> DESCANSANDO</span>
                <span class="uc-round-pill">Paso ${state.stepIndex + 1}/${steps.length}</span>
              </div>
              <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--accent);font-weight:800">
                ${curStep.restLabel}
              </span>
            </div>

            <div class="rest-center-wrap">
              <div class="timer-display" id="liveTimerVal">${state.restRemaining.toFixed(1)}s</div>
              <div class="timer-controls">
                <button class="mini-t-btn" onclick="adjustRestTime(-15)">-15s</button>
                <button class="mini-t-btn" onclick="adjustRestTime(15)">+15s</button>
                <button class="mini-t-btn" onclick="skipRest()">Saltar ⏭</button>
              </div>
            </div>

            <div class="uc-bottom-rir" style="border-top:1px solid var(--border);justify-content:space-between">
              <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--muted)">
                SIGUIENTE: <strong style="color:var(--text)">${nextStep ? `${nextStep.ex.code} · ${nextStep.ex.name}` : 'Fin de la rutina'}</strong>
              </span>
              ${nextStep && nextStep.limbLabel ? `<span class="uc-limb-pill">${nextStep.limbLabel}</span>` : ''}
            </div>
          </section>
        `;
      } else {
        const curCustomW = curEx.weightKey && state.customWeights[curEx.weightKey] !== undefined
          ? state.customWeights[curEx.weightKey]
          : '';

        unifiedConsoleHTML = `
          <section class="unified-console">
            <!-- Franja Superior: Estado + Vuelta + Extremidad + Metrónomo -->
            <div class="uc-topbar">
              <div class="uc-status-left">
                <span class="uc-status-badge"><span class="pulse-dot"></span> EN SERIE · ${curEx.code}</span>
                <span class="uc-round-pill">Vuelta ${curStep.round}/${curStep.totalRounds}</span>
                ${curStep.limbLabel ? `<span class="uc-limb-pill">🦵/💪 ${curStep.limbLabel}</span>` : ''}
              </div>
              <button type="button" class="uc-metro-pill ${state.metroEnabled ? 'on' : ''}" onclick="toggleMetronome()" title="Activar/Desactivar pulso de Tempo">
                <span id="liveMetroLed" class="metro-led"></span>
                <span>⏱ ${Number(state.metroIntervalSec).toFixed(1)}s</span>
              </button>
            </div>

            <!-- Nombre del Ejercicio y Tempo -->
            <div class="uc-ex-header">
              <div class="uc-ex-title">${curEx.name}</div>
              <div class="uc-ex-tempo">Tempo: ${curEx.tempo}</div>
            </div>

            <!-- Franja Central: Repeticiones (Izq) + Carga y Sobrecarga (Der) -->
            <div class="uc-middle-grid">
              <div class="uc-subbox">
                <div class="uc-subbox-label">
                  <span>REPETICIONES</span>
                  <span>META ${curEx.minReps}–${curEx.maxReps}</span>
                </div>
                <div class="rep-stepper">
                  <button type="button" class="step-btn" onclick="adjustReps(-1)">−</button>
                  <div class="big-number" id="liveRepDisplay">${state.currentReps}</div>
                  <button type="button" class="step-btn" onclick="adjustReps(1)">+</button>
                </div>
                <div class="rep-target-foot">${curEx.unilateral ? 'Por lado' : 'Serie efectiva'}</div>
              </div>

              <div class="uc-subbox">
                <div>
                  <div class="uc-subbox-label">
                    <span>CARGA ACTIVA</span>
                    <span data-weight-badge="${curEx.weightKey || 'bw'}" style="color:var(--accent);font-weight:800">
                      ${curEx.weightKey ? effWeight + ' kg' : 'Corporal'}
                    </span>
                  </div>
                  ${curEx.weightKey ? `
                    <div class="uc-weight-row">
                      <input
                        type="number"
                        step="0.1"
                        inputmode="decimal"
                        class="live-weight-input"
                        data-weight-input="${curEx.weightKey}"
                        placeholder="${curEx.defaultWeight}"
                        value="${curCustomW}"
                        oninput="onWeightInputLive('${curEx.weightKey}', this.value, ${curEx.defaultWeight})"
                      />
                      <span class="unit-lbl">kg (Sug: ${curEx.defaultWeight})</span>
                    </div>
                  ` : `
                    <div style="font-family:var(--font-mono);font-size:12px;font-weight:800;color:var(--text);padding:6px 0">
                      Peso Corporal / Barra
                    </div>
                  `}
                </div>
                <div class="overload-badge ${overload.type}">
                  ${overload.label}
                </div>
              </div>
            </div>

            <!-- Franja Inferior: Esfuerzo RIR Integrado (Sin recargar DOM) -->
            <div class="uc-bottom-rir">
              <div class="uc-rir-label-wrap">
                <span class="uc-rir-title">Esfuerzo RIR (Meta 1–2)</span>
                <span class="uc-rir-hint" id="rirLiveHint">Objetivo ideal (2 en reserva)</span>
              </div>
              <div class="rir-grid">
                ${RIR_OPTIONS.map(r => `
                  <button type="button" class="rir-btn ${state.currentRIR === r ? 'active' : ''}" data-rir="${r}" onclick="setRIR('${r}')">
                    ${r}
                  </button>
                `).join('')}
              </div>
            </div>
          </section>
        `;
      }

      // =======================================================================
      // 2. REORDENAMIENTO DINÁMICO DE BLOQUES (ACTIVO SUBE, TERMINADO BAJA)
      // =======================================================================
      const sortedBlocks = [...rData.blocks].sort((a, b) => {
        const aDone = isBlockCompleted(a);
        const bDone = isBlockCompleted(b);
        if (aDone !== bDone) return aDone ? 1 : -1; // Los completados bajan al final
        return 0;
      });

      const capsulesHTML = sortedBlocks.map(block => {
        const blockDone = isBlockCompleted(block);
        const isBlockActive = curStep.blockId === block.id && !blockDone;
        const isCollapsed = blockDone && !state.manualExpandedBlocks[block.id];

        const cardsHTML = block.exercises.map((ex, idx) => {
          const isCurEx = curEx.id === ex.id && !blockDone;
          const isExpanded = state.expandedExId === ex.id;
          const exW = ex.weightKey ? `${getEffectiveWeight(ex.weightKey, ex.defaultWeight)} kg` : 'Peso Corp.';
          const loggedSets = state.sessionLogs[ex.id] || [];
          const prevRec = getLastExerciseRecord(ex.id);

          const setsChips = [];
          for (let s = 1; s <= block.rounds; s++) {
            const found = loggedSets.find(x => x.set === s);
            if (found) {
              setsChips.push(`<span class="set-chip done">S${s}: ${found.reps} <b>@RIR${found.rir}</b></span>`);
            } else if (isCurEx && curStep.round === s) {
              setsChips.push(`<span class="set-chip active-set">S${s}: En curso</span>`);
            } else {
              setsChips.push(`<span class="set-chip">S${s}: ${ex.minReps}–${ex.maxReps}</span>`);
            }
          }

          const prevText = prevRec && prevRec.sets && prevRec.sets.length
            ? prevRec.sets.map(s => `${s.reps}@RIR${s.rir}`).join(', ') + ` (${prevRec.weight})`
            : 'Sin registro previo';

          const cardMarkup = `
            <div class="ex-card ${isCurEx ? 'current' : ''} ${isExpanded ? 'expanded' : ''}">
              <div class="ex-card-head" onclick="toggleExpandEx('${ex.id}')">
                <div>
                  <div>
                    <span class="ex-code">${ex.code}</span>
                    <span class="ex-name">${ex.name}</span>
                  </div>
                  <div class="ex-subline">${ex.cue}</div>
                </div>
                <div class="ex-right-meta">
                  <span class="ex-weight-pill" data-weight-badge="${ex.weightKey || ''}">${exW}</span>
                  <span class="ex-reps-pill">${ex.minReps}–${ex.maxReps} reps ${ex.unilateral ? '/ lado' : ''}</span>
                </div>
              </div>

              <div class="sets-strip">
                ${setsChips.join('')}
              </div>

              <div class="ex-body">
                <div class="last-session-bar">
                  <span>📌 Última vez:</span>
                  <strong>${prevText}</strong>
                </div>
                <div class="bio-canvas">
                  ${getBiomechSVG(ex.diagram)}
                  <div class="bio-legend">
                    <span><i class="dot" style="background:#EA580C"></i><strong>Primario:</strong> ${ex.primaryMuscles}</span>
                    <span><i class="dot" style="background:#F4F4F0"></i><strong>Estabilizador:</strong> ${ex.secMuscles}</span>
                  </div>
                </div>
              </div>
            </div>
          `;

          if (block.type === 'biserie' && idx === 0 && block.exercises.length > 1) {
            return cardMarkup + `
              <div class="biserie-connector">
                <span>⇄ ALTERNAR BISERIE (${ex.restAfter}s descanso)</span>
              </div>
            `;
          }
          return cardMarkup;
        }).join('');

        return `
          <section class="biserie-capsule ${isBlockActive ? 'active-block' : ''} ${blockDone ? 'completed-block' : ''} ${isCollapsed ? 'collapsed' : ''}">
            <div class="capsule-header" onclick="${blockDone ? `toggleCompletedBlockExpand('${block.id}')` : ''}">
              <div class="capsule-title">
                <span>${blockDone ? '✓ ' + block.name + ' (Completado)' : block.name}</span>
              </div>
              <span class="capsule-pill ${blockDone ? 'done-pill' : ''}">
                ${blockDone ? (isCollapsed ? '▼ Ver detalle' : '▲ Ocultar') : `${block.rounds} vueltas`}
              </span>
            </div>
            <div class="capsule-BlockBody">
              ${cardsHTML}
            </div>
          </section>
        `;
      }).join('');

      const latestToday = [...state.history].reverse().find(h => h.day === state.day && h.type === 'strength');
      const summaryHTML = latestToday ? `
        <div class="summary-card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong style="font-size:12.5px;color:var(--accent)">✓ SESIÓN GUARDADA HOY</strong>
            <button class="chip-btn active" onclick="copyText(buildSummaryText(state.history.find(x=>x.id===${latestToday.id})))">📋 Copiar</button>
          </div>
          <div class="summary-pre">${buildSummaryText(latestToday)}</div>
        </div>
      ` : '';

      main.innerHTML = `
        ${unifiedConsoleHTML}
        ${summaryHTML}
        ${capsulesHTML}
      `;
    }

    /* =========================================================================

            </div>
            <div class="seg-group">
              <button class="seg-btn ${state.gripA === 'prono' ? 'active' : ''}" onclick="state.gripA='prono';saveState();render();">Prono</button>
              <button class="seg-btn ${state.gripA === 'supino' ? 'active' : ''}" onclick="state.gripA='supino';saveState();render();">Supino</button>
            </div>
          </div>

          <div class="panel-row">
            <div>
              <div class="panel-lbl">Rutina A · Vueltas del Bloque A</div>
              <div class="panel-sub">Biserie de Dominadas + Flexiones profundas.</div>
            </div>
            <div class="seg-group">
              <button class="seg-btn ${state.roundsBlockA_A === 3 ? 'active' : ''}" onclick="state.roundsBlockA_A=3;saveState();render();">3 Vueltas</button>
              <button class="seg-btn ${state.roundsBlockA_A === 4 ? 'active' : ''}" onclick="state.roundsBlockA_A=4;saveState();render();">4 Vueltas</button>
            </div>
          </div>

          <div class="panel-row">
            <div>
              <div class="panel-lbl">Rutina B · Variante Tríceps (B2)</div>
              <div class="panel-sub">Elige tu ejercicio de empuje de tríceps en Bloque B.</div>
            </div>
            <div class="seg-group">
              <button class="seg-btn ${state.variantB2_B === 'diamante' ? 'active' : ''}" onclick="state.variantB2_B='diamante';saveState();render();">Diamante</button>
              <button class="seg-btn ${state.variantB2_B === 'fondos' ? 'active' : ''}" onclick="state.variantB2_B='fondos';saveState();render();">Fondos</button>
            </div>
          </div>

          <div class="panel-row">
            <div>
              <div class="panel-lbl">Reiniciar Solo las Series de Hoy</div>
              <div class="panel-sub">Limpia el progreso del día actual sin rotar la semana A-B-A / B-A-B.</div>
            </div>
            <button class="seg-btn" onclick="resetOnlyCurrentDaySession(true)">↺ Reiniciar Hoy</button>
          </div>
        </section>

        <!-- 3. CARGAS ESTÁNDAR Y SUGERIDAS -->
        <section class="panel-section">
          <div class="panel-sec-title">
            <span>🏋️‍♂️ Cargas de Equipamiento (Vacío = Sugerido)</span>
          </div>
          ${equipInputsHTML}
        </section>

        <!-- 4. TIEMPOS DE DESCANSO EDITABLES -->
        <section class="panel-section">
          <div class="panel-sec-title">
            <span>⏳ Tiempos de Descanso (Segundos)</span>
          </div>
          <div class="panel-row">
            <span class="panel-lbl">Cambio de lado (Unilaterales)</span>
            <input type="number" class="weight-field" value="${state.restConfig.unilateral}" oninput="state.restConfig.unilateral=parseInt(this.value,10)||45;saveState();" />
          </div>
          <div class="panel-row">
            <span class="panel-lbl">Descanso Biserie Bloque A</span>
            <input type="number" class="weight-field" value="${state.restConfig.blockA}" oninput="state.restConfig.blockA=parseInt(this.value,10)||80;saveState();" />
          </div>
          <div class="panel-row">
            <span class="panel-lbl">Descanso Biserie Bloque B</span>
            <input type="number" class="weight-field" value="${state.restConfig.blockB}" oninput="state.restConfig.blockB=parseInt(this.value,10)||60;saveState();" />
          </div>
          <div class="panel-row">
            <span class="panel-lbl">Pausa Transición entre Bloques</span>
            <input type="number" class="weight-field" value="${state.restConfig.transition}" oninput="state.restConfig.transition=parseInt(this.value,10)||90;saveState();" />
          </div>
        </section>
      `;
    }

    /* =========================================================================
       11. VISTA DE TROTE URBANO (LIMPIA, SIN NRC, SIN BOTONES +-, SIN SEGUNDOS)
       ========================================================================= */
    function renderRunView(container, isOptionalDay6) {
      const pace = formatPaceFromRun(state.runDistKm, state.runTotalMin);
      const optSwitch = isOptionalDay6 ? `
        <div class="panel-section" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
          <span class="panel-lbl">Día 6 Flexible:</span>
          <div class="seg-group">
            <button class="seg-btn ${state.day6Mode === 'run' ? 'active' : ''}" onclick="state.day6Mode='run';saveState();render();">Trote Urbano</button>
            <button class="seg-btn ${state.day6Mode === 'rest' ? 'active' : ''}" onclick="state.day6Mode='rest';saveState();render();">Descanso</button>
          </div>
        </div>
      ` : '';

      const latestRun = [...state.history].reverse().find(h => h.type === 'run');

      container.innerHTML = `
        ${optSwitch}
        <div class="run-card">
          <div style="margin-bottom:12px">
            <div style="font-size:17px;font-weight:800">Trote Urbano</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px">Terreno plano · Registra tu distancia total y tiempo en minutos al finalizar.</div>
          </div>

          <div class="run-targets">
            <div class="run-stat-box">
              <span class="lbl">Volumen Meta</span>
              <span class="val">5,0–6,0 km</span>
            </div>
            <div class="run-stat-box">
              <span class="lbl">Duración Meta</span>
              <span class="val">30–35 min</span>
            </div>
            <div class="run-stat-box">
              <span class="lbl">Ritmo Meta</span>
              <span class="val">5'40"–6'00"</span>
            </div>
          </div>

          <!-- Casillas limpias: Solo Distancia Total (km) y Tiempo Total (min) -->
          <div class="run-inputs-grid">
            <div class="run-field-box">
              <label for="cleanDistInput">Distancia Total (km)</label>
              <input
                id="cleanDistInput"
                type="number"
                step="0.01"
                inputmode="decimal"
                class="run-clean-input"
                placeholder="5.50"
                value="${state.runDistKm}"
                oninput="onCleanRunInput('dist', this.value)"
              />
            </div>

            <div class="run-field-box">
              <label for="cleanMinInput">Tiempo Total (min)</label>
              <input
                id="cleanMinInput"
                type="number"
                step="0.5"
                inputmode="decimal"
                class="run-clean-input"
                placeholder="32"
                value="${state.runTotalMin}"
                oninput="onCleanRunInput('min', this.value)"
              />
            </div>
          </div>

          <div class="run-field-box" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
            <label for="cleanKcalInput" style="margin:0">Energía Activa Opcional (kcal)</label>
            <input
              id="cleanKcalInput"
              type="number"
              step="1"
              inputmode="numeric"
              class="weight-field"
              style="width:95px;font-size:15px"
              value="${state.runKcal}"
              oninput="onCleanRunInput('kcal', this.value)"
            />
          </div>

          <div class="run-pace-result">
            <div>
              <span style="font-size:10px;color:var(--muted);display:block;font-family:var(--font-mono)">RITMO PROMEDIO</span>
              <span class="pace-big" id="runLivePace">${pace.text}</span>
            </div>
            <span class="pace-status ${pace.optimal ? 'ok' : 'warn'}" id="runLiveStatus">
              ${pace.optimal ? '✓ ZONA AERÓBICA (5\'40"–6\'00")' : '⚡ FUERA DE RANGO META'}
            </span>
          </div>

          ${latestRun ? `
            <div class="last-session-bar">
              <span>📌 Último trote (${latestRun.date}):</span>
              <strong>${latestRun.distKm} km en ${latestRun.timeFormatted} (${latestRun.pace})</strong>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderRestView(container, isOptionalDay6) {
      const optSwitch = isOptionalDay6 ? `
        <div class="panel-section" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
          <span class="panel-lbl">Día 6 Flexible:</span>
          <div class="seg-group">
            <button class="seg-btn ${state.day6Mode === 'run' ? 'active' : ''}" onclick="state.day6Mode='run';saveState();render();">Trote Urbano</button>
            <button class="seg-btn ${state.day6Mode === 'rest' ? 'active' : ''}" onclick="state.day6Mode='rest';saveState();render();">Descanso</button>
          </div>
        </div>
      ` : '';

      container.innerHTML = `
        ${optSwitch}
        <div class="run-card" style="text-align:center;padding:28px 18px">
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:800;margin-bottom:6px">RECUPERACIÓN MUSCULAR Y ARTICULAR</div>
          <div style="font-size:20px;font-weight:800;margin-bottom:8px">Día de Descanso</div>
          <p style="font-size:12.5px;color:var(--muted);line-height:1.5;max-width:360px;margin:0 auto">
            Mantén tu meta de proteína diaria e hidratación para supercompensar las sesiones de fuerza (RIR 1–2) y descargar el impacto del trote.
          </p>
        </div>
      `;
    }

    /* =========================================================================
       12. VISTA DE HISTORIAL + REPORTE SEMANAL PARA CHAT + RESPALDO JSON
       ========================================================================= */
    function renderHistoryView(container) {
      const items = [...state.history].reverse();
      const weeklyReportText = buildWeeklyReportForChat();

      container.innerHTML = `
        <!-- GENERADOR DE REPORTE SEMANAL PARA PEGAR EN EL CHAT -->
        <section class="summary-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div>
              <strong style="font-size:13px;color:var(--accent)">📈 Reporte Semanal para Chat</strong>
              <div style="font-size:11px;color:var(--muted)">Copia este diagnóstico y pégalo en el chat para revisar cargas y progresión.</div>
            </div>
            <button class="chip-btn active" onclick="copyText(buildWeeklyReportForChat())">📋 Copiar Reporte</button>
          </div>
          <div class="summary-pre">${weeklyReportText}</div>
        </section>

        <!-- RESPALDO PERMANENTE JSON PARA iOS -->
        <section class="panel-section">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong style="font-size:12.5px">📲 Respaldo de Datos iOS (JSON)</strong>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--accent)">${state.history.length} sesiones</span>
          </div>
          <p style="font-size:11px;color:var(--muted);margin:4px 0 10px;line-height:1.35">
            Guarda una copia de tus entrenos o restaura un archivo previo cuando actualices tu repositorio.
          </p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button class="chip-btn active" style="justify-content:center" onclick="exportBackupJSON()">⬇ Exportar JSON</button>
            <button class="chip-btn" style="justify-content:center" onclick="triggerFileImport()">⬆ Importar JSON</button>
          </div>
        </section>

        ${items.length === 0 ? `
          <div class="run-card" style="text-align:center;padding:24px 16px">
            <div style="font-size:15px;font-weight:800;margin-bottom:4px">Sin sesiones registradas</div>
            <p style="font-size:12px;color:var(--muted)">Tus entrenamientos de Fuerza A, Fuerza B y Trote Urbano aparecerán aquí.</p>
          </div>
        ` : `
          <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px">
            <span style="font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--muted)">REGISTROS INDIVIDUALES (${items.length})</span>
            <button class="chip-btn" onclick="if(confirm('¿Borrar todo el historial?')){state.history=[];state.completedDays={};saveState();render();}">🗑 Limpiar</button>
          </div>
          ${items.map(rec => `
            <div class="panel-section" style="padding:12px">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                  <strong style="font-size:13px">${rec.title}</strong>
                  <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">${rec.date} · Día ${rec.day}</div>
                </div>
                <button class="chip-btn" onclick="copyText(buildSummaryText(state.history.find(x=>x.id===${rec.id})))">📋 Copiar</button>
              </div>
              <div class="summary-pre" style="margin-bottom:0">${buildSummaryText(rec)}</div>
            </div>
          `).join('')}
        `}
      `;
    }

    function toggleExpandEx(exId) {
      state.expandedExId = state.expandedExId === exId ? null : exId;
      render();
    }

    /* Inicialización */
    setupIOSPWA();
    loadState();
    if (state.metroEnabled) restartMetronomeLoop();
    const initDays = getCycleDays();
    const initDayObj = initDays.find(d => d.day === state.day);
    if (initDayObj && (initDayObj.type === 'routineA' || initDayObj.type === 'routineB')) {
      const initData = getRoutineData(initDayObj.type);
      const initSteps = buildStepsForRoutine(initData);
      if (initSteps[0]) {
        state.currentReps = initSteps[0].ex.defaultReps;
        state.expandedExId = initSteps[0].ex.id;
      }
    }
    render();
  </script>
</body>
</html>
