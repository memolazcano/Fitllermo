<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fitllermo</title>

  <!-- Configuración PWA nativa para iOS (Safari Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitllermo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#18181B" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="" />
  <link id="pwaManifest" rel="manifest" href="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Paleta 2: Grafito Suizo, Marfil & Naranja Braun */
      --bg: #18181B;
      --card: #242429;
      --card-alt: #1E1E23;
      --border: #32323A;
      --border-strong: #454550;
      --text: #F4F4F0;
      --muted: #9E9EA8;
      --primary: #F4F4F0;
      --primary-text: #18181B;
      --accent: #EA580C;
      --accent-soft: rgba(234, 88, 12, 0.16);
      --accent-text: #FFFFFF;
      --teal: #14B8A6;
      --teal-soft: rgba(20, 184, 166, 0.14);
      --amber: #F59E0B;
      --diag-bg: #151518;
      --body-sil: #2E2E36;
      --body-stroke: #686875;
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    /* Hide spin buttons on numeric inputs */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .app-shell {
      max-width: 500px;
      margin: 0 auto;
      padding: 14px 14px 32px;
    }

    /* Topbar Suizo */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .braun-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(234, 88, 12, 0.55);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .chip-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip-btn:hover {
      border-color: var(--border-strong);
    }
    .chip-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    /* Rotación de 7 Días con Indicador de Patrón ABA / BAB */
    .days-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .days-header-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .pattern-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(234, 88, 12, 0.35);
      padding: 2px 8px;
      border-radius: 99px;
      cursor: pointer;
    }
    .days-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }
    .day-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 12px;
      padding: 8px 2px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      position: relative;
    }
    .day-btn .d-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      display: block;
    }
    .day-btn .d-tag {
      font-size: 9.5px;
      font-weight: 700;
      display: block;
      margin-top: 2px;
      opacity: 0.85;
    }
    .day-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .day-btn.done::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* =========================================================================
       CONSOLA UNIFICADA "EN SERIE" (1 SOLA TARJETA COHESIVA)
       ========================================================================= */
    .unified-console {
      background: var(--card);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .unified-console.resting {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(234, 88, 12, 0.18);
    }

    /* Franja Superior de la Consola Unificada */
    .uc-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .uc-status-left {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .uc-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text);
    }
    .uc-status-badge .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .uc-round-pill {
      background: var(--primary);
      color: var(--primary-text);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .uc-limb-pill {
      background: var(--accent-soft);
      color: #FB923C;
      border: 1px solid rgba(234, 88, 12, 0.4);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .uc-metro-pill {
      background: var(--card-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .uc-metro-pill.on {
      background: var(--accent-soft);
      color: var(--text);
      border-color: var(--accent);
    }
    .metro-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .uc-metro-pill.on .metro-led {
      background: var(--accent);
    }
    @keyframes metro-flash {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      35% { transform: scale(1.45); opacity: 1; }
    }
    .metro-led.pulsing {
      animation: metro-flash 0.6s ease-out;
    }

    /* Cabecera del ejercicio en consola */
    .uc-ex-header {
      padding: 10px 0 8px;
    }
    .uc-ex-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .uc-ex-tempo {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Franja Central de la Consola (2 Columnas Internas: Reps + Carga) */
    .uc-middle-grid {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 370px) {
      .uc-middle-grid {
        grid-template-columns: 1fr;
      }
    }
    .uc-subbox {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .uc-subbox-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .rep-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 2px 0;
    }
    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:active {
      background: var(--primary);
      color: var(--primary-text);
    }
    .big-number {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
      text-align: center;
    }
    .rep-target-foot {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }

    .uc-weight-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-weight-input {
      width: 82px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }
    .live-weight-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .unit-lbl {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
    }
    .overload-badge {
      margin-top: 6px;
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
    }
    .overload-badge.up {
      background: var(--accent-soft);
      color: #FB923C;
      border: 1px solid rgba(234, 88, 12, 0.35);
    }
    .overload-badge.steady {
      background: var(--teal-soft);
      color: #2DD4BF;
      border: 1px solid rgba(20, 184, 166, 0.3);
    }
    .overload-badge.hold {
      background: rgba(245, 158, 11, 0.14);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Franja Inferior de la Consola (Selector RIR Integrado) */
    .uc-bottom-rir {
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .uc-rir-label-wrap {
      display: flex;
      flex-direction: column;
    }
    .uc-rir-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--text);
      text-transform: uppercase;
    }
    .uc-rir-hint {
      font-size: 10px;
      color: var(--muted);
    }
    .rir-grid {
      display: flex;
      gap: 5px;
      flex: 1;
      max-width: 220px;
    }
    .rir-btn {
      flex: 1;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 0;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .rir-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.35);
    }

    /* Estado Descanso dentro de la Consola Unificada */
    .rest-center-wrap {
      text-align: center;
      padding: 10px 0 6px;
    }
    .timer-display {
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -2px;
      line-height: 1;
      margin: 6px 0 10px;
    }
    .timer-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 320px;
      margin: 0 auto 10px;
    }
    .mini-t-btn {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .mini-t-btn:active {
      background: var(--primary);
      color: var(--primary-text);
    }

    /* =========================================================================
       CÁPSULAS DE BISERIE CON REORDENAMIENTO DINÁMICO (TERMINADOS AL FINAL)
       ========================================================================= */
    .biserie-capsule {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 12px;
      transition: all 0.25s ease;
    }
    .biserie-capsule.active-block {
      border-color: var(--border-strong);
    }
    .biserie-capsule.completed-block {
      opacity: 0.78;
      background: #1A1A1F;
      border-style: dashed;
    }
    .capsule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      cursor: pointer;
    }
    .capsule-BlockBody {
      margin-top: 10px;
    }
    .biserie-capsule.collapsed .capsule-BlockBody {
      display: none;
    }
    .capsule-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text);
    }
    .capsule-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
    }
    .capsule-pill.done-pill {
      background: var(--teal-soft);
      color: #2DD4BF;
      border-color: rgba(20, 184, 166, 0.35);
    }

    .biserie-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 6px 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
    }
    .biserie-connector::before,
    .biserie-connector::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .biserie-connector span {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 99px;
      color: var(--accent);
    }

    /* Tarjeta de Ejercicio */
    .ex-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      transition: all 0.18s ease;
    }
    .ex-card.current {
      border-color: var(--primary);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }
    .ex-card-head {
      padding: 12px 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .ex-code {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--text);
      margin-right: 6px;
    }
    .ex-card.current .ex-code {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }
    .ex-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .ex-subline {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
    }
    .ex-right-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .ex-weight-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      display: block;
    }
    .ex-reps-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }

    .sets-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 13px 10px;
    }
    .set-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .set-chip.done {
      background: rgba(244, 244, 240, 0.08);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .set-chip.done b {
      color: var(--accent);
    }
    .set-chip.active-set {
      border-color: var(--primary);
      color: var(--primary);
    }

    .ex-body {
      display: none;
      padding: 0 13px 13px;
      border-top: 1px solid var(--border);
    }
    .ex-card.expanded .ex-body {
      display: block;
    }

    .last-session-bar {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      background: var(--card-alt);
      border: 1px solid var(--border);
      padding: 6px 9px;
      border-radius: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .bio-canvas {
      background: var(--diag-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-top: 9px;
    }
    .bio-legend {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      padding: 0 4px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* =========================================================================
       PANEL DE CONTROL (⚙️ Panel) Y TROTE URBANO MINIMALISTA
       ========================================================================= */
    .panel-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .panel-sec-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
    }
    .panel-row:first-of-type {
      border-top: none;
      padding-top: 2px;
    }
    .panel-lbl {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
    }
    .panel-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .seg-group {
      display: flex;
      gap: 4px;
    }
    .seg-btn {
      background: var(--card-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }
    .weight-field {
      width: 72px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 6px 7px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }
    .weight-field:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Vista de Trote Urbano Minimalista */
    .run-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .run-targets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .run-stat-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px;
      text-align: center;
    }
    .run-stat-box .lbl {
      font-size: 10px;
      color: var(--muted);
      display: block;
    }
    .run-stat-box .val {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
      display: block;
    }
    .run-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .run-field-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .run-field-box label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
    }
    .run-clean-input {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }
    .run-clean-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .run-pace-result {
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }
    .pace-big {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
    }
    .pace-status {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .pace-status.ok {
      background: var(--teal-soft);
      color: #2DD4BF;
    }
    .pace-status.warn {
      background: var(--accent-soft);
      color: #FB923C;
    }

    /* Barra Inferior Fija */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(24, 24, 27, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 50;
    }
    .dock-inner {
      max-width: 500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.75fr 1fr;
      gap: 9px;
    }
    .btn-primary-action {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary-action.resting-mode {
      background: var(--accent);
      color: var(--accent-text);
    }
    .btn-secondary-action {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 14px 10px;
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Historial y Reporte Semanal */
    .summary-card {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 14px;
    }
    .summary-pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      white-space: pre-wrap;
      margin: 10px 0;
      line-height: 1.45;
    }
    .toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: 9px 16px;
      border-radius: 99px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 800;
      z-index: 100;
      display: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Copiado al portapapeles</div>

  <div class="app-shell">
    <!-- TOPBAR SUIZO -->
    <header class="topbar">
      <div class="brand-wrap" onclick="closeModalsAndGoHome()">
        <span class="braun-dot"></span>
        <div>
          <div class="brand-title">Fitllermo</div>
          <div class="brand-sub" id="brandSubLabel">Ciclo A-B-A · RIR 1–2</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="chip-btn" id="panelToggleBtn" onclick="toggleControlPanel()">⚙️ Panel</button>
        <button class="chip-btn" id="historyToggleBtn" onclick="toggleHistoryView()">📊 Historial</button>
      </div>
    </header>

    <!-- ENCABEZADO Y TIRA DE 7 DÍAS -->
    <div class="days-header">
      <span class="days-header-label">Rotación Semanal Continua</span>
      <span class="pattern-pill" id="patternIndicator" onclick="flipWeekPatternManual()" title="Toca para alternar orden A-B-A / B-A-B">
        Orden: A-B-A ⇄
      </span>
    </div>
    <nav class="days-strip" id="daysStrip"></nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="mainContent"></main>
  </div>

  <!-- BARRA INFERIOR FIJA -->
  <div class="bottom-dock" id="bottomDock">
    <div class="dock-inner">
      <button class="btn-primary-action" id="mainActionBtn" onclick="handlePrimaryAction()">
        ✓ Serie Completada
      </button>
      <button class="btn-secondary-action" onclick="resetWeekAndFlipPattern()" title="Reinicia la semana y alterna entre A-B-A y B-A-B">
        Reiniciar ⇄
      </button>
    </div>
  </div>

  <!-- Input oculto para importar respaldo JSON en iOS -->
  <input type="file" id="jsonFileInput" accept=".json,application/json" style="display:none" onchange="handleFileImport(event)" />

  <script>
    /* =========================================================================
       0. GENERADOR AUTOMÁTICO DE ÍCONO iOS Y MANIFEST PWA (Grafito Suizo + Braun)
       ========================================================================= */
    function setupIOSPWA() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#18181B';
        ctx.fillRect(0, 0, 512, 512);

        ctx.fillStyle = '#242429';
        ctx.strokeStyle = '#32323A';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.roundRect(44, 44, 424, 424, 88);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#F4F4F0';
        ctx.font = '800 250px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText('F', 125, 272);

        ctx.fillStyle = '#EA580C';
        ctx.beginPath();
        ctx.arc(356, 172, 42, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#EA580C';
        ctx.beginPath();
        ctx.roundRect(130, 368, 252, 22, 11);
        ctx.fill();

        const iconDataUrl = canvas.toDataURL('image/png');
        const appleIcon = document.getElementById('appleTouchIcon');
        if (appleIcon) appleIcon.href = iconDataUrl;

        const manifest = {
          name: 'Fitllermo',
          short_name: 'Fitllermo',
          start_url: '.',
          display: 'standalone',
          background_color: '#18181B',
          theme_color: '#18181B',
          icons: [{ src: iconDataUrl, sizes: '512x512', type: 'image/png' }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwaManifest');
        if (manifestLink) manifestLink.href = manifestUrl;
      } catch (e) {}
    }

    /* =========================================================================
       1. ESTADO GLOBAL, PATRÓN SEMANAL ALTERNADO (ABA / BAB) Y PERSISTENCIA
       ========================================================================= */
    const STORAGE_KEY = 'fitllermo_swiss_bento_v5';
    const RIR_OPTIONS = ['0', '1', '2', '3+'];

    let state = {
      day: 1,
      weekPattern: 'ABA',      // 'ABA' (D1:A, D3:B, D5:A) | 'BAB' (D1:B, D3:A, D5:B)
      sound: true,
      activeModal: null,       // null | 'panel' | 'history'
      // Metrónomo de Tempo Editable (Opción A)
      metroEnabled: false,
      metroIntervalSec: 1.0,   // Editable (ej. 0.8s, 1.0s, 1.2s, 1.5s)
      // Configuraciones condicionales de rutina
      gripA: 'prono',          // 'prono' | 'supino'
      roundsBlockA_A: 3,       // 3 o 4 vueltas en Bloque A de Rutina A
      variantB2_B: 'diamante', // 'diamante' | 'fondos'
      day6Mode: 'run',         // 'run' | 'rest'
      // Cargas personalizadas y tiempos de descanso editables
      customWeights: {},
      restConfig: {
        unilateral: 45,
        blockA: 80,
        blockB: 60,
        transition: 90,
        coreA: 45,
        coreB: 60
      },
      // Progreso de la sesión en curso
      stepIndex: 0,
      isResting: false,
      restRemaining: 0,
      currentReps: 8,
      currentRIR: '2',
      expandedExId: null,
      manualExpandedBlocks: {}, // Permite abrir un bloque completado que bajó al final
      sessionLogs: {},          // { exId: [{ set, reps, rir, weight, leftReps, rightReps }] }
      sessionStartTime: null,
      completedDays: {},
      // Trote Urbano limpio (solo km totales y minutos totales)
      runDistKm: 5.50,
      runTotalMin: 32,
      runKcal: 365,
      // Historial persistente en la app
      history: []
    };

    let timerInterval = null;
    let metroTimer = null;
    let sharedAudioCtx = null;

    /* Devuelve los 7 días según el patrón activo ('ABA' o 'BAB') */
    function getCycleDays() {
      const isABA = state.weekPattern === 'ABA';
      return [
        { day: 1, short: 'D1', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
        { day: 2, short: 'D2', tag: 'Trote',    type: 'run' },
        { day: 3, short: 'D3', tag: isABA ? 'Fuerza B' : 'Fuerza A', type: isABA ? 'routineB' : 'routineA' },
        { day: 4, short: 'D4', tag: 'Trote',    type: 'run' },
        { day: 5, short: 'D5', tag: isABA ? 'Fuerza A' : 'Fuerza B', type: isABA ? 'routineA' : 'routineB' },
        { day: 6, short: 'D6', tag: 'Trote/D',  type: 'run_opt' },
        { day: 7, short: 'D7', tag: 'Descanso', type: 'rest' }
      ];
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('fitllermo_swiss_bento_v2');
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            restConfig: { ...state.restConfig, ...(parsed.restConfig || {}) },
            isResting: false,
            restRemaining: 0,
            activeModal: null
          };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          day: state.day,
          weekPattern: state.weekPattern,
          sound: state.sound,
          metroEnabled: state.metroEnabled,
          metroIntervalSec: state.metroIntervalSec,
          gripA: state.gripA,
          roundsBlockA_A: state.roundsBlockA_A,
          variantB2_B: state.variantB2_B,
          day6Mode: state.day6Mode,
          customWeights: state.customWeights,
          restConfig: state.restConfig,
          completedDays: state.completedDays,
          runDistKm: state.runDistKm,
          runTotalMin: state.runTotalMin,
          runKcal: state.runKcal,
          history: state.history
        }));
      } catch (e) {}
    }

    /* =========================================================================
       2. DEFINICIÓN DE RUTINAS, BLOQUES Y EQUIPAMIENTO
       ========================================================================= */
    function getEffectiveWeight(weightKey, defaultWeight) {
      if (!weightKey) return 0;
      const custom = state.customWeights[weightKey];
      if (custom !== undefined && custom !== null && String(custom).trim() !== '' && !isNaN(Number(custom))) {
        return Number(custom);
      }
      return defaultWeight;
    }

    function getAllEquipmentCatalog() {
      return [
        {
          key: 'bulgara_db',
          name: 'Mancuerna Pesada (Rutina A · B1 Búlgara)',
          defaultWeight: 13.6,
          plates: '1×10 lb + 1×2,0 kg/lado = 13,6 kg (o 12,6 kg con 1,5 kg/lado)'
        },
        {
          key: 'curl_db',
          name: 'Par Mancuernas (Rutina A · B2 Curl Bíceps)',
          defaultWeight: 7.5,
          plates: '2×2,5 kg + 2×1,25 kg por barra = 7,5 kg por mano'
        },
        {
          key: 'lat_db',
          name: 'Par Mancuernas (Rutina A · B2 Laterales)',
          defaultWeight: 3.0,
          plates: '1×1,5 kg por lado = 3,0 kg (o 4,0 kg con 2,0 kg/lado)'
        },
        {
          key: 'crunch_plate',
          name: 'Disco Sobrecarga (Rutina A · C Crunches)',
          defaultWeight: 4.5,
          plates: '1 disco de 10 lbs (4,5 kg) o 2,5 kg al esternón'
        },
        {
          key: 'kb_heavy',
          name: 'Kettlebell Ajustable (Rutina B · RDL y Remo)',
          defaultWeight: 16.7,
          plates: 'Tope mango: 3×10 lbs + 1×2,5 kg + mango = 16,7 kg (o 14,2 kg)'
        }
      ];
    }

    function getRoutineData(routineType) {
      const rc = state.restConfig;
      if (routineType === 'routineA') {
        const isProno = state.gripA === 'prono';
        return {
          title: 'Rutina A · Tracción V, Empuje H y Cuádriceps',
          shortName: 'Rutina A',
          duration: '35–40 min',
          blocks: [
            {
              id: 'blockA',
              name: 'Bloque A · Biserie Principal',
              type: 'biserie',
              rounds: state.roundsBlockA_A,
              transitionRest: rc.transition,
              exercises: [
                {
                  id: 'A1_dom',
                  code: 'A1',
                  name: isProno ? 'Dominadas estrictas (Prono/Neutro)' : 'Dominadas estrictas (Agarre Supino)',
                  minReps: 6,
                  maxReps: 10,
                  defaultReps: 8,
                  unilateral: false,
                  weightKey: null,
                  defaultWeight: 0,
                  restAfter: rc.blockA,
                  tempo: 'Bajada 2s · Subida explosiva',
                  cue: 'Pecho busca la barra. Escápulas deprimidas antes de traccionar; baja en 2s controlados.',
                  diagram: 'pullup',
                  primaryMuscles: 'Dorsal ancho, Redondo mayor, Braquial',
                  secMuscles: 'Core, Bíceps, Romboides'
                },
                {
                  id: 'A2_push',
                  code: 'A2',
                  name: 'Flexiones profundas en manillas',
                  minReps: 8,
                  maxReps: 12,
                  defaultReps: 10,
                  unilateral: false,
                  weightKey: null,
                  defaultWeight: 0,
                  restAfter: rc.blockA,
                  tempo: '2s bajada · 1s pausa abajo',
                  cue: 'Codos a 45° (flecha). El pecho desciende bajo el nivel de las manillas con 1s de pausa.',
                  diagram: 'pushup_deep',
                  primaryMuscles: 'Pectoral mayor (déficit), Deltoides ant.',
                  secMuscles: 'Tríceps, Serrato, Core'
                }
              ]
            },
            {
              id: 'blockB',
              name: 'Bloque B · Biserie Unilateral + Accesorio',
              type: 'biserie',
              rounds: 3,
              transitionRest: rc.blockB,
              exercises: [
                {
                  id: 'B1_bulg',
                  code: 'B1',
                  name: 'Sentadilla Búlgara Contralateral',
                  minReps: 8,
                  maxReps: 10,
                  defaultReps: 9,
                  unilateral: true,
                  limbLabels: ['Pierna Izquierda', 'Pierna Derecha'],
                  restBetweenLimbs: rc.unilateral,
                  weightKey: 'bulgara_db',
                  defaultWeight: 13.6,
                  restAfter: rc.blockB,
                  tempo: 'Bajada controlada 2s',
                  cue: 'Mancuerna en la mano contraria a la pierna adelantada. Bajada en 2s.',

                  id: 'B2_lat',

                  minReps: 12,
                  maxReps: 15,
                  defaultReps: 13,
                  unilateral: false,
                  weightKey: 'lat_db',
                  defaultWeight: 3.0,
                  restAfter: rc.blockB,
                  tempo: 'Pausa breve arriba · 2s bajada',
                  cue: 'Eleva en el plano escapular (30° adelante) hasta el hombro sin impulso.',

            {
              id: 'blockC',
              name: 'Bloque C · Core Anterior',
              type: 'single',
              rounds: 3,
              transitionRest: 0,
              exercises: [
                {
                  id: 'C_crunch',
                  code: 'C',
                  name: 'Crunches con Disco al Esternón',
                  minReps: 12,
                  maxReps: 15,
                  defaultReps: 14,
                  unilateral: false,
                  weightKey: 'crunch_plate',
                  defaultWeight: 4.5,
                  restAfter: rc.coreA,
                  tempo: '2s pausa arriba · 3s bajada',
                  cue: 'Disco firme al esternón. Pausa de 2s arriba botando aire; bajada en 3s.',

                  secMuscles: 'Oblicuos internos'

              ]

        };
      }

      // RUTINA B
      const isDiamante = state.variantB2_B === 'diamante';
      return {
        title: 'Rutina B · Cadena Post., Tracción H y Empuje V',
        shortName: 'Rutina B',
        duration: '35–40 min',
        blocks: [
          {
            id: 'blockA_B',
            name: 'Bloque A · Biserie Cadera + Hombro Vertical',
            type: 'biserie',
            rounds: 3,
            transitionRest: rc.transition,
            exercises: [
              {
                id: 'B_A1_rdl',

                minReps: 8,
                maxReps: 10,
                defaultReps: 9,
                unilateral: true,
                limbLabels: ['Pierna Izquierda', 'Pierna Derecha'],
                restBetweenLimbs: rc.unilateral,
                weightKey: 'kb_heavy',
                defaultWeight: 16.7,
                restAfter: 70,
                tempo: 'Bisagra 2s · Empuje de talón',
                cue: 'Puntera trasera a la altura del talón delantero solo de apoyo. Cadera atrás.',
                diagram: 'rdl_bstance',
                primaryMuscles: 'Isquiosurales, Glúteo mayor',
                secMuscles: 'Erectores espinales, Core'
              },
              {
                id: 'B_A2_pike',
                code: 'A2',
                name: 'Pike Push-ups en Manillas',
                minReps: 8,
                maxReps: 10,
                defaultReps: 9,
                unilateral: false,
                weightKey: null,
                defaultWeight: 0,
                restAfter: rc.blockA,
                tempo: 'Trípode 2s bajada · Empuje vertical',
                cue: 'Cadera alta en V invertida. La cabeza desciende delante de las manos (trípode).',

              }
            ]
          },
          {
            id: 'blockB_B',
            name: 'Bloque B · Biserie Tracción H + Tríceps',
            type: 'biserie',
            rounds: 3,
            transitionRest: rc.blockB,
            exercises: [
              {
                id: 'B_B1_row',
                code: 'B1',
                name: 'Remo Unilateral con Kettlebell',
                minReps: 8,
                maxReps: 10,
                defaultReps: 9,
                unilateral: true,
                limbLabels: ['Brazo Izquierdo', 'Brazo Derecho'],
                restBetweenLimbs: rc.unilateral,
                weightKey: 'kb_heavy',
                defaultWeight: 16.7,
                restAfter: rc.blockB,
                tempo: '1s tracción a cadera · 2s bajada',
                cue: 'Torso plano paralelo al suelo apoyado en silla. Codo directo a la cadera.',
                diagram: 'kb_row',
                primaryMuscles: 'Dorsal ancho, Romboides, Deltoides post.',
                secMuscles: 'Bíceps, Core anti-rotación'
              },
              {

    function buildStepsForRoutine(routineData) {
      const steps = [];
      routineData.blocks.forEach((block, bIdx) => {
        for (let r = 1; r <= block.rounds; r++) {
          block.exercises.forEach((ex, eIdx) => {
            const isLastExInBlock = eIdx === block.exercises.length - 1;
            const isLastRound = r === block.rounds;
            const isLastBlock = bIdx === routineData.blocks.length - 1;

            if (ex.unilateral) {
              steps.push({
                blockId: block.id,
                blockName: block.name,
                round: r,
                totalRounds: block.rounds,
                ex: ex,
                limbIndex: 0,
                limbLabel: ex.limbLabels[0],
                restAfter: ex.restBetweenLimbs,
                restLabel: `Cambio de lado (${ex.restBetweenLimbs}s)`
              });
              let nextRest = ex.restAfter;
              let rLabel = `Transición Biserie (${ex.restAfter}s)`;
              if (isLastExInBlock && isLastRound) {
                nextRest = isLastBlock ? 0 : block.transitionRest;
                rLabel = isLastBlock ? 'Fin de sesión' : `Pausa Fin de Bloque (${nextRest}s)`;
              }
              steps.push({
                blockId: block.id,
                blockName: block.name,
                round: r,
                totalRounds: block.rounds,
                ex: ex,
                limbIndex: 1,
                limbLabel: ex.limbLabels[1],
                restAfter: nextRest,
                restLabel: rLabel
              });
            } else {
              let nextRest = ex.restAfter;
              let rLabel = block.type === 'biserie' ? `Descanso Biserie (${ex.restAfter}s)` : `Descanso Serie (${ex.restAfter}s)`;
              if (isLastExInBlock && isLastRound) {
                nextRest = isLastBlock ? 0 : block.transitionRest;
                rLabel = isLastBlock ? 'Fin de sesión' : `Pausa Fin de Bloque (${nextRest}s)`;
              }
              steps.push({
                blockId: block.id,
                blockName: block.name,
                round: r,
                totalRounds: block.rounds,
                ex: ex,
                limbIndex: null,
                limbLabel: null,
                restAfter: nextRest,
                restLabel: rLabel
              });
            }
          });
        }
      });
      return steps;
    }

    /* Verifica si un bloque ya tiene todas sus series completadas */
    function isBlockCompleted(block) {
      return block.exercises.every(ex => {
        const logged = state.sessionLogs[ex.id] || [];
        if (logged.length < block.rounds) return false;
        if (ex.unilateral) {
          return logged.every(s => s.rightReps !== null && s.rightReps !== undefined);
        }
        return true;
      });
    }

    /* =========================================================================
       3. MOTOR DE RIR QUIRÚRGICO, PESO EN VIVO Y SOBRECARGA (OPCIÓN C)
       ========================================================================= */
    function onWeightInputLive(weightKey, rawValue, defaultWeight) {
      if (!weightKey) return;
      const cleaned = String(rawValue).trim().replace(',', '.');
      if (cleaned === '') {
        delete state.customWeights[weightKey];
      } else {
        const num = parseFloat(cleaned);
        if (!isNaN(num) && num >= 0) {
          state.customWeights[weightKey] = num;
        }
      }
      saveState();

      const effective = getEffectiveWeight(weightKey, defaultWeight);
      document.querySelectorAll(`[data-weight-badge="${weightKey}"]`).forEach(el => {
        el.textContent = `${effective} kg`;
      });
      document.querySelectorAll(`input[data-weight-input="${weightKey}"]`).forEach(inp => {
        if (document.activeElement !== inp) {
          inp.value = state.customWeights[weightKey] !== undefined ? state.customWeights[weightKey] : '';
        }
      });
    }

    function setRIR(rirVal) {
      state.currentRIR = rirVal;
      document.querySelectorAll('.rir-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.rir === rirVal);
      });
      const capEl = document.getElementById('rirLiveHint');
      if (capEl) {
        const hints = {
          '0': 'Al fallo (0 en reserva)',
          '1': 'Óptimo alto (1 en reserva)',
          '2': 'Objetivo ideal (2 en reserva)',
          '3+': 'Carga liviana (3+ en reserva)'
        };
        capEl.textContent = hints[rirVal] || '';
      }
    }

    function adjustReps(delta) {
      state.currentReps = Math.max(1, state.currentReps + delta);
      const repEl = document.getElementById('liveRepDisplay');
      if (repEl) repEl.textContent = state.currentReps;
    }

    function getLastExerciseRecord(exId) {
      for (let i = state.history.length - 1; i >= 0; i--) {
        const item = state.history[i];
        if (item.exercises && item.exercises[exId]) {
          return item.exercises[exId];
        }
      }
      return null;
    }

    function getOverloadSuggestion(ex) {
      const prev = getLastExerciseRecord(ex.id);
      if (!prev || !prev.sets || prev.sets.length === 0) {
        return {
          type: 'steady',
          label: `Meta: ${ex.minReps}–${ex.maxReps} reps @ RIR 1–2`
        };
      }

      const parsedSets = prev.sets.map(s => ({
        reps: typeof s.reps === 'string'
          ? Math.min(...s.reps.split('/').map(Number).filter(n => !isNaN(n)))
          : Number(s.reps),
        rir: String(s.rir || '2')
      }));

      const allReachedTop = parsedSets.every(s => s.reps >= ex.maxReps);
      const allHadReserve = parsedSets.every(s => s.rir === '2' || s.rir === '3+');
      const countHighReserve = parsedSets.filter(s => s.rir === '3+').length;
      const countFailureOrUnder = parsedSets.filter(s => s.rir === '0' || s.reps < ex.minReps).length;

      if (allReachedTop && allHadReserve) {
        return {
          type: 'up',
          label: ex.weightKey
            ? `↑ Subir +0,5 a +1 kg (tope con RIR ≥ 2)`
            : `↑ Sumar +1 rep o lastre (tope con RIR ≥ 2)`
        };
      }
      if (countHighReserve >= 2) {
        return {
          type: 'up',
          label: `↑ RIR 3+ previo · Sugerido subir carga`
        };
      }
      if (countFailureOrUnder >= 2) {
        return {
          type: 'hold',
          label: `⚠ RIR 0 previo · Consolidar carga`
        };
      }
      return {
        type: 'steady',
        label: `✓ Mantener (${prev.weight || 'PC'}) · Buscar +1 rep`
      };
    }
